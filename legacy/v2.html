    border: 1px solid color-mix(in srgb, var(--uc) 45%, var(--line));
    border-radius: 7px;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--uc) 15%, var(--panel3)),
        color-mix(in srgb, var(--uc) 7%,  var(--panel2)));
    color: var(--dim); cursor: pointer; font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: border-color .13s, transform .1s, box-shadow .13s, color .13s, opacity .13s;
  }
  .utile.wide { width: auto; padding: 6px 14px 5px; }
  .utile.tight { padding: 5px 8px 4px; }
  .usym {
    position: relative; z-index: 2;
    font-size: 11.5px; font-weight: 800; letter-spacing: .03em; line-height: 1;
  }
  .utile.tight .usym { font-size: 10px; letter-spacing: .06em; }
  .ucost {
    position: relative; z-index: 2;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; line-height: 1;
    color: var(--pricec, var(--dimmer)); white-space: nowrap;
  }
  .utile.wide .ucost { font-size: 11px; display: flex; gap: 8px; }
  .utile.tight .ucost { font-size: 9.5px; gap: 6px; }

  .uprog { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .uprog::before, .uprog::after {
    content: ''; position: absolute; left: 0; height: 2px; width: var(--p, 0%);
    background: var(--uc); box-shadow: 0 0 7px var(--uc);
    border-radius: 2px; transition: width .18s linear;
  }
  .uprog::before { top: -1px; }
  .uprog::after  { bottom: -1px; }

  .utile.can {
    border-color: var(--uc);
    color: color-mix(in srgb, var(--uc) 70%, #fff);
    box-shadow: 0 0 15px -3px var(--uc);
  }
  .utile.gated { opacity: .5; }
  .utile:hover:not(.max):not(.owned) {
    transform: translateY(-2px);
    border-color: var(--uc); color: color-mix(in srgb, var(--uc) 70%, #fff);
    box-shadow: 0 8px 16px -8px #000, 0 0 20px -5px var(--uc);
  }
  .utile:active:not(.max):not(.owned) { transform: translateY(0) scale(.94); }
  .utile.max { opacity: .38; cursor: default; border-style: dashed; }

  /* shared hover card, parked in the viewport */
  #upop {
    position: absolute; z-index: 40; width: 300px; pointer-events: none;
    padding: 15px 17px; border-radius: 12px;
    background: rgba(9,12,18,.975);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line2); box-shadow: 0 22px 50px -18px #000;
    opacity: 0; transition: opacity .12s;
  }
  #upop.show { opacity: 1; }
  #upop .pt { font-size: 18px; font-weight: 700; letter-spacing: .01em; line-height: 1.25; }
  #upop .pe { font-size: 15.5px; color: var(--text); margin-top: 9px; line-height: 1.5; }
  #upop .pe em { color: var(--ember); font-style: normal; font-weight: 700; }
  #upop .pe b { color: var(--ember-hot); font-weight: 700; }
  #upop .pd { font-size: 13.5px; color: var(--dim); margin-top: 9px; line-height: 1.45; }
  #upop .pc { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; font-family: var(--mono); font-size: 14px; }
  #upop .pc span {
    padding: 5px 10px; border-radius: 6px; border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 7px; font-weight: 600;
  }
  #upop .pc span::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--c); box-shadow: 0 0 7px var(--c);
  }
  #upop .pc span.ok    { color: var(--text); background: #10141c; border-color: var(--line); }
  #upop .pc span.short { color: var(--bad); background: rgba(239,107,107,.10); border-color: rgba(239,107,107,.32); }
</style>
</head>
<body>
<div id="forge">
  <div id="embers"></div>
  <div id="world">
    <svg id="arc"></svg>
    <div id="linklabels"></div>
  </div>
  <div id="title"><b>SMELTWORKS</b></div>
  <div id="hint">
    height is temperature &middot; fuels feed the column from the left, metals pour out to the right<br>
    click a band to stoke it &middot; [space] works every tile &middot; drag to pan &middot; scroll to zoom &middot; [0] refits
  </div>
  <div id="camui">
    <button class="zbtn" id="cam-out" title="zoom out">&minus;</button>
    <span id="zlevel">100%</span>
    <button class="zbtn" id="cam-in" title="zoom in">+</button>
    <button id="cam-fit">fit</button>
    <button id="btn-reset">reset</button>
  </div>
  <div id="upop"></div>
</div>

<script>
'use strict';

/* =========================================================================
   THE COLUMN
        ^  240°  coal band
        |  160°  charcoal band
        |  100°  wood band
        |    0°
   Height IS temperature. Fuels enter on the left at the height they can
   reach; metals pour out on the right at the height they melt.
   ========================================================================= */

const BASE_CAP   = 5;
const HEAT_MAX   = 240;          // the top of the column, in degrees
const STOKE_CD   = 2.5;          // one shared cooldown for the whole furnace
const STOKE_FUEL = 5;            // units of fuel one stoke burns
const IDLE_COOL  = 0.55;         // degrees per second lost doing nothing
const METAL_DRAIN= 0.45;         // extra degrees per second, per pouring metal
const KILN_RATIO = 4;            // wood per charcoal

const BELLOWS_STEP = 1.20;       // heat per stoke, per level
const LINING_STEP  = 0.70;       // all heat loss, per level
const OVER_STEP    = 0.85;       // cycle time, per level

/* ---- the bands, bottom to top. A fourth is one more row. ---- */
const BANDS = [
  { id:'wood',     fuel:'wood',     lo:0,   hi:100, gain:25, cost:null },
  { id:'charcoal', fuel:'charcoal', lo:100, hi:160, gain:35, cost:{ iron:40,    stone:150 } },
  { id:'coal',     fuel:'coal',     lo:160, hi:240, gain:50, cost:{ mithril:40, iron:300 } },
];
const BAND_BY = {};
BANDS.forEach((b, i) => { b.idx = i; BAND_BY[b.id] = b; });

/* ---- the metals that pour out of the column ---- */
const METALS = [
  { id:'iron',       thr:0,   srate:0.80, input:null },
  { id:'mithril',    thr:120, srate:0.35, input:{ res:'iron',    per:2 } },
  { id:'adamantite', thr:200, srate:0.15, input:{ res:'mithril', per:2 } },
];
const METAL_BY = {};
METALS.forEach(m => METAL_BY[m.id] = m);

/* ---- the Great Work, four stages ---- */
const STAGES = [
  { name:'Foundation', verb:'LAY THE FOUNDATION', cost:{ stone:2000, iron:500 } },
  { name:'Frame',      verb:'RAISE THE FRAME',    cost:{ iron:2000, mithril:300 } },
  { name:'Crown',      verb:'SET THE CROWN',      cost:{ mithril:1500, adamantite:200 } },
  { name:'Ignition',   verb:'LIGHT IT',           cost:{ adamantite:1000 } },
];

/* ---- every tile on the board ---- */
const TILES = [
  { id:'wood',       name:'Wood',       sym:'Wd', color:'#d68a4c', kind:'click',
    unit:'logs',   verb:'CHOP',   yield:1, time:1800, unlock:null,
    pos:{ x:20, y:78 } },
  { id:'stone',      name:'Stone',      sym:'St', color:'#a9a49b', kind:'click',
    unit:'blocks', verb:'QUARRY', yield:1, time:2600, unlock:{ wood:20 },
    pos:{ x:20, y:92 } },
  { id:'charcoal',   name:'Charcoal',   sym:'Ch', color:'#9b8f80', kind:'click',
    unit:'lumps',  verb:'KILN',   yield:1, time:3000, unlock:{ iron:15, stone:50 },
    input:{ res:'wood', per:KILN_RATIO }, needsFurnace:true,
    pos:{ x:20, y:56 } },
  { id:'coal',       name:'Coal',       sym:'Co', color:'#7f8ea6', kind:'click',
    unit:'lumps',  verb:'MINE',   yield:1, time:3000, unlock:{ iron:60, stone:200 },
    needsFurnace:true,
    pos:{ x:20, y:34 } },

  { id:'furnace',    name:'Furnace',    sym:'Fu', color:'#f3ad55', kind:'facility',
    unlock:{ stone:20 },
    pos:{ x:50, y:94 } },

  { id:'iron',       name:'Iron',       sym:'Fe', color:'#c3d2e6', kind:'metal',
    unit:'ingots', yield:1, unlock:{ stone:40 }, needsFurnace:true,
    pos:{ x:80, y:78 } },
  { id:'mithril',    name:'Mithril',    sym:'Mi', color:'#5fd8e6', kind:'metal',
    unit:'ingots', yield:1, unlock:{ iron:120, stone:500 }, needsFurnace:true,
    pos:{ x:80, y:56 } },
  { id:'adamantite', name:'Adamantite', sym:'Ad', color:'#f0637f', kind:'metal',
    unit:'ingots', yield:1, unlock:{ mithril:180, iron:900, stone:4000 }, needsFurnace:true,
    pos:{ x:80, y:34 } },

  { id:'greatwork',  name:'Great Work', sym:'GW', color:'#f3d585', kind:'work',
    pos:{ x:80, y:10 } },
];
TILES.forEach(d => { if (d.kind === 'click' || d.kind === 'metal') d.cap = BASE_CAP; });

const BY_ID = {};
TILES.forEach(d => BY_ID[d.id] = d);
TILES.forEach(d => { const m = METAL_BY[d.id]; if (m) Object.assign(d, { thr:m.thr, srate:m.srate, input:m.input }); });

/* the next tier up — where automation's later levels are paid from */
function aboveOf(id) {
  return ({ wood:'stone', stone:'iron', charcoal:'iron', coal:'iron',
            iron:'mithril', mithril:'adamantite', adamantite:'adamantite' })[id] || id;
}

/* The map is a fixed logical size — the camera scales it into the viewport. */
const WORLD = { w: 1500, h: 2100 };
const COL   = { x: 50, top: 22, bottom: 88, w: 170 };   // x/top/bottom in % of world

/* the whole point of the layout: y on the map IS a temperature */
function heatAtPos(ypct) { return (COL.bottom - ypct) / (COL.bottom - COL.top) * HEAT_MAX; }
function posAtHeat(heat) { return COL.bottom - (heat / HEAT_MAX) * (COL.bottom - COL.top); }
function colX() { return COL.x / 100 * WORLD.w; }
function colYAt(heat) { return posAtHeat(heat) / 100 * WORLD.h; }

function slotPos(id) { return BY_ID[id].pos; }

/* =========================================================================
   UPGRADE DEFINITIONS

   Every upgrade costs exactly ONE resource. Storage, Haul and Overdrive are
   paid in the tile's own stock. Automation starts on the tile's own stock for
   two levels, then moves up to the tier above.
   ========================================================================= */

const CAP_GROWTH   = Math.pow(4, 1/3);   // 5 -> 8 -> 13 -> 20
const YIELD_GROWTH = 1.40;
const AUTO_RATE    = 0.15;               // units per second, per automation level
const AUTO_SELF_COSTS = [5, 10];

const U_CAP = { key:'cap', sym:'CAP', slot:'cap', name:'Storage', base:3, mult:1.50, max:30,
  eff: (o,l) => `Holds <em>&times;1.59</em> more &rarr; <b>${fmt(capOf(o, l+1))}</b> ${BY_ID[o].unit}.`,
  tip: 'Paid in this tile’s own stock. Three levels take it from 5 to 20.' };

const U_OUT = { key:'yield', sym:'OUT', slot:'out', name:'Bigger Haul', base:5, mult:1.70, max:30,
  eff: (o,l) => {
    const d = BY_ID[o];
    if (d.kind === 'metal')
      return `Every pour gives <em>&times;1.4</em> &rarr; <b>${fmt(metalRateAt(o, l+1, HEAT_MAX))}</b>/s at ` +
             `<b>${HEAT_MAX}&deg;</b>.` + (d.input
               ? `<br>It eats <b>${d.input.per}&times;</b> as much ${BY_ID[d.input.res].name} to do it.` : '');
    return `Each cycle gives <em>&times;1.4</em> &rarr; <b>${fmt(yieldOf(o, l+1))}</b>.` +
      (S.ores[o].lvl.auto > 0
        ? `<br>Automation rises with it, to <b>${fmt(autoRateAt(o, null, l+1))}</b>/s.`
        : `<br>It will lift Automation too, once you buy some.`);
  },
  tip: 'Paid in this tile’s own stock. Lifts everything this tile produces.' };

const U_OVR = { key:'over', sym:'OVR', slot:'ovr', name:'Overdrive', base:8, mult:1.65, max:12,
  eff: (o,l) => `Each hand cycle runs <em>&times;0.85</em> shorter: ` +
                `<em>${(timeAt(o,l)/1000).toFixed(2)}s</em> &rarr; <b>${(timeAt(o,l+1)/1000).toFixed(2)}s</b>.`,
  tip: 'Paid in this tile’s own stock. Only ever touches the cycle you click — ' +
       'Automation has no cycle to shorten.' };

const U_AUT = { key:'auto', sym:'AUT', slot:'aut', name:'Automation',
  base:5, mult:1.80, max:20, above:true,
  eff: (o,l) => `Works this tile on its own: <b>${fmt(autoRateAt(o, l+1))}</b>/s.` +
    (BY_ID[o].input
      ? `<br>It keeps eating <b>${BY_ID[o].input.per}</b> ${BY_ID[BY_ID[o].input.res].name} per unit, ` +
        `and stalls the moment that runs dry.` : '') +
    `<br>Every tile runs at once, and hand cycles stack on top.`,
  tip: '' };

const CLICK_UPGRADES = [U_CAP, U_OUT, U_OVR, U_AUT];
const METAL_UPGRADES = [U_CAP, U_OUT];

/* ---- the furnace's own three, paid in metal: iron buys machinery,
        mithril holds heat ---- */
const BELLOWS = { key:'bellows', name:'Bellows', max:5, pay:'iron',
  cost: l => ({ iron: Math.floor(20 * Math.pow(1.8, l)) }),
  label: l => l >= 5 ? 'Bellows: draught at maximum'
                     : `Bellows: ×${Math.pow(BELLOWS_STEP, l+1).toFixed(2)} heat per stoke`,
  eff: l => `Every stoke delivers <em>&times;1.2</em> more. A wood stoke goes ` +
            `<em>${fmt(BANDS[0].gain * Math.pow(BELLOWS_STEP, l))}&deg;</em> &rarr; ` +
            `<b>${fmt(BANDS[0].gain * Math.pow(BELLOWS_STEP, l+1))}&deg;</b>, coal ` +
            `<b>${fmt(BANDS[2].gain * Math.pow(BELLOWS_STEP, l+1))}&deg;</b>.`,
  tip: 'Paid in Iron. Fewer stokes to reach the same height — it never raises the ceiling, only the step.' };

const HOPPER = { key:'hopper', name:'Hopper', max:3, pay:'iron',
  cost: l => ({ iron: [30, 90, 270][l] }),
  label: l => l >= 3 ? 'Hopper: feeding wood, charcoal and coal'
                     : `Hopper: auto-stoke with ${['wood', 'wood + charcoal', 'wood, charcoal + coal'][l]}`,
  eff: l => `Feeds the furnace on its own whenever it is more than <b>10&deg;</b> below the ` +
            `ceiling, using the hottest fuel it is allowed and has in stock: ` +
            `<b>${['wood', 'wood and charcoal', 'wood, charcoal and coal'][l]}</b>.`,
  tip: 'Paid in Iron. It burns the same 5 units a hand stoke does, so keep the fuel coming.' };

const LINING = { key:'lining', name:'Lining', max:3, pay:'mithril',
  cost: l => ({ mithril: Math.floor(20 * Math.pow(2, l)) }),
  label: l => l >= 3 ? 'Lining: heat loss at minimum'
                     : `Lining: ×0.7 all heat loss`,
  eff: l => `All heat loss <em>&times;0.7</em>: idle cooling ` +
            `<em>${(IDLE_COOL * Math.pow(LINING_STEP, l)).toFixed(2)}&deg;/s</em> &rarr; ` +
            `<b>${(IDLE_COOL * Math.pow(LINING_STEP, l+1)).toFixed(2)}&deg;/s</b>, and each pouring metal ` +
            `drains <b>${(METAL_DRAIN * Math.pow(LINING_STEP, l+1)).toFixed(2)}&deg;/s</b> instead.`,
  tip: 'Paid in Mithril. Holding heat is what mithril is for.' };

const FURNACE_UPGRADES = [BELLOWS, HOPPER, LINING];

/* =========================================================================
   STATE
   ========================================================================= */

const SAVE_KEY = 'smeltworks.save.v3';

let S;

function freshOre(def) {
  return {
    unlocked: def.id === 'wood',
    amount: 0,
    heat: 0,
    cd: 0,                                   // shared stoke cooldown (furnace)
    bands: { wood:true, charcoal:false, coal:false },
    stage: 0,                                // great work
    lvl: { cap:0, yield:0, over:0, auto:0, bellows:0, hopper:0, lining:0 },
    progress: 0,
    running: false,
    lifetime: 0,
  };
}

function freshState() {
  const ores = {};
  TILES.forEach(d => ores[d.id] = freshOre(d));
  return { ores, cam: null };
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return freshState();
    const s = JSON.parse(raw);
    const base = freshState();
    if (!s || typeof s !== 'object' || !s.ores) return base;
    TILES.forEach(d => {
      const o = s.ores[d.id];
      if (!o || typeof o !== 'object') return;
      const t = base.ores[d.id];
      t.unlocked = !!o.unlocked || d.id === 'wood';
      t.lifetime = Number(o.lifetime) || 0;
      Object.keys(t.lvl).forEach(k => t.lvl[k] = Math.max(0, Number(o.lvl && o.lvl[k]) || 0));
      if (d.kind === 'facility') {
        BANDS.forEach(b => t.bands[b.id] = b.cost ? !!(o.bands && o.bands[b.id]) : true);
        t.heat = Math.max(0, Math.min(HEAT_MAX, Number(o.heat) || 0));
        t.cd   = Math.max(0, Math.min(STOKE_CD, Number(o.cd) || 0));
      } else if (d.kind === 'work') {
        t.stage = Math.max(0, Math.min(STAGES.length, Number(o.stage) || 0));
      } else {
        // levels first: a save written under older balance numbers must not
        // carry holdings above the capacity those levels actually grant
        const cap = Math.round(d.cap * Math.pow(CAP_GROWTH, t.lvl.cap));
        t.amount = Math.max(0, Math.min(Number(o.amount) || 0, cap));
      }
    });
    if (s.cam && Number.isFinite(s.cam.z)) {
      base.cam = { x: Number(s.cam.x) || 0, y: Number(s.cam.y) || 0, z: clampZoom(s.cam.z) };
    }
    return base;
  } catch (e) {
    return freshState();
  }
}

function save() {
  const slim = { ores: {}, cam: { x: cam.x, y: cam.y, z: cam.z } };
  TILES.forEach(d => {
    const o = S.ores[d.id];
    slim.ores[d.id] = { unlocked:o.unlocked, amount:o.amount, heat:o.heat, cd:o.cd,
                        bands:o.bands, stage:o.stage, lvl:o.lvl, lifetime:o.lifetime };
  });
  // storage can be unavailable (private mode, file:// restrictions, quota) —
  // the game must stay playable, just without persistence
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(slim)); } catch (e) { /* no save */ }
}

/* =========================================================================
   DERIVED STATS
   ========================================================================= */

function capOf(id, lvl) {
  const d = BY_ID[id];
  if (!d.cap) return Infinity;
  lvl = lvl ?? S.ores[id].lvl.cap;
  return Math.round(d.cap * Math.pow(CAP_GROWTH, lvl));
}
function yieldOf(id, lvl) {
  const d = BY_ID[id];
  lvl = lvl ?? S.ores[id].lvl.yield;
  return (d.yield || 1) * Math.pow(YIELD_GROWTH, lvl);
}
function timeAt(id, lvl) { return BY_ID[id].time * Math.pow(OVER_STEP, lvl); }
function timeOf(id)      { return timeAt(id, S.ores[id].lvl.over); }

function autoRateAt(id, autoLvl, yieldLvl) {
  if (BY_ID[id].kind !== 'click') return 0;
  const o = S.ores[id];
  const a = autoLvl  ?? o.lvl.auto;
  const y = yieldLvl ?? o.lvl.yield;
  if (a <= 0) return 0;
  return yieldOf(id, y) * AUTO_RATE * a;
}
function autoRate(id) { return autoRateAt(id); }

function heldOf(id) { return S.ores[id].unlocked ? Math.floor(S.ores[id].amount) : 0; }

/* ---- the furnace ---- */
function furnaceBuilt() { return S.ores.furnace.unlocked; }
function bandBuilt(bid) { return bid === 'wood' ? furnaceBuilt() : !!S.ores.furnace.bands[bid]; }
function heatOf()       { return furnaceBuilt() ? S.ores.furnace.heat : 0; }
function hasHeat()      { return heatOf() > 0; }

/* the top of the highest band actually built */
function ceilingHeat() {
  let c = 0;
  BANDS.forEach(b => { if (bandBuilt(b.id)) c = Math.max(c, b.hi); });
  return c;
}
function bellowsMult() { return Math.pow(BELLOWS_STEP, S.ores.furnace.lvl.bellows); }
function liningMult()  { return Math.pow(LINING_STEP,  S.ores.furnace.lvl.lining); }
function stokeGain(b)  { return b.gain * bellowsMult(); }

/* how much a stoke of this band would actually deliver, capped by both the
   fuel's own ceiling and the tallest band built */
function stokeReach(b) {
  const top = Math.min(b.hi, ceilingHeat());
  return Math.max(0, Math.min(top, heatOf() + stokeGain(b)) - heatOf());
}

function heatLoss(pouring) {
  return (IDLE_COOL + METAL_DRAIN * (pouring ?? pourCount)) * liningMult();
}

function canStoke(bid) {
  const b = BAND_BY[bid];
  if (!b || !bandBuilt(bid)) return false;
  if (S.ores.furnace.cd > 0) return false;
  if (stokeReach(b) <= 1e-9) return false;              // nothing left to give
  return heldOf(b.fuel) >= STOKE_FUEL;
}

/* ---- the metals ---- */
function metalRateAt(id, yieldLvl, heat) {
  const d = BY_ID[id];
  if (d.kind !== 'metal') return 0;
  return yieldOf(id, yieldLvl) * d.srate * ((heat ?? heatOf()) / 100);
}
function metalRate(id) { return metalRateAt(id); }

function metalBlocked(id) {
  const d = BY_ID[id];
  if (!furnaceBuilt()) return 'NEEDS A FURNACE';
  const h = heatOf();
  if (h <= 0) return 'FURNACE COLD · STOKE IT';
  if (h < d.thr) return `NEEDS ${d.thr}°`;
  if (d.input && S.ores[d.input.res].amount <= 0) return `NEEDS ${BY_ID[d.input.res].name.toUpperCase()}`;
  return null;
}

function totalRate(id) {
  const d = BY_ID[id];
  if (d.kind === 'metal') return metalBlocked(id) ? 0 : metalRate(id);
  return autoRate(id);
}

/* ---- reveal: only the next step of the ladder is on the board ---- */
function isRevealed(id) {
  const o = S.ores[id], d = BY_ID[id];
  if (d.kind === 'work') return S.ores.iron.unlocked;
  if (o.unlocked) return true;
  if (d.needsFurnace && !furnaceBuilt()) return false;
  if (!d.unlock) return true;
  return Object.keys(d.unlock).every(k => S.ores[k].unlocked);
}
/* a band shows its BUILD control once everything it wants is itself open */
function bandRevealed(b) {
  if (!b.cost) return furnaceBuilt();
  return bandBuilt(b.id) || Object.keys(b.cost).every(k => S.ores[k].unlocked);
}

function costProgress(cost) {
  let p = 1;
  for (const k in cost) p = Math.min(p, heldOf(k) / cost[k]);
  return Math.max(0, Math.min(1, p));
}
function unlockProgress(id) {
  const d = BY_ID[id];
  return d.unlock ? costProgress(d.unlock) : 1;
}

function payOre(id, def, lvl) {
  if (def.pay) return def.pay;
  if (!def.above) return id;
  if (lvl !== undefined && lvl < AUTO_SELF_COSTS.length) return id;
  return aboveOf(id);
}

function costOf(id, def, lvl) {
  if (def.cost) return def.cost(lvl);                    // furnace upgrades price themselves
  if (def.above && lvl < AUTO_SELF_COSTS.length) return { [id]: AUTO_SELF_COSTS[lvl] };
  // automation's curve restarts once it moves up a tier, so level 3 is cheap
  // again in the new — scarcer — currency
  const step = def.above ? lvl - AUTO_SELF_COSTS.length : lvl;
  const n = Math.max(1, Math.floor(def.base * Math.pow(def.mult, step)));
  return { [payOre(id, def, lvl)]: n };
}

function canPay(cost) {
  return Object.keys(cost).every(k => S.ores[k].unlocked && Math.floor(S.ores[k].amount) >= cost[k]);
}
function pay(cost) { Object.keys(cost).forEach(k => S.ores[k].amount -= cost[k]); }

function autoFeeds(id) {
  return BY_ID[id].kind === 'click' && S.ores[id].unlocked && autoRate(id) > 0;
}

function liveSet() {
  return TILES.filter(d => S.ores[d.id].running || autoFeeds(d.id) ||
                           (d.kind === 'metal' && S.ores[d.id].unlocked && !metalBlocked(d.id))
                    ).map(d => d.id);
}

function stageOf() { return S.ores.greatwork.stage; }
function stageDef() { return STAGES[stageOf()] || null; }

/* =========================================================================
   GAME LOOP
   ========================================================================= */

function isFull(id) { return BY_ID[id].cap && Math.floor(S.ores[id].amount) >= capOf(id); }

/* a kiln cycle needs its wood up front, and the wood scales with the haul */
function inputNeed(id) {
  const d = BY_ID[id];
  return d.input ? d.input.per * yieldOf(id) : 0;
}

function startCycle(id) {
  const d = BY_ID[id], o = S.ores[id];
  if (d.kind !== 'click') return false;
  if (!o.unlocked || o.running) return false;   // one cycle per tile at a time
  if (isFull(id)) return false;                 // nowhere to put the output
  if (d.input) {
    const need = inputNeed(id);
    if (S.ores[d.input.res].amount < need) return false;
    S.ores[d.input.res].amount -= need;         // consumed up front
  }
  o.running = true;
  o.progress = 0;
  return true;
}

function completeCycle(id) {
  const gain = yieldOf(id);
  addOre(id, gain);
  floatText(id, '+' + fmt(gain), BY_ID[id].color);
  punch(id);
}

function addOre(id, amt) {
  const o = S.ores[id], cap = capOf(id);
  const before = o.amount;
  o.amount = Math.min(cap, o.amount + amt);
  o.lifetime += o.amount - before;
}

let lastT = performance.now();
let pourCount = 0;               // metals currently pouring — drives heat drain
let heatNetNow = 0;              // what the gauge is doing right now, signed
const pourRate = {};             // per-metal live output, for the readouts

function tick(now) {
  const dt = Math.min(0.25, (now - lastT) / 1000);
  lastT = now;
  step(dt);
  paint();
  requestAnimationFrame(tick);
}

/* the hopper picks the hottest fuel it is allowed, has in stock, and that can
   still raise the temperature */
function hopperStoke() {
  const f = S.ores.furnace, lvl = f.lvl.hopper;
  if (!lvl || !furnaceBuilt() || f.cd > 0) return;
  if (f.heat >= ceilingHeat() - 10) return;
  let best = null;
  BANDS.forEach((b, i) => {
    if (i >= lvl) return;                      // level 1 = wood only, 2 = +charcoal, 3 = +coal
    if (!canStoke(b.id)) return;
    if (!best || b.hi > best.hi) best = b;
  });
  if (best) doStoke(best.id, true);
}

function step(dt) {
  const f = S.ores.furnace;

  if (furnaceBuilt()) {
    f.cd = Math.max(0, f.cd - dt);
    hopperStoke();
  }

  // click tiles: automation is a steady pour, hand cycles stack on top
  TILES.forEach(d => {
    if (d.kind !== 'click') return;
    const o = S.ores[d.id];
    if (!o.unlocked) return;

    if (autoFeeds(d.id) && !isFull(d.id)) {
      let amt = autoRate(d.id) * dt;
      if (d.input) {
        // an automated kiln keeps eating at the same ratio, and stalls dry
        const src = S.ores[d.input.res];
        amt = Math.min(amt, src.amount / d.input.per);
        if (amt > 0) src.amount -= amt * d.input.per;
      }
      if (amt > 0) addOre(d.id, amt);
    }

    if (!o.running) return;
    o.progress += dt * 1000 / timeOf(d.id);
    if (o.progress >= 1) {
      completeCycle(d.id);
      o.progress = 0;
      o.running = false;
    }
  });

  // metals, bottom of the ladder up, so iron reaches mithril the same tick
  const h = heatOf();
  let pouring = 0;
  METALS.forEach(m => {
    const o = S.ores[m.id];
    pourRate[m.id] = 0;
    if (!o.unlocked || h <= 0 || h < m.thr || isFull(m.id)) return;
    let want = metalRate(m.id) * dt;
    want = Math.min(want, capOf(m.id) - o.amount);
    if (m.input) want = Math.min(want, S.ores[m.input.res].amount / m.input.per);
    if (want <= 1e-9) return;
    if (m.input) S.ores[m.input.res].amount -= want * m.input.per;
    addOre(m.id, want);
    pourRate[m.id] = dt > 0 ? want / dt : 0;
    pouring++;
  });
  pourCount = pouring;

  if (furnaceBuilt()) {
    const loss = heatLoss(pouring);
    f.heat = Math.max(0, f.heat - loss * dt);
    heatNetNow = -loss;
  } else heatNetNow = 0;

  return liveSet();
}

/* =========================================================================
   DOM
   ========================================================================= */

const el = {
  forge:  document.getElementById('forge'),
  world:  document.getElementById('world'),
  arc:    document.getElementById('arc'),
  labels: document.getElementById('linklabels'),
  embers: document.getElementById('embers'),
  upop:   document.getElementById('upop'),
  zlevel: document.getElementById('zlevel'),
};

el.world.style.width  = WORLD.w + 'px';
el.world.style.height = WORLD.h + 'px';

const bars = {};
const linkEls = {};
let LINKS = [];
let upTiles = [];
let hovered = null;
let column = null;

function fmt(n) {
  if (!Number.isFinite(n)) return '∞';
  if (n < 1000) {
    if (n % 1 === 0 || n >= 10) return String(Math.floor(n));
    return n < 1 ? n.toFixed(2) : n.toFixed(1);   // sub-1 rates deserve the extra digit
  }
  const units = ['K','M','B','T','Qa','Qi','Sx','Sp'];
  let u = -1;
  while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + units[u];
}
function costWords(cost) {
  return Object.keys(cost).map(k => `<b>${fmt(cost[k])}</b> ${BY_ID[k].name.toLowerCase()}`).join(' + ');
}

/* =========================================================================
   CAMERA — pan by dragging, zoom on the wheel
   ========================================================================= */

const ZOOM_MIN = 0.16, ZOOM_MAX = 2.40;
let cam = { x: 0, y: 0, z: 1 };

function clampZoom(z) { return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)); }

function clampPan() {
  const W = el.forge.clientWidth, H = el.forge.clientHeight;
  const m = 160;
  cam.x = Math.min(W - m, Math.max(m - WORLD.w * cam.z, cam.x));
  cam.y = Math.min(H - m, Math.max(m - WORLD.h * cam.z, cam.y));
}

function applyCam() {
  clampPan();
  // land the map on whole device pixels — a half-pixel offset softens every
  // border and glyph on the board
  const dpr = window.devicePixelRatio || 1;
  const px = Math.round(cam.x * dpr) / dpr;
  const py = Math.round(cam.y * dpr) / dpr;
  el.world.style.transform = `translate(${px}px, ${py}px) scale(${cam.z})`;
  const pct = Math.round(cam.z * 100) + '%';
  if (el.zlevel.textContent !== pct) el.zlevel.textContent = pct;
}

function zoomAt(sx, sy, z) {
  const nz = clampZoom(z);
  if (nz === cam.z) return;
  cam.x = sx - (sx - cam.x) * (nz / cam.z);
  cam.y = sy - (sy - cam.y) * (nz / cam.z);
  cam.z = nz;
  applyCam();
}

let camSaveT;
function saveCam() { clearTimeout(camSaveT); camSaveT = setTimeout(save, 400); }

function zoomCenter(mult) {
  zoomAt(el.forge.clientWidth / 2, el.forge.clientHeight / 2, cam.z * mult);
  saveCam();
}

/* a tile's box in world units — untransformed, so the camera can't skew it */
function tileBox(id) {
  const bar = bars[id], n = bar.root;
  // a hidden card measures zero, so keep the last real size it reported
  if (n.offsetWidth) { bar._bw = n.offsetWidth; bar._bh = n.offsetHeight; }
  const w = bar._bw || 320, h = bar._bh || 130;
  return { cx: n.offsetLeft, cy: n.offsetTop,
           l: n.offsetLeft - w / 2, r: n.offsetLeft + w / 2,
           t: n.offsetTop  - h / 2, b: n.offsetTop  + h / 2 };
}

/* how far up the column is actually worth looking at yet */
function columnTopHeat() {
  let top = 0;
  BANDS.forEach(b => { if (bandRevealed(b)) top = Math.max(top, b.hi); });
  return top;
}

function columnBox() {
  const cx = colX();
  return { l: cx - COL.w / 2, r: cx + COL.w / 2 + 90,     // +90 leaves room for the ticks
           t: colYAt(columnTopHeat()), b: colYAt(0) };
}

function revealedBounds() {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  const eat = q => { l = Math.min(l, q.l); r = Math.max(r, q.r);
                     t = Math.min(t, q.t); b = Math.max(b, q.b); };
  TILES.forEach(d => { if (revealed.has(d.id)) eat(tileBox(d.id)); });
  if (revealed.has('furnace')) eat(columnBox());
  if (!Number.isFinite(l)) return { l: 0, t: 0, r: WORLD.w, b: WORLD.h };
  const pad = 70;
  return { l: l - pad, t: t - pad, r: r + pad, b: b + pad };
}

function fitCam() {
  const W = el.forge.clientWidth, H = el.forge.clientHeight;
  const g = revealedBounds(), gw = g.r - g.l, gh = g.b - g.t;
  // never blow a two-tile board up past life size
  cam.z = clampZoom(Math.min(1, W / gw, H / gh));
  cam.x = (W - gw * cam.z) / 2 - g.l * cam.z;
  cam.y = (H - gh * cam.z) / 2 - g.t * cam.z;
  applyCam();
}

/* The opening shot: Wood dead centre, pulled back just far enough that the
   Stone it feeds sits in the corner. */
function openingCam() {
  if (!revealed.has('stone')) return fitCam();
  if (revealed.has('furnace')) return fitCam();
  const W = el.forge.clientWidth, H = el.forge.clientHeight;
  const w = tileBox('wood'), s = tileBox('stone');
  const margin = 34;
  const dx = Math.abs(w.cx - s.l) + margin, dy = Math.abs(s.b - w.cy) + margin;
  cam.z = clampZoom(Math.min(1, (W / 2) / dx, (H / 2) / dy));
  cam.x = W / 2 - w.cx * cam.z;
  cam.y = H / 2 - w.cy * cam.z;
  applyCam();
}

el.forge.addEventListener('wheel', e => {
  e.preventDefault();
  const f = el.forge.getBoundingClientRect();
  // trackpad pinches arrive as ctrl+wheel and want a stronger response
  const k = e.ctrlKey ? 0.010 : 0.0016;
  const step = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX - f.left, e.clientY - f.top, cam.z * Math.exp(-step * k));
  hidePop();
  saveCam();
}, { passive: false });

/* Dragging pans from anywhere, tiles included — a drag past a few pixels
   cancels the click underneath so panning never smelts by accident. */
let drag = null, panned = false, swallowClick = false;

el.forge.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.button !== 1) return;
  drag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, id: e.pointerId };
  panned = false;
});

window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!panned) {
    if (Math.hypot(dx, dy) < 5) return;
    panned = true;
    el.forge.classList.add('grabbing');
    hovered = null;
    hidePop();
  }
  cam.x = drag.cx + dx;
  cam.y = drag.cy + dy;
  applyCam();
});

window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null;
  el.forge.classList.remove('grabbing');
  if (panned) { swallowClick = true; saveCam(); }
  panned = false;
});

el.forge.addEventListener('click', e => {
  if (!swallowClick) return;
  swallowClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);
</script>
<script>
'use strict';
/* =========================================================================
   LINKS

   A link runs between two ANCHORS. An anchor is either a tile, or a point on
   the furnace column at a given temperature — that is what lets a fuel line
   arrive at the height its band occupies rather than at the column's middle.
   ========================================================================= */

function anchorPoint(a) {
  if (a.t === 'col') return { x: colX(), y: colYAt(a.heat) };
  const q = tileBox(a.id);
  return { x: q.cx, y: q.cy };
}
function anchorBox(a) {
  if (a.t === 'col') {
    const cx = colX(), pad = 6;
    return { l: cx - COL.w / 2 - pad, r: cx + COL.w / 2 + pad,
             t: colYAt(HEAT_MAX) - pad, b: colYAt(0) + pad };
  }
  const q = tileBox(a.id), pad = 8;
  return { l: q.l - pad, r: q.r + pad, t: q.t - pad, b: q.b + pad };
}
const tileAt = id => ({ t:'tile', id });
const colAt  = h  => ({ t:'col',  heat:h });

/* Every line on the board, rebuilt whenever the ladder moves — the Great
   Work's lines change with its stage. */
function linkDefs() {
  const L = [];

  // one unlock line per ingredient
  TILES.forEach(d => {
    if (!d.unlock) return;
    Object.keys(d.unlock).forEach(src => L.push({
      key: d.id + '<' + src, kind:'unlock', src, tgt: d.id, need: d.unlock[src],
      a: tileAt(src), b: tileAt(d.id),
    }));
  });

  // wood into the kiln
  L.push({ key:'kiln', kind:'kiln', feed:true, src:'wood', tgt:'charcoal',
           a: tileAt('wood'), b: tileAt('charcoal') });

  // each fuel into its own band, level with it
  BANDS.forEach(b => L.push({
    key:'band~' + b.id, kind:'fuel', feed:true, band:b.id, src:b.fuel, tgt:'furnace',
    a: tileAt(b.fuel), b: colAt(heatAtPos(BY_ID[b.fuel].pos.y)),
  }));

  // the column out to each metal, at the height that metal melts
  METALS.forEach(m => L.push({
    key:'heat~' + m.id, kind:'heat', feed:true, metal:m.id, src:'furnace', tgt:m.id,
    a: colAt(m.thr > 0 ? m.thr : heatAtPos(BY_ID[m.id].pos.y)), b: tileAt(m.id),
  }));

  // iron feeds mithril feeds adamantite
  METALS.forEach(m => { if (!m.input) return; L.push({
    key:'chain~' + m.id, kind:'chain', feed:true, metal:m.id, src:m.input.res, tgt:m.id,
    a: tileAt(m.input.res), b: tileAt(m.id),
  }); });

  // the current stage of the Great Work, one line per metal it wants
  const st = stageDef();
  if (st) Object.keys(st.cost).forEach(src => {
    if (BY_ID[src].kind !== 'metal') return;    // stone is on the far side of the map
    L.push({ key:'gw<' + src, kind:'gw', src, tgt:'greatwork', need: st.cost[src],
             a: tileAt(src), b: tileAt('greatwork') });
  });

  return L;
}

function linkVisible(L) {
  if (!revealed.has(L.tgt)) return false;
  if (L.a.t === 'col' || L.b.t === 'col') { if (!revealed.has('furnace')) return false; }
  if (L.kind === 'fuel')  return revealed.has(L.src) && bandRevealed(BAND_BY[L.band]);
  if (L.kind === 'heat')  return true;
  if (L.src && BY_ID[L.src].kind !== 'facility') return revealed.has(L.src);
  return true;
}

function inBox(bx, p) { return p[0] > bx.l && p[0] < bx.r && p[1] > bx.t && p[1] < bx.b; }

/* bisect between a point known to be inside the box and one known to be
   outside it, and return the parameter that lands on the boundary */
function edgeT(bez, box, tIn, tOut) {
  for (let k = 0; k < 18; k++) {
    const m = (tIn + tOut) / 2;
    if (inBox(box, bez(m))) tIn = m; else tOut = m;
  }
  return tOut;
}

function buildLinks() {
  LINKS = linkDefs();
  Object.keys(linkEls).forEach(k => delete linkEls[k]);

  /* Lines into the same card are fanned apart so none hides another. A line
     with a column end is exempt: it arrives at the height that IS its meaning,
     and bowing it would be a lie — so it is left out of the fan entirely,
     rather than taking up a slot in it and shoving the others wide. */
  const byTarget = {};
  LINKS.forEach(L => {
    L._fan = !(L.a.t === 'col' || L.b.t === 'col');
    const g = byTarget[L.tgt] = byTarget[L.tgt] || [];
    L._fi = L._fan ? g.filter(x => x._fan).length : -1;
    g.push(L);
  });

  let svg = '', labels = '';
  Object.keys(byTarget).forEach(target => {
    const group = byTarget[target];
    const fanN = group.filter(x => x._fan).length;
    group.forEach(L => {
      const a = anchorPoint(L.a), b = anchorPoint(L.b);
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      const spread = !L._fan ? 0
                   : (L._fi - (fanN - 1) / 2) * Math.min(52, len * 0.15);
      const c = { x: (a.x + b.x) / 2 - dy / len * spread, y: (a.y + b.y) / 2 + dx / len * spread };
      const bez = t => { const u = 1 - t;
        return [u*u*a.x + 2*u*t*c.x + t*t*b.x, u*u*a.y + 2*u*t*c.y + t*t*b.y]; };

      /* Both ends start inside something that covers them. Walk in from each
         end to where the curve clears, and draw only the span between. */
      const sb = anchorBox(L.a), tb = anchorBox(L.b);
      const N = 48;
      let t0 = 0, t1 = 1;
      for (let k = 1; k <= N; k++) {
        const t = k / N;
        if (!inBox(sb, bez(t))) { t0 = edgeT(bez, sb, (k - 1) / N, t); break; }
      }
      for (let k = N - 1; k >= 0; k--) {
        const t = k / N;
        if (!inBox(tb, bez(t))) { t1 = edgeT(bez, tb, (k + 1) / N, t); break; }
      }
      if (!(t1 > t0)) { t0 = 0.46; t1 = 0.54; }   // boxes overlap: leave a stub

      const pts = [];
      for (let s = 0; s <= 24; s++) {
        const p = bez(t0 + (t1 - t0) * (s / 24));
        pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
      }
      const d = pts.join(' ');
      const col = BY_ID[L.src].color;
      svg += `<g class="link" data-k="${L.key}" style="--lc:${col}">
          <polyline class="lbase" points="${d}"/>
          <polyline class="lglow" points="${d}" pathLength="100" stroke-dasharray="0 200"/>
          <polyline class="lfill" points="${d}" pathLength="100" stroke-dasharray="0 200"/>
        </g>`;
      L._pts = pts.map(s => s.split(',').map(Number));
      labels += `<div class="llabel" data-k="${L.key}" style="--lc:${col}"></div>`;
    });
  });
  el.arc.setAttribute('viewBox', `0 0 ${WORLD.w} ${WORLD.h}`);
  el.arc.innerHTML = svg;
  el.labels.innerHTML = labels;

  LINKS.forEach(L => {
    const g = el.arc.querySelector(`.link[data-k="${CSS.escape(L.key)}"]`);
    linkEls[L.key] = { g, fill: g && g.querySelector('.lfill'),
                       glow: g && g.querySelector('.lglow'),
                       label: el.labels.querySelector(`.llabel[data-k="${CSS.escape(L.key)}"]`) };
  });
  placeLabels();
}

/* Slide each readout along its own curve to a spot that clears the tiles. */
function placeLabels() {
  const boxes = TILES.filter(d => revealed.has(d.id)).map(d => {
    const n = bars[d.id].root;
    const w = n.offsetWidth, h = n.offsetHeight;
    return { l: n.offsetLeft - w / 2 - 6, r: n.offsetLeft + w / 2 + 6,
             t: n.offsetTop  - h / 2 - 6, b: n.offsetTop  + h / 2 + 6 };
  });
  if (revealed.has('furnace')) {
    const cx = colX();
    boxes.push({ l: cx - COL.w / 2 - 6, r: cx + COL.w / 2 + 6,
                 t: colYAt(HEAT_MAX) - 6, b: colYAt(0) + 6 });
  }
  const clear = p => !boxes.some(x => p[0] > x.l && p[0] < x.r && p[1] > x.t && p[1] < x.b);
  const order = [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.2, 0.8];
  LINKS.forEach(L => {
    const e = linkEls[L.key];
    if (!e || !e.label || !L._pts) return;
    const at = t => L._pts[Math.min(L._pts.length - 1, Math.round(t * (L._pts.length - 1)))];
    const p = (order.map(at).find(clear)) || at(0.5);
    e.label.style.left = p[0].toFixed(1) + 'px';
    e.label.style.top  = p[1].toFixed(1) + 'px';
  });
}

/* what one link is reporting this frame: fill fraction, whether it is live,
   and the words on its label */
function linkReadout(L) {
  const h = heatOf();
  switch (L.kind) {
    case 'unlock': case 'gw': {
      const done = L.kind === 'unlock' && S.ores[L.tgt].unlocked;
      const p = done ? 1 : Math.min(1, heldOf(L.src) / L.need);
      return { p, lit: !done && p >= 1, done,
               txt: `${fmt(heldOf(L.src))}/${fmt(L.need)} ${BY_ID[L.src].sym}` };
    }
    case 'kiln': {
      const need = inputNeed('charcoal');
      const ok = S.ores.wood.amount >= need;
      return { p: Math.min(1, S.ores.wood.amount / need), lit: ok,
               txt: ok ? `${fmt(need)} Wd PER KILN CYCLE`
                       : `${fmt(heldOf('wood'))}/${fmt(need)} Wd` };
    }
    case 'fuel': {
      const b = BAND_BY[L.band], have = heldOf(b.fuel);
      const built = bandBuilt(b.id);
      const p = Math.min(1, have / STOKE_FUEL);
      return { p, lit: built && p >= 1,
               txt: !built ? `BAND NOT BUILT`
                  : p >= 1 ? `FUEL ${STOKE_FUEL} ${BY_ID[b.fuel].sym}`
                           : `${fmt(have)}/${STOKE_FUEL} ${BY_ID[b.fuel].sym}` };
    }
    case 'heat': {
      const m = METAL_BY[L.metal];
      const ok = h >= m.thr && h > 0;
      const p = m.thr > 0 ? Math.min(1, h / m.thr) : Math.min(1, h / 100);
      return { p, lit: ok, txt: ok ? `${Math.round(h)}°`
                                   : m.thr > 0 ? `NEEDS ${m.thr}°` : 'NO HEAT' };
    }
    case 'chain': {
      const m = METAL_BY[L.metal], rate = pourRate[m.id] || 0;
      const src = S.ores[m.input.res];
      if (rate > 0) return { p: 1, lit: true,
                             txt: `−${fmt(rate * m.input.per)}/s ${BY_ID[m.input.res].sym}` };
      const p = Math.min(1, src.amount / (m.input.per * 2));
      return { p, lit: false,
               txt: h < m.thr ? `WAITING · ${m.thr}°`
                              : `${m.input.per} ${BY_ID[m.input.res].sym} PER ${BY_ID[m.id].sym}` };
    }
  }
  return { p: 0, lit: false, txt: '' };
}

function paintLinks() {
  LINKS.forEach(L => {
    const e = linkEls[L.key];
    if (!e || !e.fill) return;
    const on = linkVisible(L);
    if (e.g) e.g.style.display = on ? '' : 'none';
    if (e.label) e.label.style.display = on ? '' : 'none';
    if (!on) return;

    const r = linkReadout(L);
    const srcOpen = BY_ID[L.src].kind === 'facility' ? furnaceBuilt() : S.ores[L.src].unlocked;

    const dash = (r.p * 100).toFixed(2) + ' 200';
    if (e.fill.getAttribute('stroke-dasharray') !== dash) {
      e.fill.setAttribute('stroke-dasharray', dash);
      if (e.glow) e.glow.setAttribute('stroke-dasharray', dash);
    }
    let cls = 'link' + (L.feed ? ' feed' : '');
    cls += r.done ? ' done' : (!srcOpen ? ' dormant' : (r.lit ? ' lit' : ''));
    if (e.g.getAttribute('class') !== cls) e.g.setAttribute('class', cls);

    if (!e.label) return;
    const lc = 'llabel' + (r.done || !srcOpen ? ' gone' : '');
    const txt = (r.done || !srcOpen) ? '' : r.txt;
    if (e.label.textContent !== txt) e.label.textContent = txt;
    if (e.label.className !== lc) e.label.className = lc;
  });
}

function buildEmbers() {
  let html = '';
  for (let i = 0; i < 26; i++) {
    const size = 2 + Math.random() * 4, dur = 9 + Math.random() * 12;
    html += `<div class="ember" style="
      left:${(Math.random()*100).toFixed(1)}%;
      width:${size.toFixed(1)}px; height:${size.toFixed(1)}px;
      opacity:${(.25+Math.random()*.5).toFixed(2)};
      --drift:${(Math.random()*120-60).toFixed(0)}px;
      animation-duration:${dur.toFixed(1)}s;
      animation-delay:-${(Math.random()*dur).toFixed(1)}s;"></div>`;
  }
  el.embers.innerHTML = html;
}
</script>
<script>
'use strict';
/* =========================================================================
   TILES AND THE COLUMN — construction
   ========================================================================= */

function buildBars() {
  TILES.forEach(d => {
    const p = slotPos(d.id);
    const node = document.createElement('div');
    node.className = 'ore';
    node.style.setProperty('--ore', d.color);
    node.style.left = p.x + '%';
    node.style.top  = p.y + '%';
    node.innerHTML = `
      <div class="obody">
        <div class="ore-head">
          <span class="ore-name">${d.name}</span>
          <span class="ore-tags"></span>
          <span class="uslot slot-ovr"></span>
          <span class="uslot slot-aut"></span>
        </div>
        <div class="amt">
          <span class="cur">0</span>
          <span class="capgrp"><span class="capv"></span><span class="uslot slot-cap"></span></span>
          <span class="rate"></span>
        </div>
        <div class="trackrow">
          <div class="track">
            <div class="fill"></div><div class="gloss"></div><div class="tstatus"></div>
          </div>
          <span class="uslot slot-out"></span>
        </div>
        <div class="cycbar"><div class="cyc"></div></div>
        <div class="lockmsg"></div>
      </div>
      <div class="ustrip"></div>`;
    node.querySelector('.obody').addEventListener('click', () => tileClick(d.id));
    el.world.appendChild(node);
    bars[d.id] = {
      root: node,
      tags: node.querySelector('.ore-tags'),
      fill: node.querySelector('.fill'),
      cyc:  node.querySelector('.cyc'),
      cycbar: node.querySelector('.cycbar'),
      status: node.querySelector('.tstatus'),
      amtRow: node.querySelector('.amt'),
      trackEl: node.querySelector('.trackrow'),
      slots: { cap: node.querySelector('.slot-cap'),
               out: node.querySelector('.slot-out'),
               ovr: node.querySelector('.slot-ovr'),
               aut: node.querySelector('.slot-aut') },
      cur:  node.querySelector('.cur'),
      capv: node.querySelector('.capv'),
      rate: node.querySelector('.rate'),
      lock: node.querySelector('.lockmsg'),
      strip: node.querySelector('.ustrip'),
      pos: p,
    };
  });
}

/* The column is one element with a band child per fuel. Bands are laid out by
   TEMPERATURE, not in equal slices, so the fill, the band edges and the metal
   ticks all read off the same scale. */
function buildColumn() {
  const node = document.createElement('div');
  node.id = 'col';
  node.style.left   = COL.x + '%';
  node.style.width  = COL.w + 'px';
  node.style.top    = COL.top + '%';
  node.style.height = (COL.bottom - COL.top) + '%';

  let bandHtml = '';
  BANDS.forEach((b, i) => {
    bandHtml += `<div class="band${i === 0 ? ' bottom' : ''}" data-b="${b.id}"
        style="--bc:${BY_ID[b.fuel].color};
               bottom:${(b.lo / HEAT_MAX * 100).toFixed(3)}%;
               height:${((b.hi - b.lo) / HEAT_MAX * 100).toFixed(3)}%">
        <div class="bandinfo">
          <div class="bandname">${BY_ID[b.fuel].name}</div>
          <div class="bandrange">${b.lo}° – ${b.hi}°</div>
          <div class="bandstat"></div>
          <div class="bandbuild"></div>
        </div>
      </div>`;
  });

  let tickHtml = '';
  METALS.forEach(m => {
    if (m.thr <= 0) return;
    tickHtml += `<div class="tk" data-m="${m.id}" style="--tc:${BY_ID[m.id].color};
        bottom:${(m.thr / HEAT_MAX * 100).toFixed(3)}%">
        <span class="tklab">${BY_ID[m.id].sym} ${m.thr}°</span></div>`;
  });

  node.innerHTML =
    `<div id="colinner">
       <div id="heatfill"></div><div id="heatglow"></div>
       ${bandHtml}
     </div>
     <div id="ticks">${tickHtml}</div>`;
  el.world.appendChild(node);

  column = {
    root: node,
    fill: node.querySelector('#heatfill'),
    glow: node.querySelector('#heatglow'),
    bands: {}, ticks: {},
  };
  BANDS.forEach(b => {
    const n = node.querySelector(`.band[data-b="${b.id}"]`);
    n.addEventListener('click', ev => {
      if (ev.target.closest('.utile')) return;      // the BUILD button owns its own click
      doStoke(b.id, false);
    });
    column.bands[b.id] = { node: n, stat: n.querySelector('.bandstat'),
                           build: n.querySelector('.bandbuild') };
  });
  METALS.forEach(m => { if (m.thr > 0) column.ticks[m.id] = node.querySelector(`.tk[data-m="${m.id}"]`); });
}

/* Show or hide whole tiles and their supply lines. */
const revealed = new Set();

function syncTiles(animate) {
  TILES.forEach(d => {
    const on = isRevealed(d.id), was = revealed.has(d.id);
    bars[d.id].root.style.display = on ? '' : 'none';
    if (on) { revealed.add(d.id); if (!was && animate) replay(bars[d.id].root, 'appear'); }
    else revealed.delete(d.id);
  });
  if (column) column.root.style.display = revealed.has('furnace') ? '' : 'none';
  fitRings();               // a tile just shown can finally be measured
}

function rebuildBoard(animate) {
  renderStrips();
  syncTiles(animate);
  buildLinks();
  placeLabels();
}

function replay(node, cls) {
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

function punch(id) {
  const b = bars[id];
  if (!b) return;
  replay(b.root, 'pop');
  replay(b.cur, 'tick');
}

function floatText(id, txt, color) {
  const b = bars[id];
  if (!b) return;
  const n = document.createElement('div');
  n.className = 'float';
  n.textContent = txt;
  n.style.color = color;
  n.style.left = b.pos.x + '%';
  n.style.top = (b.pos.y - 2) + '%';
  el.world.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

function floatAtHeat(txt, color, heat) {
  const n = document.createElement('div');
  n.className = 'float';
  n.textContent = txt;
  n.style.color = color;
  n.style.left = COL.x + '%';
  n.style.top = posAtHeat(heat) + '%';
  el.world.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}
</script>
<script>
'use strict';
/* =========================================================================
   PER-FRAME PAINT
   ========================================================================= */

function lockLines(d) {
  const head = unlockProgress(d.id) >= 1
    ? (d.kind === 'facility' ? 'READY TO BUILD' : 'READY TO OPEN')
    : 'LOCKED';
  return head + '<br>' + costWords(d.unlock);
}

function paintLocked(d, b) {
  b.amtRow.style.display = 'none';
  b.trackEl.style.display = 'none';
  b.cycbar.style.display = 'none';
  b.lock.style.display = '';
  const html = lockLines(d);
  if (b.lock.innerHTML !== html) b.lock.innerHTML = html;
  if (b.tags.innerHTML !== '') b.tags.innerHTML = '';
}

function setText(n, s) { if (n.textContent !== s) n.textContent = s; }
function setHTML(n, s) { if (n.innerHTML !== s) n.innerHTML = s; }
function setCls(n, s)  { if (n.className !== s) n.className = s; }

/* ---- the furnace base card: the numbers and the three upgrades ---- */
function paintFurnace(d, o, b) {
  let cls = 'ore facility';
  if (!o.unlocked) {
    cls += ' locked';
    if (unlockProgress(d.id) >= 1) cls += ' ready';
  } else if (o.heat > 0) cls += ' hot';
  if (b.root.classList.contains('hit')) cls += ' hit';
  if (b.root.classList.contains('appear')) cls += ' appear';
  if (b.root.className !== cls) b.root.className = cls;

  if (!o.unlocked) { paintLocked(d, b); return; }

  b.amtRow.style.display = '';
  b.trackEl.style.display = '';
  b.cycbar.style.display = '';
  b.lock.style.display = 'none';

  const ceil = ceilingHeat();
  b.fill.style.width = (o.heat / Math.max(1, ceil) * 100) + '%';
  setText(b.cur, fmt(o.heat) + '°');
  setText(b.capv, '/ ' + ceil + '°');

  setText(b.rate, (heatNetNow >= 0 ? '+' : '') + heatNetNow.toFixed(2) + '°/s');
  setCls(b.rate, 'rate' + (heatNetNow < 0 ? ' neg' : ''));

  let st = '', stCls = 'tstatus';
  if (o.cd > 0) st = `COOLDOWN · ${o.cd.toFixed(1)}S`;
  else if (o.heat >= ceil - 1e-6) st = `AT THE TOP OF THE COLUMN`;
  else { st = 'CLICK A BAND TO STOKE'; stCls += ' go'; }
  setText(b.status, st);
  setCls(b.status, stCls);

  // the rail drains from full as the shared cooldown runs out
  const cycP = o.cd > 0 ? o.cd / STOKE_CD : 0;
  b.cyc.style.width = Math.max(0, Math.min(100, cycP * 100)) + '%';
  setCls(b.cyc, 'cyc' + (o.cd > 0 ? ' on cool' : ''));

  const tag = (o.heat > 0 ? '<span class="tag on">LIT</span>' : '<span class="tag cold">COLD</span>') +
              (pourCount > 0 ? `<span class="tag on">${pourCount} POURING</span>` : '');
  setHTML(b.tags, tag);
}

/* ---- the Great Work ---- */
function paintWork(d, o, b) {
  const done = o.stage >= STAGES.length;
  const st = stageDef();
  let cls = 'ore work';
  if (done) cls += ' hot';
  else if (st && costProgress(st.cost) >= 1) cls += ' ready';
  else cls += ' locked';
  if (b.root.classList.contains('appear')) cls += ' appear';
  if (b.root.className !== cls) b.root.className = cls;

  b.amtRow.style.display = 'none';
  b.trackEl.style.display = 'none';
  b.cycbar.style.display = 'none';
  b.lock.style.display = '';

  setHTML(b.tags, done ? '<span class="tag on">COMPLETE</span>'
                       : `<span class="tag">STAGE ${o.stage + 1}/${STAGES.length}</span>`);
  setHTML(b.lock, done
    ? `<i>THE GREAT WORK BURNS</i><br>the column has nothing left to give it`
    : `<b>${st.name.toUpperCase()}</b><br>${costWords(st.cost)}`);
}

function paint() {
  TILES.forEach(d => {
    if (!revealed.has(d.id)) return;          // off the board entirely
    const o = S.ores[d.id], b = bars[d.id];
    if (d.kind === 'facility') { paintFurnace(d, o, b); return; }
    if (d.kind === 'work')     { paintWork(d, o, b); return; }

    const cap = capOf(d.id);
    let cls = 'ore';
    if (o.running) cls += ' run';
    if (!o.unlocked) {
      cls += ' locked';
      if (unlockProgress(d.id) >= 1) cls += ' ready';
    }
    if (o.unlocked && Math.floor(o.amount) >= cap) cls += ' full';
    if (d.kind === 'metal') cls += ' passive';       // nothing to click on this one
    if (b.root.classList.contains('pop')) cls += ' pop';
    if (b.root.classList.contains('hit')) cls += ' hit';
    if (b.root.classList.contains('appear')) cls += ' appear';
    if (b.root.className !== cls) b.root.className = cls;

    if (!o.unlocked) { paintLocked(d, b); return; }

    b.amtRow.style.display = '';
    b.trackEl.style.display = '';
    b.cycbar.style.display = '';
    b.lock.style.display = 'none';
    b.fill.style.width = Math.min(100, o.amount / cap * 100) + '%';

    const blocked = d.kind === 'metal' ? metalBlocked(d.id) : null;
    // on a metal the cycle rail becomes a live heat gauge, scaled to its own
    // threshold so it fills exactly as the metal comes online
    const cycP = d.kind === 'metal'
      ? Math.min(1, heatOf() / Math.max(d.thr || 100, 1))
      : o.progress;
    b.cyc.style.width = (cycP * 100) + '%';
    setCls(b.cyc, 'cyc' + ((d.kind === 'metal' ? heatOf() > 0 : o.running) ? ' on' : ''));

    let st = '', stCls = 'tstatus';
    if (isFull(d.id)) st = 'FULL · EXPAND STORAGE';
    else if (blocked) { st = blocked; stCls += ' cold'; }
    else if (d.kind === 'metal') st = `POURING AT ${Math.round(heatOf())}°`;
    else if (o.running) st = ((1 - o.progress) * timeOf(d.id) / 1000).toFixed(1) + 'S';
    else if (d.input && S.ores[d.input.res].amount < inputNeed(d.id)) {
      st = `NEEDS ${fmt(inputNeed(d.id))} ${BY_ID[d.input.res].sym.toUpperCase()}`;
      stCls += ' cold';
    }
    else { st = 'CLICK TO ' + d.verb; stCls += ' go'; }
    setText(b.status, st);
    setCls(b.status, stCls);

    setText(b.cur, fmt(o.amount));
    setText(b.capv, '/ ' + fmt(cap));
    const rate = totalRate(d.id);
    const rateTxt = rate > 0 ? '+' + fmt(rate) + '/s'
                  : (d.kind === 'metal' || autoRate(d.id) > 0) ? '· idle ·' : '';
    setText(b.rate, rateTxt);

    let tags = '';
    if (d.kind === 'metal') tags += blocked
      ? '<span class="tag cold">COLD</span>'
      : '<span class="tag on">POURING</span>';
    else tags += `<span class="tag${o.lvl.auto > 0 ? ' on' : ''}">AUTO ${o.lvl.auto}</span>`;
    setHTML(b.tags, tags);
  });

  paintColumn();
  paintLinks();
  paintUps();
}

/* ---- the column ---- */
function paintColumn() {
  if (!column || !revealed.has('furnace')) return;
  const h = heatOf(), ceil = ceilingHeat();
  const pct = (h / HEAT_MAX * 100).toFixed(2) + '%';
  if (column.fill.style.height !== pct) column.fill.style.height = pct;
  if (column.glow.style.height !== pct) column.glow.style.height = pct;
  setCls(column.root, furnaceBuilt() ? 'built' : '');
  column.root.id = 'col';

  BANDS.forEach(b => {
    const c = column.bands[b.id];
    const built = bandBuilt(b.id), shown = bandRevealed(b);
    setCls(c.node, 'band' + (b.idx === 0 ? ' bottom' : '') +
                   (built ? ' built' : ' locked'));
    c.node.style.opacity = shown || built ? '' : '.35';

    let st = '', cls = 'bandstat';
    if (!built) {
      st = shown ? `LOCKED · ${Object.keys(b.cost).map(k =>
                      fmt(b.cost[k]) + ' ' + BY_ID[k].sym).join(' + ')}`
                 : `SEALED`;
      cls += ' cold';
    } else if (S.ores.furnace.cd > 0) {
      st = `COOLDOWN ${S.ores.furnace.cd.toFixed(1)}S`;
    } else if (h >= Math.min(b.hi, ceil) - 1e-6) {
      st = h >= b.hi - 1e-6 ? `CAN'T PUSH PAST ${b.hi}°` : `CEILING IS ${ceil}°`;
      cls += ' cold';
    } else if (heldOf(b.fuel) < STOKE_FUEL) {
      st = `NEEDS ${STOKE_FUEL} ${BY_ID[b.fuel].sym}`;
      cls += ' cold';
    } else {
      st = `BURN ${STOKE_FUEL} ${BY_ID[b.fuel].sym} → +${fmt(stokeReach(b))}°`;
      cls += ' go';
    }
    setText(c.stat, st);
    setCls(c.stat, cls);
  });

  METALS.forEach(m => {
    const t = column.ticks[m.id];
    if (!t) return;
    const on = revealed.has(m.id);
    t.style.display = on ? '' : 'none';
    setCls(t, 'tk' + (h >= m.thr ? ' hot' : ''));
  });
}
</script>
<script>
'use strict';
/* =========================================================================
   UPGRADES — inline on the card, beside whatever they change
   ========================================================================= */

function applySpec(b, spec) {
  b._cur = spec;
  if (spec.tint) b.style.setProperty('--uc', BY_ID[spec.tint].color);
  if (spec.label !== undefined) {
    const l = b.querySelector('.ulabel');
    if (l && l.textContent !== spec.label) l.textContent = spec.label;
  }
  if (spec.sym !== undefined) {
    const s = b.querySelector('.usym');
    if (s && s.textContent !== spec.sym) s.textContent = spec.sym;
  }
  b._pop = { title: spec.title, eff: spec.eff, tip: spec.tip, cost: spec.cost };
  if (hovered === b) showPop(b);            // keep an open hover card current
}

function wireUp(b, spec, base) {
  b.addEventListener('mouseenter', () => { if (panned) return; hovered = b; showPop(b); });
  b.addEventListener('mouseleave', () => { if (hovered === b) { hovered = null; hidePop(); } });
  b.addEventListener('click', ev => {
    ev.stopPropagation();                   // never works the tile underneath
    const s = b._cur;
    if (s && s.cost && s.buy && canPay(s.cost)) s.buy();
  });
  upTiles.push({ node: b, prog: b.querySelector('.uprog'),
                 ring: b.querySelector('.uringbar'), base });
  applySpec(b, spec);
  return b;
}

/* re-read every live button's cost and description in place */
function refreshUps() {
  TILES.forEach(d => (bars[d.id].ups || []).forEach(b => applySpec(b, b._spec())));
  BANDS.forEach(b => { const n = bandBtns[b.id]; if (n) applySpec(n, n._spec()); });
}

const bandBtns = {};

function uTile(o, extra) {
  const b = document.createElement('button');
  b.className = 'utile wide' + (extra ? ' ' + extra : '');
  if (o.tint) b.style.setProperty('--uc', BY_ID[o.tint].color);
  const price = o.cost
    ? `<span class="ucost">` + Object.keys(o.cost).map(k =>
        `<span style="color:${BY_ID[k].color}">${fmt(o.cost[k])} ${BY_ID[k].sym}</span>`).join('') + `</span>`
    : '';
  b.innerHTML = `<span class="uprog"></span><span class="usym">${o.sym}</span>` + price;
  return wireUp(b, o, 'utile wide' + (extra ? ' ' + extra : ''));
}

/* a rounded-rect outline as a single path, starting at top centre and running
   clockwise, so stroke-dasharray fills it like a dial */
function ringPath(w, h, inset, r) {
  const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset;
  const rr = Math.max(0, Math.min(r, (x1 - x0) / 2, (y1 - y0) / 2));
  const cx = ((x0 + x1) / 2).toFixed(2);
  return `M${cx} ${y0} H${(x1 - rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${x1} ${(y0 + rr).toFixed(2)} ` +
         `V${(y1 - rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${(x1 - rr).toFixed(2)} ${y1} ` +
         `H${(x0 + rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${x0} ${(y1 - rr).toFixed(2)} ` +
         `V${(y0 + rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${(x0 + rr).toFixed(2)} ${y0} Z`;
}

function fitRings() {
  upTiles.forEach(t => {
    if (!t.ring || !t.node._fitRing) return;
    const w = t.node.clientWidth, h = t.node.clientHeight;
    if (!w || !h || (t._w === w && t._h === h)) return;
    t._w = w; t._h = h;
    t.ring.ownerSVGElement.setAttribute('viewBox', `0 0 ${w} ${h}`);
    t.ring.setAttribute('d', ringPath(w, h, 1, 7));
  });
}

function uText(o) {
  const b = document.createElement('button');
  b.className = 'utext';
  b._fitRing = true;
  if (o.tint) b.style.setProperty('--uc', BY_ID[o.tint].color);
  b.innerHTML =
    `<svg class="uring"><path class="uringbar" pathLength="100" style="stroke-dasharray:0 100"/></svg>` +
    `<span class="ulabel"></span>`;
  b.querySelector('.ulabel').textContent = o.label;
  return wireUp(b, o, 'utext');
}

/* a compact + that sits next to the number, bar or tag it affects */
function uBtn(o) {
  const b = document.createElement('button');
  b.className = 'ubtn';
  if (o.tint) b.style.setProperty('--uc', BY_ID[o.tint].color);
  b.innerHTML =
    `<svg class="uring" viewBox="0 0 28 28">` +
      `<path class="uringbar" pathLength="100" style="stroke-dasharray:0 100" d="` +
        `M14 1.25 H20.25 A6.5 6.5 0 0 1 26.75 7.75 V20.25 A6.5 6.5 0 0 1 20.25 26.75 ` +
        `H7.75 A6.5 6.5 0 0 1 1.25 20.25 V7.75 A6.5 6.5 0 0 1 7.75 1.25 Z"/>` +
    `</svg><span class="uplus"></span>`;
  return wireUp(b, o, 'ubtn');
}

function renderStrips() {
  upTiles = [];
  hovered = null;
  hidePop();
  TILES.forEach(d => renderStrip(d.id));
  renderBands();
  fitRings();
}

function upgradesFor(d) {
  if (d.kind === 'metal') return METAL_UPGRADES;
  if (d.kind === 'click') return CLICK_UPGRADES;
  return [];
}

function autoTip(id, lvl) {
  const self = BY_ID[id].name, a = aboveOf(id);
  if (lvl < AUTO_SELF_COSTS.length) {
    const after = a === id
      ? `${self} again — nothing sits above it`
      : `<b>${BY_ID[a].name}</b>, the tier above`;
    return `The first two levels are cheap and paid in ${self} itself ` +
           `(${AUTO_SELF_COSTS.join(', then ')}). Every level after that costs ${after}.`;
  }
  return a === id
    ? `${self} tops the ladder, so it keeps paying for its own automation.`
    : `Paid in <b>${BY_ID[a].name}</b>, the tier above ${self}.`;
}

function unlockBlurb(d) {
  if (d.kind === 'facility') {
    return `Raises the column. Its bottom <b>wood band</b> reaches <b>${BANDS[0].hi}&deg;</b>; ` +
           `click a band to burn <b>${STOKE_FUEL}</b> of its fuel and step the heat up. ` +
           `Heat leaks at <em>${IDLE_COOL}&deg;/s</em>, so a fire is only ever as hot as you keep it.`;
  }
  if (d.kind === 'metal') {
    return `Taps the column at <b>${d.thr}&deg;</b> — that is the height this tile sits at. ` +
           `Nothing to click: it pours <em>faster the hotter the column burns</em>, up to ` +
           `<b>${fmt(metalRateAt(d.id, 0, HEAT_MAX))}</b>/s at <b>${HEAT_MAX}&deg;</b>.` +
           (d.input ? `<br>It eats <b>${d.input.per}</b> ${BY_ID[d.input.res].name} per ingot.` : '');
  }
  if (d.input) {
    return `Brings <b>${d.name}</b> online at <b>0 / ${BASE_CAP}</b>. Each cycle swallows ` +
           `<b>${d.input.per}</b> ${BY_ID[d.input.res].name} and gives one back as ${d.name.toLowerCase()} — ` +
           `denser fuel, so it climbs higher up the column.`;
  }
  return `Brings <b>${d.name}</b> online at <b>0 / ${BASE_CAP}</b>. Fully manual until you automate it.`;
}

function upgradeSpec(id, u) {
  const o = S.ores[id], lvl = o.lvl[u.key];
  if (lvl >= u.max) {
    return { tint: payOre(id, u, lvl - 1), title: `${u.name} — maxed`,
             eff: u.eff(id, lvl - 1), tip: u.above ? autoTip(id, lvl - 1) : u.tip, cost: null };
  }
  const cost = costOf(id, u, lvl);
  return { tint: payOre(id, u, lvl), title: `${u.name} — level ${lvl}/${u.max}`,
           eff: u.eff(id, lvl), tip: u.above ? autoTip(id, lvl) : u.tip, cost,
           buy: () => { pay(cost); o.lvl[u.key]++; commit(); } };
}

function furnaceUpSpec(u) {
  const o = S.ores.furnace, lvl = o.lvl[u.key], maxed = lvl >= u.max;
  return {
    tint: u.pay,
    label: u.label(lvl),
    title: maxed ? `${u.name} — maxed` : `${u.name} — level ${lvl}/${u.max}`,
    eff: u.eff(maxed ? lvl - 1 : lvl),
    tip: u.tip,
    cost: maxed ? null : u.cost(lvl),
    buy: () => { pay(u.cost(lvl)); o.lvl[u.key]++; commit(); },
  };
}

function stageSpec() {
  const o = S.ores.greatwork, st = stageDef();
  if (!st) return { sym:'COMPLETE', title:'The Great Work', cost:null,
                    eff:'It is finished. The column feeds nothing but the fire above it now.', tip:'' };
  return {
    tint: 'greatwork', sym: st.verb, cost: st.cost,
    title: `${st.name} — stage ${o.stage + 1} of ${STAGES.length}`,
    eff: `Commits <b>${costWords(st.cost)}</b> to the Great Work` +
         (o.stage + 1 < STAGES.length
            ? ` and opens <b>${STAGES[o.stage + 1].name}</b>.`
            : ` and finishes it.`),
    tip: 'Each stage is spent for good. Only the current stage runs its lines to the tile.',
    buy: () => { pay(st.cost); o.stage++; commitUnlock(); },
  };
}

function renderStrip(id) {
  const d = BY_ID[id], o = S.ores[id], b = bars[id];
  b.strip.innerHTML = '';
  b.strip.className = 'ustrip';
  b.strip.style.display = 'none';
  Object.values(b.slots).forEach(s => s.innerHTML = '');
  b.ups = [];

  const add = (node, spec) => { node._spec = spec; b.ups.push(node); return node; };

  if (d.kind === 'work') {
    b.strip.style.display = '';
    const spec = () => stageSpec();
    b.strip.appendChild(add(uTile(spec()), spec));
    return;
  }

  // a locked card has no bars or figures to hang buttons off, so its one
  // action gets the bottom strip
  if (!o.unlocked) {
    b.strip.style.display = '';
    b.strip.appendChild(add(uTile({
      tint: id,
      sym: (d.kind === 'facility' ? 'BUILD ' : 'OPEN ') + d.name.toUpperCase(),
      title: (d.kind === 'facility' ? 'Build the ' : 'Open ') + d.name,
      eff: unlockBlurb(d),
      tip: 'Each ingredient runs in along its own supply line.',
      cost: d.unlock,
      buy: () => { pay(d.unlock); o.unlocked = true; commitUnlock(); },
    }), () => ({
      tint: id,
      sym: (d.kind === 'facility' ? 'BUILD ' : 'OPEN ') + d.name.toUpperCase(),
      title: (d.kind === 'facility' ? 'Build the ' : 'Open ') + d.name,
      eff: unlockBlurb(d), tip: 'Each ingredient runs in along its own supply line.',
      cost: d.unlock,
      buy: () => { pay(d.unlock); o.unlocked = true; commitUnlock(); },
    })));
    return;
  }

  // the furnace's three upgrades get the strip below the column
  if (d.kind === 'facility') {
    b.strip.style.display = '';
    b.strip.className = 'ustrip col';
    FURNACE_UPGRADES.forEach(u => {
      const spec = () => furnaceUpSpec(u);
      b.strip.appendChild(add(uText(spec()), spec));
    });
    return;
  }

  upgradesFor(d).forEach(u => {
    const slot = b.slots[u.slot];
    if (!slot) return;
    const spec = () => upgradeSpec(id, u);
    slot.appendChild(add(uBtn(spec()), spec));
  });
}

/* the BUILD control that sits inside a locked band */
function renderBands() {
  if (!column) return;
  BANDS.forEach(b => {
    const c = column.bands[b.id];
    c.build.innerHTML = '';
    delete bandBtns[b.id];
    if (!b.cost || bandBuilt(b.id) || !bandRevealed(b)) return;
    const spec = () => ({
      tint: b.fuel, cost: b.cost,
      sym: 'BUILD ' + BY_ID[b.fuel].name.toUpperCase() + ' BAND',
      title: `${BY_ID[b.fuel].name} band — ${b.lo}° to ${b.hi}°`,
      eff: `Extends the column to <b>${b.hi}&deg;</b> and lets you burn ` +
           `<b>${BY_ID[b.fuel].name}</b>: <b>${STOKE_FUEL}</b> per stoke for ` +
           `<b>+${fmt(b.gain * bellowsMult())}&deg;</b>, up to <b>${b.hi}&deg;</b>.`,
      tip: 'Each fuel can only push the column as far as its own band reaches.',
      buy: () => { pay(b.cost); S.ores.furnace.bands[b.id] = true; commitUnlock(); },
    });
    const n = uTile(spec(), 'tight');
    n._spec = spec;
    bandBtns[b.id] = n;
    c.build.appendChild(n);
  });
}

/* hover card, parked in the viewport so nothing clips it and zoom never
   stretches it */
function showPop(tile) {
  const p = tile._pop;
  if (!p) return;
  let html = `<div class="pt">${p.title}</div><div class="pe">${p.eff}</div>`;
  if (p.tip) html += `<div class="pd">${p.tip}</div>`;
  if (p.cost) {
    html += '<div class="pc">' + Object.keys(p.cost).map(k =>
      `<span data-ore="${k}" style="--c:${BY_ID[k].color}">${fmt(p.cost[k])} ${BY_ID[k].sym}</span>`
    ).join('') + '</div>';
  }
  el.upop.innerHTML = html;
  el.upop.classList.add('show');

  const f = el.forge.getBoundingClientRect();
  const t = tile.getBoundingClientRect();
  const u = el.upop.getBoundingClientRect();
  const gap = 14;
  const tx = t.left - f.left, ty = t.top - f.top, tw = t.width, th = t.height;
  const cands = [
    { x: tx + tw + gap,             y: ty + th / 2 - u.height / 2 },
    { x: tx - gap - u.width,        y: ty + th / 2 - u.height / 2 },
    { x: tx + tw / 2 - u.width / 2, y: ty + th + gap },
    { x: tx + tw / 2 - u.width / 2, y: ty - gap - u.height },
  ];
  const best = cands.find(c => c.x >= 6 && c.x + u.width <= f.width - 6 &&
                               c.y >= 6 && c.y + u.height <= f.height - 6) || cands[0];
  el.upop.style.left = Math.max(6, Math.min(best.x, f.width  - u.width  - 6)) + 'px';
  el.upop.style.top  = Math.max(6, Math.min(best.y, f.height - u.height - 6)) + 'px';
  paintUps();
}
function hidePop() { el.upop.classList.remove('show'); }

/* per-frame: run each button's edge rails toward its price, light it when payable */
function paintUps() {
  upTiles.forEach(t => {
    const cost = t.node._cur && t.node._cur.cost;
    const p = cost ? costProgress(cost) : 0;
    const pct = (p * 100).toFixed(1) + '%';
    if (t.prog && t.prog.style.getPropertyValue('--p') !== pct) t.prog.style.setProperty('--p', pct);
    if (t.ring) {
      const dash = (p * 100).toFixed(1) + ' 100';
      if (t.ring.style.strokeDasharray !== dash) t.ring.style.strokeDasharray = dash;
    }
    let cls = t.base;
    if (!cost) cls += ' max';
    else {
      if (p >= 1) cls += ' can';
      if (Object.keys(cost).some(k => !S.ores[k].unlocked)) cls += ' gated';
    }
    if (t.node.className !== cls) t.node.className = cls;
  });
  if (hovered && hovered._pop && hovered._pop.cost) {
    const cost = hovered._pop.cost;
    Object.keys(cost).forEach(k => {
      const s = el.upop.querySelector(`.pc span[data-ore="${k}"]`);
      if (!s) return;
      const have = S.ores[k].unlocked && Math.floor(S.ores[k].amount) >= cost[k];
      const c = have ? 'ok' : 'short';
      if (s.className !== c) s.className = c;
    });
  }
}
</script>
<script>
'use strict';
/* =========================================================================
   ACTIONS
   ========================================================================= */

/* A purchase only moves numbers: restate the existing buttons and leave every
   other cost ring exactly where it was. */
function commit() { refreshUps(); save(); }

/* An unlock puts a whole new tile or band on the board, so the strips, reveal,
   lines and labels all have to be redone. */
function commitUnlock() { rebuildBoard(true); save(); }

function doStoke(bid, silent) {
  if (!canStoke(bid)) return false;
  const b = BAND_BY[bid], f = S.ores.furnace;
  const gain = stokeReach(b);
  S.ores[b.fuel].amount -= STOKE_FUEL;
  f.heat = Math.min(HEAT_MAX, f.heat + gain);
  f.cd = STOKE_CD;
  floatAtHeat('+' + fmt(gain) + '°', BY_ID[b.fuel].color, f.heat);
  if (!silent) replay(column.bands[bid].node, 'hit');
  save();
  return true;
}

/* resource tiles start a work cycle; nothing else on the board is clickable */
function tileClick(id) {
  const d = BY_ID[id], o = S.ores[id];
  if (!o.unlocked) return;
  if (d.kind !== 'click') return;
  if (startCycle(id)) replay(bars[id].root, 'hit');
}

function workAll() {
  let any = false;
  TILES.forEach(d => {
    if (d.kind !== 'click') return;
    const o = S.ores[d.id];
    if (o.unlocked && !o.running && startCycle(d.id)) { replay(bars[d.id].root, 'hit'); any = true; }
  });
  return any;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Wipe all progress and start over?')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage unavailable */ }
  S = freshState();
  rebuildBoard(false);
  openingCam();
});
document.getElementById('cam-in').addEventListener('click', () => zoomCenter(1.25));
document.getElementById('cam-out').addEventListener('click', () => zoomCenter(1 / 1.25));
document.getElementById('cam-fit').addEventListener('click', () => { fitCam(); save(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); workAll(); return; }
  if (e.key === '0')            { fitCam(); save(); return; }
  if (e.key === '+' || e.key === '=') { zoomCenter(1.25); return; }
  if (e.key === '-' || e.key === '_') { zoomCenter(1 / 1.25); return; }
});

let relayout;
window.addEventListener('resize', () => {
  clearTimeout(relayout);
  relayout = setTimeout(() => { applyCam(); hidePop(); }, 120);
});

/* =========================================================================
   BOOT
   ========================================================================= */

S = load();
buildEmbers();
buildBars();
buildColumn();
rebuildBoard(false);
if (S.cam) { cam = S.cam; applyCam(); } else openingCam();
setInterval(save, 10000);
requestAnimationFrame(t => { lastT = t; tick(t); });

// debug handle — lets the sim be driven without a compositing frame loop
window.__sw = {
  get state() { return S; },
  get cam() { return cam; },
  step, paint, tileClick, workAll, startCycle, doStoke, canStoke, hopperStoke,
  renderStrips, rebuildBoard, buildLinks, refreshUps, commit, commitUnlock,
  unlockProgress, costProgress, costOf, aboveOf, payOre, autoFeeds, liveSet,
  autoRate, autoRateAt, metalRate, metalRateAt, totalRate, metalBlocked,
  heatOf, hasHeat, ceilingHeat, heatLoss, stokeGain, stokeReach, bellowsMult, liningMult,
  furnaceBuilt, bandBuilt, bandRevealed, heatAtPos, posAtHeat, colYAt,
  isRevealed, syncTiles, revealed, revealedBounds, tileBox, columnBox,
  fitCam, openingCam, zoomAt, applyCam, placeLabels, showPop, hidePop,
  save, load, freshState,
  get LINKS() { return LINKS; },
  BANDS, METALS, STAGES, TILES, WORLD, COL, HEAT_MAX,
  BELLOWS, HOPPER, LINING, CLICK_UPGRADES, METAL_UPGRADES,

  advance(seconds, slice = 1/60) {
    for (let t = 0; t < seconds; t += slice) step(slice);
    paint();
  },
  /* test helpers */
  give(id, n) { S.ores[id].amount = Math.min(capOf(id), (S.ores[id].amount || 0) + n); paint(); },
  setAmount(id, n) { S.ores[id].amount = n; paint(); },
  unlock(id) { S.ores[id].unlocked = true; commitUnlock(); },
  buildBand(id) { S.ores.furnace.bands[id] = true; commitUnlock(); },
  unlockAll() {
    TILES.forEach(d => S.ores[d.id].unlocked = true);
    BANDS.forEach(b => S.ores.furnace.bands[b.id] = true);
    commitUnlock();
  },
  stats: id => ({ cap: capOf(id), yield: yieldOf(id),
                  time: BY_ID[id].time ? timeOf(id) : null,
                  auto: autoRate(id), metal: metalRate(id), total: totalRate(id),
                  amount: S.ores[id].amount, unlocked: S.ores[id].unlocked }),
};
</script>
