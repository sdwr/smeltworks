   first ten waves, steel ones mostly after that, with a few iron among them.
   Nothing is pocketed by itself: it lies on the arena floor until clicked. */
const SEED_CHANCE  = 0.6;
const EMBER = {
  iron:  { name:'Iron Ember',  short:'IRON EMBER',  color:'#e08a4a' },
  steel: { name:'Steel Ember', short:'STEEL EMBER', color:'#8ec0ff' },
};
const EMBER_KINDS = ['iron', 'steel'];
function emberChance(wave) { return Math.min(0.5, 0.10 + 0.02 * wave); }   // 12% at 1, 30% at 10, 50% at 20
function emberKindFor(wave) { return wave <= 10 ? 'iron' : (Math.random() < 0.25 ? 'iron' : 'steel'); }
function rollDrops(wave) {
  const gold = Math.max(1, Math.round(goldFor(wave) * (0.5 + Math.random())));
  const seed = Math.random() < SEED_CHANCE ? seedKindFor(wave) : null;
  const ember = Math.random() < emberChance(wave) ? emberKindFor(wave) : null;
  return { gold, seed, ember };
}
/* the rows of the loot table, in the order they are drawn */
const LOOT_ROWS = [
  { k:'gold',  label:'GOLD',        color:'#ffd27a' },
  { k:'grain', label:'GRAIN SEED',  color:'#d9c26a' },
  { k:'iron',  label:'IRON EMBER',  color:'#e08a4a' },
  { k:'steel', label:'STEEL EMBER', color:'#8ec0ff' },
];
function floorOf(k) {
  const f = S.ores.battle.floor;
  return k === 'gold' ? f.gold : CROP_KINDS.includes(k) ? f.seeds[k] : f.embers[k];
}
function floorCount() { return LOOT_ROWS.reduce((a, r) => a + floorOf(r.k), 0); }
function embersHeld(kind) {
  const e = S.ores.battle.embers;
  return kind ? e[kind] : EMBER_KINDS.reduce((a, k) => a + e[k], 0);
}
/* pocket one row of the floor, or all of it */
function collectDrop(k) {
  const o = S.ores.battle, got = [];
  const take = key => {
    const n = floorOf(key);
    if (n <= 0) return;
    if (key === 'gold') { o.gold += n; o.floor.gold = 0; }
    else if (CROP_KINDS.includes(key)) { o.seedsOf[key] += n; o.floor.seeds[key] = 0; }
    else { o.embers[key] += n; o.floor.embers[key] = 0; }
    got.push(`+${n} ${LOOT_ROWS.find(r => r.k === key).label}`);
  };
  if (k === 'all') LOOT_ROWS.forEach(r => take(r.k)); else take(k);
  if (!got.length) { sfx('no'); return false; }
  punch('battle');
  sfx('clink');
  save();
  return true;
}

/* ---- starting deeper ----
   Once your best wave is five past a tier, that tier can be bought for gold,
   and a run may then begin there. Tiers are bought in order. */
const START_WAVES = [5, 10, 15, 20, 25];
function startCost(i) { return 200 * Math.pow(5, i); }
function startOpenAt(i) { return i < START_WAVES.length && S.ores.battle.best >= START_WAVES[i] + 5; }
function startChoices() { return [1].concat(START_WAVES.slice(0, S.ores.battle.starts)); }
function buyStart() {
  const o = S.ores.battle, i = o.starts;
  if (!startOpenAt(i)) { sfx('no'); return false; }
  const cost = { gold: startCost(i) };
  if (!canPay(cost)) { sfx('no'); return false; }
  pay(cost);
  o.starts++;
  o.startAt = START_WAVES[i];
  punch('battle');
  sfx('unlock');
  save();
  return true;
}
function setStart(w) {
  const o = S.ores.battle;
  if (!startChoices().includes(w) || o.startAt === w) return false;
  o.startAt = w;
  sfx('tick');
  save();
  return true;
}

/* what a tile HOLDS, as opposed to what the tile is called: Moulds holds Iron
   Bars, and every price and lock line wants the stock's name, not the bench's. */
function resName(id) { const d = BY_ID[id]; return d ? (d.res || d.name) : id; }

/* the next tier up. The field tops the ladder, so it has nothing above it and
   is worked by hand for good — while it is what pays for the bench's. */
function aboveOf(id) {
  return ({ wood:'stone', stone:'iron', iron:'bars', bars:'farm', farm:'farm' })[id] || id;
}

/* The map is a fixed logical size — the camera scales it into the viewport,
   so a tile never reflows and the layout is identical on every screen.
   It grew upward to make room above the moulds for the field. */
const WORLD = { w: 2700, h: 1900 };
/* the old column sits 400px right of the water, and the rack, battle and
   bench take the right-hand third */
const POS_OF_ORE = {
  farm:       { x: 11.1, y: 29 },     // far left, over the buckets that water it
  bars:       { x: 29.7, y: 50 },     // above the iron it casts
  buckets:    { x: 11.1, y: 52 },
  iron:       { x: 29.7, y: 68.3 },   // over the stone
  gear:       { x: 73.5, y: 70 },     // level with the furnace
  bench:      { x: 93,   y: 70 },     // right of the rack it serves, clear of the spacer
  recycle:    { x: 73.5, y: 89.7 },   // level with the wood
  furnace:    { x: 50,   y: 70 },
  battle:     { x: 73.5, y: 39 },     // over the rack it arms
  stone:      { x: 29.7, y: 89.7 },   // beside the wood, on its left
  water:      { x: 11.1, y: 68.3 },
  wood:       { x: 50,   y: 89.7 },
  steel:      { x: 29.7, y: 29 },     // top of the column, over the moulds
};

/* One link per unlock ingredient, so a bar needing three resources gets three
   separate progress lines feeding into it. */
const LINKS = [];
ORES.forEach(d => {
  if (!d.unlock || d.noLink) return;
  Object.keys(d.unlock).forEach(src => {
    // gold has no tile to run a line from
    if (!POS_OF_ORE[src]) return;
    // `at` is the card the line is drawn to; normally the tile itself
    LINKS.push({ key: d.id + '<' + src, ore: d.id, at: d.linkAt || d.id, src, need: d.unlock[src] });
  });
});

/* Supply lines, as opposed to unlock lines: these stay on the board for good
   and report a live flow rather than a requirement met once and forgotten.
   Wood is the furnace's fuel going in, and heat is what comes back out of it
   and into Iron. */
const FEEDS = [
  { ore: FURNACE_ID, src: 'wood',      need: FURNACE_STOKE_COST },
  { ore: 'iron',     src: FURNACE_ID,  heat: true },
  { ore: 'buckets',  src: 'bars',      bucket: true },   // bars become buckets
  { ore: 'buckets',  src: 'water',     flow: true },     // flow fills them
  { ore: 'farm',     src: 'battle',    seeds: true },    // the fight drops seeds
  { ore: 'farm',     src: 'buckets',   water: true },    // full buckets water the plots
  { ore: 'steel',    src: FURNACE_ID,  heat: true, hot: STEEL_HEAT },   // steel wants real heat
  { ore: 'battle',   src: 'gear',      gear: true },     // the rack arms the hero
  { ore: 'bench',    src: 'gear',      gear: true },     // and feeds the bench
  { ore: 'recycle',  src: 'gear',      gear: true },     // and the scrap pile
];
FEEDS.forEach(f => LINKS.push({ key: f.ore + '~' + f.src, ore: f.ore, src: f.src,
                                need: f.need, heat: f.heat, hot: f.hot, bucket: f.bucket, flow: f.flow,
                                seeds: f.seeds, water: f.water, gear: f.gear, feed: true }));

function slotPos(id) { return POS_OF_ORE[id]; }

/* =========================================================================
   UPGRADE DEFINITIONS

   Every upgrade costs exactly ONE resource. Storage and Haul are paid in the
   tile's own stock. Automation is paid in the tier above at EVERY level, which
   is what stops a tile bootstrapping itself: to stop working wood by hand you
   have to have gone and worked stone.
   ========================================================================= */

// 5 -> 8 -> 13 -> 20: three Storage levels take any bar from its starting 5 to 20.
const CAP_GROWTH    = Math.pow(4, 1/3);
const YIELD_GROWTH  = 1.40;
const AUTO_RATE     = 0.35;    // units per second, per automation level
/* the wood is slower: a burn eats 5 logs every 18s (0.28/s), and one level of
   automation should feed most of that, not all of it and a surplus besides */
const AUTO_RATE_BY  = { wood: 0.16 };

/* Each upgrade lives on the card next to the thing it changes: Storage beside
   the capacity figure, Bigger Haul beside the output bar, Automation top-left.
   `slot` says which one. */
const UPGRADES = [
  { key:'cap',   sym:'CAP', slot:'cap', name:'Storage', base:3, mult:1.50, max:30,
    eff: (o,l) => `Holds <em>&times;1.59</em> more &rarr; <b>${fmt(capOf(o, l+1))}</b> ${BY_ID[o].unit}.`,
    tip: 'Paid in this tile’s own stock. Three levels take it from 5 to 20.' },
  { key:'yield', sym:'OUT', slot:'out', name:'Bigger Haul', base:5, mult:1.70, max:30,
    eff: (o,l) => isBench(o)
      ? `Every ${plotWords(o).unit} you empty gives <em>&times;1.4</em> &rarr; ` +
        `<b>${fmt(yieldOf(o, l+1))}</b> ${BY_ID[o].unit}.` +
        (BY_ID[o].farming ? `<br>The furrow takes no longer to grow, so it is pure profit.`
                          : `<br>The same iron goes in, so a deeper mould is pure profit.`)
      : `Each cycle gives <em>&times;1.4</em> &rarr; <b>${fmt(yieldOf(o, l+1))}</b>.` +
        (S.ores[o].lvl.auto > 0
          ? `<br>Automation rises with it, to <b>${fmt(autoRateAt(o, null, l+1))}</b>/s.`
          : `<br>It will lift Automation too, once you buy some.`),
    tip: 'Paid in this tile’s own stock. Lifts everything this tile produces.' },
];

/* Only the bench has this: more moulds means more setting at the same time,
   which is the only way the bench goes faster by hand. */
const MOULDS = { key:'mould', sym:'MLD', slot:'mld', name:'More Plots',
  base:4, mult:1.70, max:5,
  // the iron moulds are dug and lined: molten iron and stone, not bars
  costBy: { bars: { iron: 1, stone: 1 } },
  eff: (o,l) => { const W = plotWords(o);
    return `Another ${W.unit} &rarr; <b>${plotCount(o, l+1)}</b> in the row.` +
           `<br>Each runs its own <em>${plotTime(o)}s</em> timer, so they overlap.`; },
  tip: 'Paid in this tile’s own stock — the iron moulds in molten iron and stone. Five levels take the row from 3 to 8.' };

/* On the bench, automation is not a rate — it is literally a hand doing the
   clicks, one press every few seconds, faster with every level. */
/* Automation is bought with gold, and gold comes from the battle: the deeper
   you can fight, the more of the works you can leave to run. Each tile has
   its own price, and every level costs three times the last. */
const AUTO_BASE = { wood:5, stone:30, bars:40, farm:60, steel:100 };
const AUTO_PAY  = { wood:'iron' };          // where a tile's automation is not paid in gold
const AUTO = { key:'auto', sym:'AUT', slot:'aut', name:'Automation',
  base:15, baseBy:AUTO_BASE, payBy:AUTO_PAY, mult:3, multBy:{ wood:2 }, max:5, pay:'gold',
  eff: (o,l) => isBench(o)
    ? `A hand at the bench: one press every <b>${(MOULD_AUTO_INTERVAL / (l+1)).toFixed(1)}s</b>.<br>` +
      (BY_ID[o].farming
        ? `It sows an empty furrow, or reaps one that has ripened — whichever is waiting, wherever you are stood.`
        : `It starts an empty ${plotWords(o).unit} with <b>${costWords(plotCost(o))}</b>, or empties one that is ${plotWords(o).done} — ` +
          `whichever is waiting, wherever you are stood.`)
    : `Works this tile on its own: <b>${fmt(autoRateAt(o, l+1))}</b>/s.<br>` +
      `It keeps running while you are stood at another tile, and ` +
      `working this one stacks on top.`,
  tip: '' };

// every upgrade a working tile carries, in the order they are built
const TILE_UPGRADES = UPGRADES.concat([AUTO]);

/* The furnace's own upgrade, and the only one paid in Iron — the furnace
   buys its own draught back out of what it smelts. */
const BELLOWS = { key:'bellows', name:'Bellows', base:6, mult:1.75, max:10, pay:'stone',
  eff: (o,l) => {
    const c0 = heatCeiling(l, null), c1 = heatCeiling(l + 1, null);
    return `Cooldown after a burn <em>${stokeCooldown(l, null).toFixed(1)}s</em> &rarr; ` +
           `<b>${stokeCooldown(l + 1, null).toFixed(1)}s</b>.<br>` +
           `Stoking steadily then holds <em>${Math.round(c0)}&deg;</em> &rarr; <b>${Math.round(c1)}&deg;</b>, ` +
           `for <b>${fmt(heatRateAt('iron', null, c1))}</b>/s of iron.`;
  },
  tip: 'Paid in Stone. Heat leaks faster the hotter it is, so a hotter furnace ' +
       'is only reachable by stoking it more often — though every stoke gains until it is nearly full.' };

/* The furnace's lining. It sits where every other tile carries Storage and
   is paid in stone: each level lets the furnace hold twenty degrees more, and
   iron pours in proportion to heat, so a hotter furnace is a faster one. The
   heat still has to be put there — the lining raises the cap, not the fire. */
const LINING = { key:'lining', sym:'CAP', slot:'cap', name:'Firebrick',
  base:8, mult:1.75, max:5, pay:'iron',
  eff: (o,l) => {
    const raw = heatCeilingRaw(null, null), top0 = heatMaxAt(l), top1 = heatMaxAt(l + 1);
    return `Top heat <em>${top0}&deg;</em> &rarr; <b>${top1}&deg;</b>, ` +
           `for up to <b>${fmt(heatRateAt('iron', null, top1))}</b>/s of iron.<br>` +
           (raw >= top1
             ? `Your stoking already holds <b>${Math.round(raw)}&deg;</b>, so the lining is all that stands in its way.`
             : `Your stoking holds about <b>${Math.round(raw)}&deg;</b> as it is: more Bellows or Stoker to make use of the room.`);
  },
  tip: 'Paid in Iron. The furnace pours iron in proportion to its heat, so every degree of room is worth having — once you can keep it that hot.' };

/* The furnace's helper. It sits in the same slot as every other tile's
   Automation and is paid the same way, in Iron — but it is only a trickle of
   wood onto the coals. You still light the burns yourself. */
const STOKER = { key:'stoker', sym:'STK', slot:'aut', name:'Stoker',
  base:5, mult:1.80, max:5, pay:'iron',
  eff: (o,l) => {
    const w = stokerWood(l + 1);
    return `Drops <b>${w} wood</b> onto the fire every <em>${STOKER_EVERY}s</em> for <b>+${w * STOKER_HEAT_PER_WOOD}&deg;</b>, ` +
           `<b>${fmt(stokerRate(l + 1))}&deg;/s</b> on average.<br>` +
           `It never lights a burn and never shortens the cooldown &mdash; ` +
           `alone it idles around <b>${Math.round(heatCeiling(null, l + 1, true, true))}&deg;</b>; with your burns on top, ` +
           `<b>${Math.round(heatCeiling(null, l + 1))}&deg;</b>.`;
  },
  tip: 'Paid in Iron. A slow feed that eats wood the whole time: 2 degrees a log against a burn\u2019s 5.' };

/* =========================================================================
   STATE
   ========================================================================= */

const SAVE_KEY = 'smeltworks.astra.save.v1';

let S;

/* Astra: goals, earned helpers and production quality of life. */
let astraCatchingUp = false;
let astraHiddenAt = null;
const ASTRA_OFFLINE_CAP = 30 * 60;
function enhancementPreview(item, target) {
  const before = gearStats(item), after = gearStats({ ...item, plus: target });
  return Object.keys(after).map(k => k.toUpperCase() + ' ' + (before[k] || 0) + ' → ' + after[k]).join(' · ');
}
/* Milestones used to hand out helpers, a bucket, seeds and a river for free.
   Nothing is given away now: automation is bought with gold, the rest is
   built. The hook stays so its callers need no change. */
function awardMilestones() {}
function batchBench(id, harvest) {
  if (!S.ores[id].unlocked) return false;
  let count = 0;
  syncMoulds(id).forEach((m, i) => {
    if (harvest) { if (m.s === 'ready' && harvestMould(id, i, true)) count++; }
    else if (BY_ID[id].farming) {
      if (m.s !== 'ready' && cropsHeld(m.kind || S.ores[id].seedKind) < capOf(id) && pressPlot(id, i, true)) count++;
    } else if (fillMould(id, i, true)) count++;
  });
  if (count) { sfx('tick'); awardMilestones(); save(); }
  return count > 0;
}
function renderAstraActions(id) {
  const d = BY_ID[id], o = S.ores[id], box = bars[id].root.querySelector('.astra-actions');
  box.replaceChildren();
  if (!o.unlocked) return;
  const button = (label, tip, action) => {
    const b = document.createElement('button'); b.textContent = label; b.title = tip;
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('click', e => { e.stopPropagation(); action(); }); box.appendChild(b); return b;
  };
  if (d.facility) {
    box.classList.add('furnace-actions');
    const control = document.createElement('div'); control.className = 'burn-control';
    const burn = document.createElement('button'); burn.className = 'burn-button';
    burn.addEventListener('pointerdown', e => e.stopPropagation());
    burn.addEventListener('click', e => { e.stopPropagation(); if (stokeFurnace(true)) save(); paintFurnace(BY_ID.furnace, S.ores.furnace, bars.furnace); });
    const rail = document.createElement('div'); rail.className = 'burn-clock';
    const fill = document.createElement('div'); rail.appendChild(fill);
    control.appendChild(burn); control.appendChild(rail); box.prepend(control);
    bars[id].burnControl = { control, burn, fill };
  }
  if (id === 'bars') {
    const recipe = document.createElement('p'); recipe.className = 'casting-recipe';
    recipe.textContent = '3 molten iron → 1 bar · 8 seconds in a mould'; box.appendChild(recipe);
    bars[id].castingRecipe = recipe;
  }
}
/* The journey panel is gone: no goal list, nothing granted for reaching one. */
function catchUpAstra(seconds) {
  const elapsed = Math.min(ASTRA_OFFLINE_CAP, Math.max(0, seconds));
  if (elapsed < 2) return;
  const before = Object.fromEntries(ORES.map(d => [d.id, S.ores[d.id].amount]));
  S.ores.water.holding = null;
  const oldFx = fxOff; fxOff = true; astraCatchingUp = true;
  try {
    for (let remaining = elapsed; remaining > 1e-6; remaining -= 0.25) step(Math.min(0.25, remaining));
  } finally { fxOff = oldFx; astraCatchingUp = false; }
  const gains = ORES.filter(d => !d.facility && S.ores[d.id].amount - before[d.id] >= 0.1)
    .map(d => '+' + fmt(S.ores[d.id].amount - before[d.id]) + ' ' + resName(d.id));
  S.astra.lastSeen = Date.now();
}


function freshOre(def) {
  return {
    unlocked: def.id === 'wood',
    amount: 0,
    heat: 0,
    stokerT: 0,           // seconds banked toward the stoker's next feed
    burnLeft: 0,          // seconds left of an active burn, while heat ramps up
    burnCooldown: 0,      // seconds left before the next burn may start
    burnCooldownMax: 0,   // how long that cooldown was when it started
    lvl: { cap:0, yield:0, auto:0, mould:0, bellows:0, stoker:0, river:0, lining:0, gather:0 },
    progress: 0,
    running: false,
    lifetime: 0,
    // the bench only: one entry per mould, each with its own cooling clock
    moulds: (def.casting || def.farming) ? freshMoulds(def.farming ? FURROW_BASE : MOULD_BASE) : [],
    autoT: 0,             // seconds banked toward the next automated press
    // buckets: one entry per bucket, how full it is
    buckets: [],
    // water: where the hundred units are, what has moved lately, and what is held
    ocean: WATER_TOTAL, cloud: 0, hist: [], holding: null,
    // battle: the run in progress, the loot, and the rest after a fall
    wave: 0, best: 0, gold: 0, seeds: 0, heroHp: HERO_BASE.hp, enemyHp: 0, enemyMax: 0,
    regenRate: 0,         // hp a second while resting; set by the fall or the flight
    heroT: 0, enemyT: 0, cooldown: 0, active: false,
    auto: false,          // clicked on: it fights, rests and fights again by itself
    seedsOf: { grain:0, herb:0, root:0 },     // the pouch, by kind
    embers: { iron:0, steel:0 },              // what the bench burns
    floor: { gold:0, seeds:{ grain:0, herb:0, root:0 }, embers:{ iron:0, steel:0 } },   // dropped, not yet picked up
    starts: 0,            // how many deeper starting tiers have been bought
    startAt: 1,           // the wave a run begins at
    pack: { grain:true, herb:true, root:true }, // which crops the hero may eat
    buff: null,           // the run's meal and tonic, while it lasts
    poulticeCd: 0,        // seconds until the next poultice may be used
    crops: { grain:0, herb:0, root:0 },       // the field's larder
    seedKind: 'grain',    // what the field plants next
    job: null,            // the bench: the piece on it and how long it has left;
                          // the rack: the piece being forged and where it will land
    flashUid: 0,          // the rack: a piece just finished, owed its flash
  };
}
function freshGear() {
  const g = {};
  GEAR_SLOTS.forEach(k => g[k] = { eq: null, bak: [null, null] });
  return g;
}

function freshMoulds(n) {
  const a = [];
  for (let i = 0; i < n; i++) a.push({ s: 'empty', t: 0 });
  return a;
}

function freshState() {
  const ores = {};
  ORES.forEach(d => ores[d.id] = freshOre(d));
  // the worker has to be stood somewhere, and at the start wood is all there is
  // nobody is stood anywhere yet: the first click on the wood is the player's
  return { ores, worked: null, cam: null, gear: freshGear(), gearUid: 1, astra: { claimed: [], lastSeen: Date.now() } };
}
/* an item off a save, checked piece by piece — anything odd is dropped */
function validGear(x, slot) {
  if (!x || typeof x !== 'object' || x.slot !== slot) return null;
  const stats = {};
  ['atk', 'def', 'hp', 'spd'].forEach(k => { const v = Number(x.extra && x.extra[k]); if (v > 0) stats[k] = v; });
  const mat = GEAR_MATS[x.mat] ? x.mat : 'iron';
  return { uid: Number(x.uid) || 0, slot, mat, tier: Math.max(0, Math.min(3, Number(x.tier) || 0)), extra: stats,
           plus: Math.max(0, Math.floor(Number(x.plus) || 0)) };
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return freshState();
    const s = JSON.parse(raw);
    const base = freshState();
    ORES.forEach(d => {
      const o = s.ores && s.ores[d.id];
      if (!o) return;
      const t = base.ores[d.id];
      t.unlocked = !!o.unlocked || d.id === 'wood';
      t.lifetime = Number(o.lifetime) || 0;
      Object.keys(t.lvl).forEach(k => t.lvl[k] = Number(o.lvl && o.lvl[k]) || 0);
      // levels first: a save written under older balance numbers must not
      // carry holdings above the capacity those levels actually grant.
      if (d.facility) {
        t.heat = Math.max(0, Math.min(heatMaxAt(t.lvl.lining), Number(o.heat) || 0));
        t.burnLeft = Math.max(0, Math.min(FURNACE_BURN_TIME, Number(o.burnLeft) || 0));
        t.burnCooldown = Math.max(0, Math.min(FURNACE_COOLDOWN, Number(o.burnCooldown) || 0));
        t.burnCooldownMax = Math.max(t.burnCooldown, Number(o.burnCooldownMax) || 0);
      } else {
        const cap = Math.round(d.cap * Math.pow(CAP_GROWTH, t.lvl.cap));
        t.amount = Math.max(0, Math.min(Number(o.amount) || 0, cap));
      }
      /* Moulds are restored one by one, and only as many as the levels in this
         same save actually grant — a longer row in an older file is truncated
         rather than trusted, and a half-cooled mould keeps its clock. */
      if (d.bucketing) {
        const src = Array.isArray(o.buckets) ? o.buckets : [];
        t.buckets = src.slice(0, BUCKET_MAX).map(q => ({ f: Math.max(0, Math.min(BUCKET_SIZE, Number(q && q.f) || 0)) }));
      }
      if (d.battling) {
        t.wave = Math.max(0, Math.floor(Number(o.wave) || 0));
        t.best = Math.max(0, Math.floor(Number(o.best) || 0));
        t.gold = Math.max(0, Math.floor(Number(o.gold) || 0));
        t.seeds = Math.max(0, Math.floor(Number(o.seeds) || 0));
        t.heroHp = Math.max(0, Number(o.heroHp) || 0);
        t.enemyHp = Math.max(0, Number(o.enemyHp) || 0);
        t.enemyMax = Math.max(0, Number(o.enemyMax) || 0);
        t.cooldown = Math.max(0, Math.min(BATTLE_COOLDOWN, Number(o.cooldown) || 0));
        t.active = !!o.active && t.wave > 0 && t.heroHp > 0;
        t.auto = !!o.auto;
        // an older save kept one seed count; it becomes grain seed
        CROP_KINDS.forEach(k => t.seedsOf[k] = Math.max(0, Math.floor(Number(o.seedsOf && o.seedsOf[k]) || 0)));
        if (!o.seedsOf && Number(o.seeds) > 0) t.seedsOf.grain = Math.floor(Number(o.seeds));
        CROP_KINDS.forEach(k => { if (o.pack && k in o.pack) t.pack[k] = !!o.pack[k]; });
        EMBER_KINDS.forEach(k => t.embers[k] = Math.max(0, Math.floor(Number(o.embers && o.embers[k]) || 0)));
        if (o.floor) {
          t.floor.gold = Math.max(0, Math.floor(Number(o.floor.gold) || 0));
          CROP_KINDS.forEach(k => t.floor.seeds[k] = Math.max(0, Math.floor(Number(o.floor.seeds && o.floor.seeds[k]) || 0)));
          EMBER_KINDS.forEach(k => t.floor.embers[k] = Math.max(0, Math.floor(Number(o.floor.embers && o.floor.embers[k]) || 0)));
        }
        t.starts = Math.max(0, Math.min(START_WAVES.length, Math.floor(Number(o.starts) || 0)));
        t.regenRate = Math.max(0, Number(o.regenRate) || 0);
        t.startAt = [1].concat(START_WAVES.slice(0, t.starts)).includes(Number(o.startAt)) ? Number(o.startAt) : 1;
        t.buff = o.buff && t.active ? { hp: Number(o.buff.hp) || 0, atk: Number(o.buff.atk) || 0 } : null;
        t.poulticeCd = Math.max(0, Math.min(POULTICE_CD, Number(o.poulticeCd) || 0));
      }
      if (d.gearing && o.job && GEAR_SLOTS.includes(o.job.slot) && GEAR_MATS[o.job.mat]) {
        t.job = { slot: o.job.slot, mat: o.job.mat, i: Number(o.job.i) === 1 ? 1 : 0,
                  t: Math.max(0, Number(o.job.t) || 0), total: Math.max(1, Number(o.job.total) || 1) };
      }
      if (d.enhancing && o.job && o.job.item) {
        const item = validGear(o.job.item, o.job.item.slot);
        const from = o.job.from || {};
        if (item && GEAR_SLOTS.includes(from.slot)) {
          const phase = ['offer', 'working', 'done'].includes(o.job.phase) ? o.job.phase : (o.job.done ? 'done' : 'working');
          t.job = { item, from: { slot: from.slot, where: from.where === 'eq' ? 'eq' : 'bak', i: Number(from.i) || 0 },
                    t: Math.max(0, Number(o.job.t) || 0), total: Math.max(1, Number(o.job.total) || 1),
                    target: Math.max(1, Number(o.job.target) || 1), chance: Math.max(0, Math.min(1, Number(o.job.chance) || 0)),
                    cost: Math.max(0, Math.floor(Number(o.job.cost) || 0)), phase };
        }
      }
      if (d.water) {
        t.lvl.river = Math.min(RIVER_MAX, t.lvl.river);
        const cloud = Math.max(0, Math.min(WATER_TOTAL, Number(o.cloud) || 0));
        t.cloud = cloud; t.ocean = WATER_TOTAL - cloud;
        const h = Array.isArray(o.hist) ? o.hist : [];
        t.hist = h.filter(x => Array.isArray(x) && x[0] >= 0 && x[0] < FLOW_WINDOW && x[1] > 0)
                  .map(x => [Number(x[0]), Number(x[1])]).slice(-600);
      }
      if (d.farming) {
        CROP_KINDS.forEach(k => t.crops[k] = Math.max(0, Number(o.crops && o.crops[k]) || 0));
        // an older save's grain was the field's plain stock
        if (!o.crops && Number(o.amount) > 0) t.crops.grain = Number(o.amount);
        t.seedKind = CROP_KINDS.includes(o.seedKind) ? o.seedKind : 'grain';
      }
      if (isBench(d.id)) {
        const src = Array.isArray(o.moulds) ? o.moulds : [];
        t.moulds = freshMoulds(plotCount(d.id, t.lvl.mould));
        const okStates = d.farming ? ['plowing', 'plowed', 'planted', 'cool', 'ready'] : ['cool', 'ready'];
        t.moulds.forEach((m, i) => {
          const q = src[i] || {};
          m.s = okStates.includes(q.s) ? q.s : 'empty';
          m.t = m.s === 'cool' ? Math.max(0, Math.min(d.farming ? 60 : plotTime(d.id), Number(q.t) || 0))
              : m.s === 'plowing' ? Math.max(0, Math.min(PLOW_TIME, Number(q.t) || 0))
              : 0;
          if (m.s === 'cool' && m.t <= 0) m.s = 'ready';
          if (m.s === 'plowing' && m.t <= 0) m.s = 'plowed';
          if (d.farming) m.kind = CROP_KINDS.includes(q.kind) ? q.kind : 'grain';
        });
      }
    });
    /* Whatever a built tile grants comes with it, even on a save written
       before the grant existed — that is how the moulds reach an old furnace. */
    ORES.forEach(x => { if (x.opensWith && base.ores[x.opensWith].unlocked) base.ores[x.id].unlocked = true; });
    /* An old save, or a doctored one, can name a tile that cannot be worked —
       iron, the bench, something still locked, something that no longer exists.
       Then the worker stands nowhere until the player clicks a tile. */
    const w = s.worked;
    base.worked = (typeof w === 'string' && BY_ID[w] &&
                   !BY_ID[w].facility && !BY_ID[w].heatDriven && !isBench(w) &&
                   !BY_ID[w].bucketing && !BY_ID[w].water && !BY_ID[w].gearing && !BY_ID[w].enhancing &&
                   base.ores[w] && base.ores[w].unlocked) ? w : null;
    GEAR_SLOTS.forEach(k => {
      const g = s.gear && s.gear[k];
      if (!g) return;
      base.gear[k].eq = validGear(g.eq, k);
      base.gear[k].bak = [validGear(g.bak && g.bak[0], k), validGear(g.bak && g.bak[1], k)];
    });
    base.gearUid = Math.max(1, Math.floor(Number(s.gearUid) || 1));
    if (s.cam && Number.isFinite(s.cam.z)) {
      base.cam = { x: Number(s.cam.x) || 0, y: Number(s.cam.y) || 0, z: clampZoom(s.cam.z) };
    }
    if (s.astra) {
      base.astra.claimed = Array.isArray(s.astra.claimed) ? s.astra.claimed.filter(k => typeof k === 'string') : [];
      base.astra.lastSeen = Number.isFinite(s.astra.lastSeen) ? Math.min(Date.now(), Math.max(0, s.astra.lastSeen)) : Date.now();
    }
    return base;
  } catch (e) {
    return freshState();
  }
}

function save() {
  if (astraCatchingUp || astraHiddenAt !== null) return;
  S.astra.lastSeen = Date.now();
  const slim = { ores: {}, worked: S.worked, cam: { x: cam.x, y: cam.y, z: cam.z },
                 gear: S.gear, gearUid: S.gearUid, astra: S.astra };
  ORES.forEach(d => {
    const o = S.ores[d.id];
    slim.ores[d.id] = { unlocked:o.unlocked, amount:o.amount, heat:o.heat,
                        burnLeft:o.burnLeft, burnCooldown:o.burnCooldown,
                        burnCooldownMax:o.burnCooldownMax,
                        lvl:o.lvl, lifetime:o.lifetime };
    if (isBench(d.id)) slim.ores[d.id].moulds = o.moulds.map(m => ({ s:m.s, t:+m.t.toFixed(3), kind:m.kind }));
    if (d.farming) { slim.ores[d.id].crops = o.crops; slim.ores[d.id].seedKind = o.seedKind; }
    if (d.bucketing) slim.ores[d.id].buckets = o.buckets.map(q => ({ f:+q.f.toFixed(2) }));
    if (d.water) { slim.ores[d.id].cloud = +o.cloud.toFixed(3);
                   slim.ores[d.id].hist = o.hist.map(x => [+x[0].toFixed(2), +x[1].toFixed(3)]); }
    if (d.enhancing || d.gearing) slim.ores[d.id].job = o.job;
    if (d.battling) Object.assign(slim.ores[d.id], { wave:o.wave, best:o.best, gold:o.gold,
      seedsOf:o.seedsOf, pack:o.pack, buff:o.buff, poulticeCd:+o.poulticeCd.toFixed(2),
      embers:o.embers, floor:o.floor, starts:o.starts, startAt:o.startAt, regenRate:+o.regenRate.toFixed(3),
      heroHp:+o.heroHp.toFixed(2), enemyHp:+o.enemyHp.toFixed(2), enemyMax:o.enemyMax,
      cooldown:+o.cooldown.toFixed(2), active:o.active, auto:o.auto });
  });
  // storage can be unavailable (private mode, file:// restrictions, quota) —
  // the game must stay playable, just without persistence
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(slim)); } catch (e) { /* no save */ }
}

/* =========================================================================
   DERIVED STATS
   ========================================================================= */

function capOf(id, lvl)   { const d = BY_ID[id]; if (d.facility) return heatMax(); lvl = lvl ?? S.ores[id].lvl.cap;
                            return Math.round(d.cap * Math.pow(CAP_GROWTH, lvl)); }
function yieldOf(id, lvl) { const d = BY_ID[id]; lvl = lvl ?? S.ores[id].lvl.yield;
                            return d.yield * Math.pow(YIELD_GROWTH, lvl); }
function timeOf(id)       { return BY_ID[id].time; }

/* Automation works continuously instead of firing cycles, so hand work
   stacks on top of it. Bigger Haul lifts this too. */
/* ---- the bench ---- */

/* kept as the old name so every caller reads the same; plotCount is where the
   moulds-versus-furrows difference actually lives */
function mouldCountAt(id, lvl) { return plotCount(id, lvl); }
function mouldCount(id) { return plotCount(id); }

/* keep the row the length the levels say it should be — buying More Moulds is
   the only thing that ever changes it, and an empty mould is what gets added */
function syncMoulds(id) {
  const o = S.ores[id], n = mouldCountAt(id);
  while (o.moulds.length < n) o.moulds.push({ s: 'empty', t: 0 });
  if (o.moulds.length > n) o.moulds.length = n;
  return o.moulds;
}
/* seconds between automated presses — level 1 every 4s, level 2 every 2s */
function mouldAutoEvery(id, lvl) {
  if (BY_ID[id].casting) return Infinity;      // no hand at the iron moulds, whatever a save says
  lvl = lvl ?? S.ores[id].lvl.auto;
  return lvl > 0 ? MOULD_AUTO_INTERVAL / lvl : Infinity;
}

function autoRateAt(id, autoLvl, yieldLvl) {
  // the bench's automation presses buttons; it has no per-second pour to quote
  if (BY_ID[id].facility || isBench(id)) return 0;
  const o = S.ores[id];
  const a = autoLvl  ?? o.lvl.auto;
  const y = yieldLvl ?? o.lvl.yield;
  if (a <= 0) return 0;
  return yieldOf(id, y) * (AUTO_RATE_BY[id] ?? AUTO_RATE) * a;
}
function autoRate(id) { return autoRateAt(id); }

function heldOf(id) {
  if (id === 'gold') return S.ores.battle.unlocked ? Math.floor(S.ores.battle.gold) : 0;
  return S.ores[id].unlocked ? Math.floor(S.ores[id].amount) : 0;
}
function stockOpen(id) { return id === 'gold' ? S.ores.battle.unlocked : S.ores[id].unlocked; }

/* ---- water ---- */

/* units moved in the last window, as a per-second rate — the flow you made */
function rawFlow() {
  const o = S.ores.water;
  let sum = 0;
  for (const x of o.hist) sum += x[1];
  return sum / FLOW_WINDOW;
}
/* what the buckets actually see: your flow, or the river's floor, whichever is higher */
function flowNow() { return S.ores.water.unlocked ? Math.max(rawFlow(), riverFloor()) : 0; }
function bucketFillRate() { return flowNow() * BUCKET_FILL_K; }
/* take a chunk of flow out of the window, oldest first — what a River costs */
function spendFlow(units) {
  const o = S.ores.water;
  let left = units;
  for (const x of o.hist) {
    if (left <= 0) break;
    const take = Math.min(x[1], left);
    x[1] -= take; left -= take;
  }
  o.hist = o.hist.filter(x => x[1] > 1e-6);
  return left <= 1e-6;
}

/* ---- gear and the hero ---- */

/* roll a piece: its base stats are fixed by the slot; then a coin decides
   whether it carries nothing extra, one extra stat, or two */
function rollGear(slot, mat = 'iron') {
  const M = GEAR_MATS[mat];
  const r = Math.random();
  const n = M.rolls.findIndex(p => r < p);
  const keys = Object.keys(GEAR_EXTRA).slice();
  const extra = {};
  for (let i = 0; i < n; i++) {
    const k = keys.splice(Math.floor(Math.random() * keys.length), 1)[0];
    const [lo, hi] = GEAR_EXTRA[k];
    extra[k] = Math.round((lo + Math.floor(Math.random() * (hi - lo + 1))) * M.extraScale);
  }
  return { uid: S.gearUid++, slot, mat, tier: n, extra, plus: 0 };
}
function gearStats(item) {
  const M = GEAR_MATS[item.mat || 'iron'];
  const st = {};
  Object.keys(GEAR_BASE[item.slot]).forEach(k => st[k] = GEAR_BASE[item.slot][k] * M.scale);
  Object.keys(item.extra).forEach(k => st[k] = (st[k] || 0) + item.extra[k]);
  // every enhancement level is a tenth more of everything the piece has
  const mult = 1 + ENH_STEP * (item.plus || 0);
  if (mult > 1) Object.keys(st).forEach(k => st[k] = Math.ceil(st[k] * mult - 1e-9));
  return st;
}
function gearName(item) {
  return `${GEAR_MATS[item.mat || 'iron'].name} ${GEAR_NAME[item.slot]}` + (item.plus ? ` +${item.plus}` : '');
}
/* the extras alone, as "+SPD +HP"; a piece with none shows nothing there */
function extraLine(item) {
  return Object.keys(item.extra).map(k => '+' + k.toUpperCase()).join(' ');
}
function statLine(st, sep = ' · ') {
  const parts = [];
  if (st.atk) parts.push('ATK ' + st.atk);
  if (st.def) parts.push('DEF ' + st.def);
  if (st.hp)  parts.push('HP ' + st.hp);
  if (st.spd) parts.push('SPD ' + st.spd + '%');
  return parts.join(sep);
}
/* what the hero is, worn gear included — and, during a run, what it ate */
function heroStats(withBuff = true) {
  const h = Object.assign({}, HERO_BASE);
  GEAR_SLOTS.forEach(k => {
    const it = S.gear[k].eq;
    if (!it) return;
    const st = gearStats(it);
    Object.keys(st).forEach(s => h[s] = (h[s] || 0) + st[s]);
  });
  const b = S.ores.battle.buff;
  if (withBuff && b && S.ores.battle.active) {
    h.hp = Math.round(h.hp * (1 + (b.hp || 0)));
    h.atk = Math.round(h.atk * (1 + (b.atk || 0)));
  }
  h.every = 1 / (1 + h.spd / 100);          // seconds between the hero's swings
  return h;
}
function freeBackup(slot) { return S.gear[slot].bak.findIndex((x, i) => !x && !isReserved(slot, i)); }
/* every blow lands for double: both sides hit harder, so a fight is over in
   half the time and the same kit still falls at the same wave */
const DMG_MULT = 2;
function heroDamage(hero, enemy) { return Math.max(1, hero.atk - enemy.def) * DMG_MULT; }
function enemyDamage(enemy, hero) { return Math.max(1, enemy.atk - hero.def) * DMG_MULT; }

/* ---- the field's inputs ---- */
function fullBuckets() { return S.ores.buckets.buckets.filter(q => q.f >= BUCKET_SIZE).length; }
function takeBucket() {
  const q = S.ores.buckets.buckets.find(x => x.f >= BUCKET_SIZE);
  if (!q) return false;
  q.f = 0;
  return true;
}
function seedsHeld(kind) {
  const p = S.ores.battle.seedsOf;
  return kind ? p[kind] : CROP_KINDS.reduce((a, k) => a + p[k], 0);
}
function cropsHeld(kind) { return S.ores.farm.crops[kind]; }

/* the furnace is built and still holding heat */
function furnaceBuilt() { return S.ores[FURNACE_ID].unlocked; }
function hasHeat() { return furnaceBuilt() && S.ores[FURNACE_ID].heat >= SMELT_MIN_HEAT; }
function heatOf() { return furnaceBuilt() ? S.ores[FURNACE_ID].heat : 0; }

/* Seconds of cooldown after a burn. Only Bellows shortens it — pass null to
   keep whatever level is actually bought. */
function stokeCooldown(bLvl) {
  const f = S.ores[FURNACE_ID];
  const b = bLvl ?? f.lvl.bellows;
  return Math.max(BELLOWS_FLOOR, FURNACE_COOLDOWN * Math.pow(BELLOWS_STEP, b));
}

/* heat lost per second at a given temperature: a flat trickle plus a share of
   whatever is currently held, so a hot furnace bleeds far faster than a warm one */
function heatLoss(heat, smelting) {
  return FURNACE_IDLE_COOL + HEAT_LOSS_K * heat + (smelting ? SMELT_HEAT_DRAIN : 0);
}

/* The temperature a Bellows level settles at: one stoke delivers a fixed 25°
   per cycle, and losses climb with heat, so they meet at exactly one point.
   This is the ceiling that level can hold, not a rate. */
function heatCeiling(bLvl, sLvl, smelting = true, stokerOnly = false, lLvl) {
  const cycle = FURNACE_BURN_TIME + stokeCooldown(bLvl);
  const burns = stokerOnly ? 0 : FURNACE_HEAT_GAIN / cycle;
  const spare = burns + stokerRate(sLvl) - FURNACE_IDLE_COOL - (smelting ? SMELT_HEAT_DRAIN : 0);
  const top = lLvl == null ? heatMax() : heatMaxAt(lLvl);
  return Math.max(0, Math.min(top, spare / HEAT_LOSS_K));
}
/* what the stoking you have could hold, before the lining caps it */
function heatCeilingRaw(bLvl, sLvl) {
  const cycle = FURNACE_BURN_TIME + stokeCooldown(bLvl);
  const spare = FURNACE_HEAT_GAIN / cycle + stokerRate(sLvl) - FURNACE_IDLE_COOL - SMELT_HEAT_DRAIN;
  return Math.max(0, spare / HEAT_LOSS_K);
}

function furnaceReady() {
  const o = S.ores[FURNACE_ID];
  return o.unlocked && o.burnLeft <= 0 && o.burnCooldown <= 0;
}
function heatBlocked(id) { return !!BY_ID[id].heatDriven && !hasHeat(); }

/* A heat-driven bar is never worked by hand — the furnace pours it, and the
   rate is simply how hot the furnace is right now. Bigger Haul scales it. */
/* The pour starts at SMELT_MIN_HEAT as a trickle and climbs steeply from
   there: a few percent of the full rate at the line, a fifth at 50°, near
   half at 70°, the full rate at 100°, and more again over a lined furnace. */
function heatRateAt(id, yieldLvl, heat) {
  if (!BY_ID[id].heatDriven) return 0;
  const h = heat ?? heatOf();
  if (h < SMELT_MIN_HEAT) return 0;
  const f = (h - SMELT_MIN_HEAT) / (FURNACE_HEAT_MAX - SMELT_MIN_HEAT);
  return yieldOf(id, yieldLvl) * HEAT_SMELT_RATE * (0.03 + Math.pow(f, 1.5));
}
function heatRate(id) { return heatRateAt(id); }

/* everything a bar is producing per second, from the furnace and from its own
   automation together */
function totalRate(id) {
  // a heat-driven tile has one source and one only: the furnace
  if (BY_ID[id].heatDriven) return hasHeat() ? heatRate(id) : 0;
  return autoRate(id);
}

/* Only the next step of the ladder is on the board: a locked tile appears once
   every ingredient it wants is itself open. At the start that is Wood and the
   Stone it feeds, and nothing else. */
function isRevealed(id) {
  const o = S.ores[id], d = BY_ID[id];
  if (o.unlocked) return true;
  // a tile that waits on something else being built stays off the board till then
  if (d.revealWhen && !d.revealWhen()) return false;
  // a tile the battle drops: on the board, locked, once its wave has fallen
  if (d.dropAt) return S.ores.battle.unlocked && S.ores.battle.best >= d.dropAt;
  // a tile that opens itself on a condition is never on the board before it does
  if (d.opensWhen) return false;
  // a tile that is granted by another one is never on the board unbought:
  // there is no cost to show and no OPEN button to press
  if (d.opensWith) return false;
  if (!d.unlock) return true;
  return Object.keys(d.unlock).every(k => stockOpen(k));
}

function costProgress(cost) {
  let p = 1;
  for (const k in cost) p = Math.min(p, heldOf(k) / cost[k]);
  return Math.max(0, Math.min(1, p));
}
function unlockProgress(oreId) {
  const d = BY_ID[oreId];
  return d.unlock ? costProgress(d.unlock) : 1;
}

/* Every upgrade costs exactly one resource: the tile's own stock, or — for
   automation, at every level — the resource one tier above. */
function payOre(id, def) {
  if (def.payBy && def.payBy[id]) return def.payBy[id];   // this tile pays in something else
  if (def.pay) return def.pay;               // fixed currency, whatever the tile
  return def.above ? aboveOf(id) : id;
}

function costOf(id, def, lvl) {
  const base = def.baseBy ? (def.baseBy[id] ?? def.base) : def.base;
  const mult = def.multBy ? (def.multBy[id] ?? def.mult) : def.mult;
  const n = Math.max(1, Math.floor(base * Math.pow(mult, lvl)));
  // a tile can pay in several stocks at once, each a share of the same figure
  if (def.costBy && def.costBy[id]) {
    const out = {};
    Object.keys(def.costBy[id]).forEach(k => out[k] = Math.max(1, Math.floor(n * def.costBy[id][k])));
    return out;
  }
  return { [payOre(id, def)]: n };
}

function canPay(cost) {
  return Object.keys(cost).every(k => stockOpen(k) && heldOf(k) >= cost[k]);
}
function pay(cost) {
  Object.keys(cost).forEach(k => {
    if (k === 'gold') S.ores.battle.gold -= cost[k];
    else S.ores[k].amount -= cost[k];
  });
}

/* Automation is the one thing that does not care where the worker is stood:
   an automated tile pours whether or not it is the worked one. */
function autoFeeds(id) {
  return !BY_ID[id].facility && S.ores[id].unlocked && autoRate(id) > 0;
}

/* ---- the worked tile ----
   Exactly one tile is worked at a time. Iron is the only unlocked tile that
   can never be worked: the furnace pours it, there is nothing to do by hand. */

/* The furnace is a thing you trigger, not a place you stand: clicking it lights
   a burn and leaves the worker wherever they already were. Iron is likewise
   never workable — the furnace pours it. */
function isWorkable(id) {
  const d = BY_ID[id];
  if (!d || !S.ores[id].unlocked) return false;
  // the battle runs itself once switched on; it never takes the worker
  if (d.battling) return false;
  return !d.facility && !d.heatDriven && !isBench(id) && !d.bucketing && !d.water && !d.gearing && !d.enhancing && !d.recycling;
}
function workableIds() { return ORES.filter(d => isWorkable(d.id)).map(d => d.id); }
function isWorked(id)  { return S.worked === id; }
/* nothing gathers on by itself any more: every swing is a click (the level
   an old save may carry is ignored) */
function autoGathers(id) { return false; }

/* The field tops the ladder, so there is nothing above it to pay for
   automation with — it stays hand-worked for good. */
function canAuto(id) {
  const d = BY_ID[id];
  return !d.facility && !d.heatDriven && !d.bucketing && !d.water && !d.gearing && !d.battling && !d.enhancing && !d.recycling;
}

function liveSet() {
  return ORES.filter(d => S.ores[d.id].running || autoFeeds(d.id) ||
                          (d.battling && S.ores[d.id].unlocked && (S.ores[d.id].active || S.ores[d.id].cooldown > 0)) ||
                          (d.enhancing && S.ores[d.id].unlocked && !!S.ores[d.id].job) ||
                          (d.bucketing && S.ores[d.id].unlocked && flowNow() > 0) ||
                          (d.water && S.ores[d.id].unlocked && (S.ores[d.id].holding || rawFlow() > 0)) ||
                          (isBench(d.id) && S.ores[d.id].unlocked &&
                           (S.ores[d.id].lvl.auto > 0 ||
                            S.ores[d.id].moulds.some(m => m.s !== 'empty'))) ||
                          (d.heatDriven && S.ores[d.id].unlocked && hasHeat())).map(d => d.id);
}

/* =========================================================================
   SOUND — every effect is synthesised on the spot, so there is nothing to
   load. The context is only created on the first press, which is the only
   time the browser lets it start.
   ========================================================================= */

const SFX_VOLUME = 1.0;   // master gain; the compressor after it keeps the peaks in check
const SFX_GAIN   = 1.3;   // every one-shot's peak is scaled by this
/* the loops: filter shape, wobble, and how loud — the sky is kept quiet, it
   runs for as long as a finger is down */
const SFX_LOOPS = {
  sun:   { type:'lowpass',  f:700,  q:0.4, lfo:0.35, depth:250, vol:0.035 },
  // rain: a soft mid hush that barely breathes, not a bright pulsing hiss
  cloud: { type:'bandpass', f:1400, q:0.35, lfo:0.4,  depth:220, vol:0.018 },
  fire:  { type:'bandpass', f:420,  q:0.5, lfo:7,    depth:260, vol:0.06, rumble:true },
};

const SFX = {
  ctx: null, master: null, noise: null, loops: {}, loopKind: null, bg: false,
  muted: (() => { try { return localStorage.getItem('smeltworks.sound') === 'off'; } catch (e) { return false; } })(),

  boot() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    this.ctx = new AC();
    /* loud, but through a compressor so a pile of overlapping hits squashes
       rather than clips */
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : SFX_VOLUME;
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 20; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.15;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    // two seconds of white noise, looped by whoever needs a hiss or a knock
    const n = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    return true;
  },
  setMuted(m) {
    this.muted = m;
    if (m) this.stopLoops();
    try { localStorage.setItem('smeltworks.sound', m ? 'off' : 'on'); } catch (e) { /* no store */ }
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : SFX_VOLUME, this.ctx.currentTime, 0.02);
    const b = document.getElementById('btn-sound');
    if (b) { b.textContent = m ? 'muted' : 'sound'; b.className = m ? '' : 'on'; }
  },

  /* a tone: type, start and end frequency, length, peak gain */
  tone(type, f0, f1, dur, gain = 0.2, at = 0) {
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain * SFX_GAIN, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  /* a burst of noise through a filter, with the cutoff sweeping */
  burst(kind, f0, f1, dur, gain = 0.2, q = 1, at = 0) {
    const c = this.ctx, t = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = kind; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain * SFX_GAIN, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },

  play(name) {
    if (fxOff || this.muted || this.bg || !this.boot()) return;
    switch (name) {
      case 'tick':    this.tone('sine', 660, 660, 0.05, 0.08); break;
      case 'chop':    this.burst('lowpass', 900, 200, 0.12, 0.35, 0.7);
                      this.tone('sine', 140, 70, 0.10, 0.25); break;
      case 'quarry':  this.burst('bandpass', 1800, 900, 0.07, 0.35, 2);
                      this.tone('square', 220, 90, 0.05, 0.08); break;
      case 'reap':    this.burst('bandpass', 2500, 700, 0.18, 0.18, 1.2); break;
      case 'sow':     this.burst('lowpass', 600, 250, 0.10, 0.18, 0.8); break;
      case 'pour':    this.burst('lowpass', 2400, 350, 0.38, 0.22, 0.6); break;
      case 'clink':   this.tone('sine', 2300, 2250, 0.18, 0.16);
                      this.tone('sine', 3450, 3400, 0.14, 0.08, 0.01); break;
      case 'stoke':   this.burst('lowpass', 180, 1600, 0.45, 0.28, 0.5);
                      this.tone('sine', 60, 40, 0.30, 0.18); break;
      case 'buy':     this.tone('triangle', 880, 1320, 0.11, 0.14); break;
      case 'no':      this.tone('square', 160, 120, 0.09, 0.05); break;
      case 'unlock':  [523, 659, 784, 1047].forEach((f, i) => this.tone('triangle', f, f, 0.22, 0.14, i * 0.09)); break;
      case 'open':    [392, 523].forEach((f, i) => this.tone('triangle', f, f, 0.25, 0.12, i * 0.10)); break;
      case 'full':    this.tone('sine', 300, 520, 0.16, 0.18);
                      this.burst('lowpass', 1200, 300, 0.10, 0.10, 0.5); break;
      case 'river':   [98, 147, 196].forEach(f => this.tone('sine', f, f, 0.9, 0.12));
                      this.burst('lowpass', 500, 900, 0.9, 0.10, 0.4); break;
      case 'forge':   this.burst('lowpass', 1500, 300, 0.25, 0.25, 0.7);
                      this.tone('sine', 1800, 1750, 0.22, 0.14, 0.03);
                      this.tone('sine', 2700, 2650, 0.16, 0.07, 0.03); break;
      case 'melt':    this.burst('lowpass', 2000, 200, 0.5, 0.2, 0.5); break;
      case 'equip':   this.tone('sine', 520, 520, 0.06, 0.1); this.tone('sine', 780, 780, 0.08, 0.1, 0.07); break;
      case 'hit':     this.burst('bandpass', 1400, 500, 0.06, 0.18, 1.5); break;
      case 'hurt':    this.burst('lowpass', 500, 120, 0.12, 0.22, 0.8); this.tone('sine', 110, 70, 0.1, 0.12); break;
      case 'wave':    this.tone('triangle', 660, 990, 0.14, 0.13); this.tone('triangle', 990, 1320, 0.14, 0.11, 0.1); break;
      // a handful of coins hitting the floor: bright, short, a little scattered
      case 'coin':    this.tone('sine', 2400, 2350, 0.16, 0.14); this.tone('sine', 3200, 3150, 0.13, 0.09, 0.05);
                      this.tone('sine', 2700, 2650, 0.18, 0.12, 0.11); this.tone('sine', 3600, 3500, 0.12, 0.07, 0.17);
                      this.burst('highpass', 5000, 7000, 0.12, 0.04, 0.4, 0.02); break;
      case 'die':     this.tone('sawtooth', 220, 55, 0.7, 0.10); this.burst('lowpass', 800, 100, 0.6, 0.15, 0.5); break;
      case 'plow':    this.burst('lowpass', 700, 150, 0.16, 0.25, 0.7); break;
      case 'eat':     this.burst('lowpass', 1200, 300, 0.12, 0.22, 0.8); this.burst('lowpass', 900, 250, 0.1, 0.18, 0.8, 0.14); break;
      case 'heal':    this.tone('sine', 440, 880, 0.35, 0.12); this.tone('sine', 660, 1320, 0.35, 0.08, 0.08); break;
      case 'enhOk':   [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone('sine', f, f * 1.01, 0.35, 0.12, i * 0.06));
                      this.burst('highpass', 4000, 6000, 0.5, 0.06, 0.5, 0.2); break;
      case 'enhFail': this.burst('highpass', 3000, 900, 0.45, 0.3, 0.8);
                      [880, 660, 440, 220].forEach((f, i) => this.tone('square', f, f * 0.7, 0.18, 0.06, i * 0.08));
                      this.tone('sine', 90, 40, 0.5, 0.15); break;
      case 'water':   this.burst('lowpass', 2400, 350, 0.38, 0.22, 0.6); break;
    }
  },

  /* Loops, by name: a hiss while the sun works, rain while the cloud does,
     a crackle while the furnace burns. Each is asked for every frame by the
     card that owns it; asking for one already running costs nothing. */
  loopSet(name, on) {
    const cur = this.loops[name];
    if (!on) {
      if (!cur) return;
      const c = this.ctx;
      cur.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.05);
      cur.src.stop(c.currentTime + 0.3);
      if (cur.rum) cur.rum.stop(c.currentTime + 0.3);
      delete this.loops[name];
      return;
    }
    if (cur || this.muted || this.bg || !this.boot()) return;
    const P = SFX_LOOPS[name];
    if (!P) return;
    const c = this.ctx;
    const src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter();
    f.type = P.type; f.frequency.value = P.f; f.Q.value = P.q;
    // a wobble on the filter so the loop does not read as a flat tone
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = P.lfo; lg.gain.value = P.depth;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.setTargetAtTime(P.vol * SFX_GAIN, c.currentTime, 0.08);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
    let rum = null;
    if (P.rumble) {
      // a low roar under the crackle
      rum = c.createOscillator(); rum.type = 'sawtooth'; rum.frequency.value = 48;
      const rf = c.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 120;
      const rg = c.createGain(); rg.gain.value = 0.5;
      rum.connect(rf); rf.connect(rg); rg.connect(g); rum.start();
    }
    this.loops[name] = { g, src, lfo, rum };
  },
  /* the sky runs one loop at a time: the sun's, the cloud's, or none */
  loop(kind) {
    this.loopKind = kind && !this.muted ? kind : null;
    this.loopSet('sun', kind === 'sun');
    this.loopSet('cloud', kind === 'cloud');
  },
  stopLoops() { Object.keys(this.loops).forEach(n => this.loopSet(n, false)); },
  /* out of sight, out of earshot: a hidden tab or an unfocused window goes
     silent, and comes back when it is looked at again */
  background(hidden) {
    this.bg = hidden;
    if (!this.ctx) return;
    if (hidden) { this.stopLoops(); this.ctx.suspend(); }
    else if (!this.muted) this.ctx.resume();
  },
};
function sfx(name) { SFX.play(name); }

document.addEventListener('visibilitychange', () => SFX.background(document.hidden));
window.addEventListener('blur', () => SFX.background(true));
window.addEventListener('focus', () => SFX.background(document.hidden));
// the context can only be created on a gesture; the first press of anything does it
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => SFX.boot(), { capture: true, passive: true }));
document.getElementById('btn-sound').addEventListener('click', () => { SFX.boot(); SFX.setMuted(!SFX.muted); if (!SFX.muted) sfx('tick'); });
SFX.setMuted(SFX.muted);

/* =========================================================================
   GAME LOOP
   ========================================================================= */

function isFull(id) { return !BY_ID[id].facility && Math.floor(S.ores[id].amount) >= capOf(id); }

function completeCycle(id) {
  const gain = yieldOf(id);
  addOre(id, gain);
  floatText(id, '+' + fmt(gain), BY_ID[id].color);
  punch(id);
  sfx(id === 'stone' ? 'quarry' : 'chop');
}

function addOre(id, amt) {
  const o = S.ores[id], cap = capOf(id);
  const before = o.amount;
  o.amount = Math.min(cap, o.amount + amt);
  o.lifetime += o.amount - before;
}

let lastT = performance.now();
let heatDrainNow = FURNACE_IDLE_COOL;    // for the furnace readout
let heatNetNow   = -FURNACE_IDLE_COOL;   // gain minus losses, signed

let pendingUnlock = false, pendingFit = false;

function tick(now) {
  if (document.hidden) { lastT = now; requestAnimationFrame(tick); return; }
  const dt = Math.min(0.25, (now - lastT) / 1000);
  lastT = now;
  step(dt);
  if (pendingUnlock) { pendingUnlock = false; commitUnlock(); sfx('open'); }
  if (pendingFit) { pendingFit = false; fitCam(); save(); }
  paint();
  requestAnimationFrame(tick);
}

function step(dt) {
  const furnace = S.ores[FURNACE_ID];
  let burn = 0;

  ORES.forEach(d => {
    const o = S.ores[d.id];
    if (!o.unlocked) return;

    if (d.facility) {
      // a burn feeds its heat in over its whole duration; only once it has
      // finished does the cooldown start running
      if (o.burnLeft > 0) {
        const slice = Math.min(dt, o.burnLeft);
        o.heat = Math.min(heatMax(),
                          o.heat + (FURNACE_HEAT_GAIN / FURNACE_BURN_TIME) * slice);
        o.burnLeft -= slice;
        // remember the length this cooldown started at, so buying Bellows
        // part-way through does not leave the rail reading over full
        if (o.burnLeft <= 1e-6) {
          o.burnLeft = 0;
          o.burnCooldown = o.burnCooldownMax = stokeCooldown();
        }
      } else {
        o.burnCooldown = Math.max(0, o.burnCooldown - dt);
      }
      /* Nobody stands at the furnace: you light it by hand, a burn at a time.
         A Stoker only trickles logs onto the coals between your burns. */
      if (o.lvl.stoker > 0) {
        o.stokerT += dt;
        let guard = 0;
        while (o.stokerT >= STOKER_EVERY && guard++ < 50) {
          o.stokerT -= STOKER_EVERY;
          const w = stokerWood(o.lvl.stoker), wood = S.ores.wood;
          if (o.heat >= heatMax() || wood.amount < w) { o.stokerT = 0; break; }
          wood.amount -= w;
          o.heat = Math.min(heatMax(), o.heat + w * STOKER_HEAT_PER_WOOD);
        }
      } else o.stokerT = 0;
      o.heat = Math.max(0, o.heat - (FURNACE_IDLE_COOL + HEAT_LOSS_K * o.heat) * dt);
      return;
    }

    /* The water cycle. A held sun lifts ocean into the cloud, a held cloud
       rains it back, and either one counts as flow. The window of recent
       flow ages out here, sample by sample. */
    if (d.water) {
      o.running = false; o.progress = 0;
      let moved = 0;
      if (o.holding === 'sun' && o.ocean > 0) {
        moved = Math.min(o.ocean, CYCLE_RATE * dt);
        o.ocean -= moved; o.cloud += moved;
      } else if (o.holding === 'cloud' && o.cloud > 0) {
        moved = Math.min(o.cloud, CYCLE_RATE * dt);
        o.cloud -= moved; o.ocean += moved;
      }
      for (const x of o.hist) x[0] += dt;
      if (moved > 0) o.hist.push([0, moved]);
      if (o.hist.length && o.hist[0][0] >= FLOW_WINDOW) o.hist = o.hist.filter(x => x[0] < FLOW_WINDOW);
      // a coarse sim slice can pile up samples; fold neighbours together
      if (o.hist.length > 400) {
        const folded = [];
        for (let i = 0; i < o.hist.length; i += 2) {
          const a = o.hist[i], b = o.hist[i + 1];
          folded.push(b ? [(a[0] + b[0]) / 2, a[1] + b[1]] : a);
        }
        o.hist = folded;
      }
      o.lifetime += moved;
      o.running = moved > 0 || riverFloor() > 0;
      return;
    }

    /* Buckets fill in step with the flow, every one of them at once, and a
       full one simply stays full. */
    if (d.bucketing) {
      o.running = false; o.progress = 0;
      const rate = bucketFillRate();
      if (rate <= 0) return;
      o.buckets.forEach(q => {
        if (q.f >= BUCKET_SIZE) return;
        const before = q.f;
        q.f = Math.min(BUCKET_SIZE, q.f + rate * dt);
        o.lifetime += q.f - before;
        if (q.f >= BUCKET_SIZE && before < BUCKET_SIZE) { floatText(d.id, 'FULL', d.color); punch(d.id); sfx('full'); }
      });
      o.running = o.buckets.some(q => q.f < BUCKET_SIZE);
      return;
    }

    // the rack, the battle and the bench each have their own clock
    if (d.gearing) { stepForge(o, dt); return; }
    if (d.battling) { if (!astraCatchingUp) stepBattle(o, dt); return; }
    if (d.enhancing) { stepBench(o, dt); return; }

    // a heat-driven bar has no cycle at all — the furnace pours it, and how
    // fast depends entirely on how hot the furnace is
    if (d.heatDriven) {
      o.running = false; o.progress = 0;
      if (hasHeat() && !isFull(d.id)) {
        addOre(d.id, totalRate(d.id) * dt);
        burn += SMELT_HEAT_DRAIN * dt;
      }
      return;
    }

    /* The bench never cycles and is never the worked tile. Every mould counts
       its own cooling down, and an Automation level is a hand pressing them on
       a fixed beat — it does one thing per beat, exactly as you would. */
    if (isBench(d.id)) {
      o.running = false; o.progress = 0;
      syncMoulds(d.id);
      // steel sets only while the furnace is at temperature; otherwise it waits
      const frozen = d.steeling && !steelHot();
      o.moulds.forEach((m, i) => {
        if (m.s === 'plowing') {
          m.t -= dt;
          if (m.t <= 0) { m.t = 0; m.s = 'plowed'; }
          return;
        }
        if (m.s === 'ready' && d.selfEmptying) {
          // a stack that has finished tips its charcoal out by itself; a full
          // store leaves it sat there until there is room
          if (harvestMould(d.id, i, true) && !fxOff) sfx('clink');
          return;
        }
        if (m.s !== 'cool' || frozen) return;
        m.t -= dt;
        if (m.t <= 0) {
          m.t = 0; m.s = 'ready';
          if (d.selfEmptying && harvestMould(d.id, i, true) && !fxOff) sfx('clink');
        }
      });
      const every = mouldAutoEvery(d.id);
      if (Number.isFinite(every)) {
        o.autoT += dt;
        // a big dt (a fast-forward slice) can bank several presses at once
        let guard = 0;
        while (o.autoT >= every && guard++ < 200) {
          o.autoT -= every;
          // nothing it could usefully press: drop the banked time rather than
          // stockpiling presses to spend in a burst later
          if (!autoPressMould(d.id)) { o.autoT = 0; break; }
        }
      } else o.autoT = 0;
      return;
    }

    // automation is a steady pour and ignores the worker entirely
    if (autoFeeds(d.id) && !isFull(d.id)) addOre(d.id, autoRate(d.id) * dt);

    /* Only the worked tile cycles, and a click buys one cycle: when it lands
       the tile stops and waits for the next click.
       Leaving abandons whatever was in progress, and a full bar stops until
       there is somewhere to put the haul. */
    if (astraCatchingUp || !isWorked(d.id) || isFull(d.id)) { o.running = false; o.progress = 0; return; }
    if (!o.running) return;
    o.progress += dt * 1000 / timeOf(d.id);
    if (o.progress >= 1) {
      completeCycle(d.id);
      if (isFull(d.id) || !autoGathers(d.id)) { o.progress = 0; o.running = false; }
      else o.progress = o.progress - 1;      // carry the overshoot into the next cycle
    }
  });

  /* Tiles that open themselves: the buckets with the first bar, the water
     with the first bucket. The board is rebuilt after the step, not inside it. */
  let opened = false;
  ORES.forEach(d => {
    const o = S.ores[d.id];
    if (!o.unlocked && d.opensWhen && d.opensWhen()) { o.unlocked = true; opened = true; }
  });
  if (opened) pendingUnlock = true;

  if (burn > 0) furnace.heat = Math.max(0, furnace.heat - burn);
  heatDrainNow = FURNACE_IDLE_COOL + HEAT_LOSS_K * furnace.heat +
                 (burn > 0 && dt > 0 ? burn / dt : 0);
  // what the gauge is actually doing right now, gain included; the stoker's
  // feeds land in lumps, so they are counted as their average
  const stokerLive = furnace.lvl.stoker > 0 && furnace.heat < heatMax() &&
                     S.ores.wood.amount >= stokerWood(furnace.lvl.stoker);
  heatNetNow = (furnace.burnLeft > 0 ? FURNACE_HEAT_GAIN / FURNACE_BURN_TIME : 0) +
               (stokerLive ? stokerRate() : 0) - heatDrainNow;

  awardMilestones();
  return liveSet();
}

/* ---- the rack, one slice at a time ----
   A piece takes shape in its held slot; when the wait is out it is rolled,
   set down, and lit in the colour of what it turned out to be. */
function stepForge(o, dt) {
  const j = o.job;
  if (!j) { o.running = false; return; }
  o.running = true;
  j.t = Math.max(0, j.t - dt);
  if (j.t > 0) return;
  const item = rollGear(j.slot, j.mat);
  const g = S.gear[j.slot];
  // a bare slot wears the new piece straight off the anvil; otherwise it shelves
  if (!g.eq) { g.eq = item; sfx('equip'); }
  else if (g.bak[j.i]) { const k = g.bak.indexOf(null); if (k >= 0) g.bak[k] = item; else { o.job = null; return; } }
  else g.bak[j.i] = item;
  o.job = null;
  o.flashUid = item.uid;
  o.lifetime += 1;
  floatText('gear', gearName(item).toUpperCase() + (extraLine(item) ? ' · ' + extraLine(item) : ''), TIER_COLOR[item.tier]);
  punch('gear');
  sfx('forge');
  save();
}

/* ---- the bench, one slice at a time ----
   The wait runs down; at the end the dice roll once. A success waits on the
   bench until there is a slot to go back to. */
function stepBench(o, dt) {
  const j = o.job;
  if (!j) { o.running = false; return; }
  if (j.phase === 'done') { o.running = false; benchReturn(); return; }
  if (j.phase !== 'working') { o.running = false; return; }   // offered, waiting on you
  o.running = true;
  j.t = Math.max(0, j.t - dt);
  if (j.t > 0) return;
  if (Math.random() < j.chance) {
    j.item.plus = j.target;
    j.phase = 'done';
    o.lifetime += 1;
    floatText('bench', gearName(j.item).toUpperCase(), '#d98cff');
    punch('bench');
    sfx('enhOk');
    benchReturn();
  } else {
    floatText('bench', 'NO GAIN · ITEM SAFE', '#ef6b6b');
    replay(bars.bench.root, 'hit');
    sfx('enhFail');
    j.phase = 'done';
    o.running = false;
    benchReturn();
    save();
  }
}
/* a finished piece goes back where it came from, or to a spare of its slot */
function benchReturn() {
  const o = S.ores.bench, j = o.job;
  if (!j || (j.phase !== 'done' && j.phase !== 'offer')) return false;
  if (j.phase === 'offer' && findGear(j.item.uid)) { o.job = null; save(); return true; }
  const g = S.gear[j.from.slot];
  if (j.from.where === 'eq' && !g.eq) g.eq = j.item;
  else {
    const i = g.bak.indexOf(null);
    if (i < 0) return false;
    g.bak[i] = j.item;
  }
  o.job = null;
  save();
  return true;
}
/* a piece dropped on the bench is only OFFERED: it sits there with its odds,
   its price and its wait showing, until you confirm — or take it back */
function benchTake(uid) {
  const o = S.ores.bench;
  if (!o.unlocked) return false;
  if (o.job) { sfx('no'); floatText('bench', 'BUSY', '#8fa6c8'); return false; }
  const f = findGear(uid);
  if (!f) return false;
  const g = S.gear[f.slot];
  // An offer is only a preview. Keep the item equipped until confirmation.
  const plus = f.item.plus || 0;
  o.job = { item: f.item, from: { slot: f.slot, where: f.where, i: f.i }, t: ENH_TIME(plus), total: ENH_TIME(plus),
            target: plus + 1, chance: enhChance(plus), cost: enhCost(f.item), phase: 'offer' };
  replay(bars.bench.root, 'hit');
  sfx('tick');
  save();
  return true;
}
/* the commit: pay, and the wait begins */
function benchConfirm() {
  const o = S.ores.bench, j = o.job;
  if (!j || j.phase !== 'offer') return false;
  const need = enhEmbers(j.target), mat = enhMat(j.item);
  if (embersHeld(mat) < need) { sfx('no'); floatText('bench', `NEEDS ${need} ${EMBER[mat].short}${need > 1 ? 'S' : ''}`, '#ef6b6b'); return false; }
  const found = findGear(j.item.uid);
  if (!found) { o.job = null; save(); return false; }
  j.from = { slot: found.slot, where: found.where, i: found.i };
  j.item = found.item;
  if (found.where === 'eq') S.gear[found.slot].eq = null;
  else S.gear[found.slot].bak[found.i] = null;
  S.ores.battle.embers[mat] -= need;
  j.phase = 'working';
  replay(bars.bench.root, 'hit');
  sfx('forge');
  save();
  return true;
}
