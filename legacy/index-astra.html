<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smeltworks · Astra</title>
<style>
  :root {
    --bg: #07080c;
    --panel2: #1d222e;
    --panel3: #262c3b;
    --line: #2f3648;
    --line2: #3d465c;
    --text: #e6ebf5;
    --dim: #939bad;
    --dimmer: #626a7d;
    --ember: #ff9a3c;
    --ember-hot: #ffc76b;
    --ember-dim: #b3641f;
    --good: #6ee7a8;
    --bad: #ef6b6b;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Mono', 'Consolas', monospace;

    /* the world is a fixed-size map now — the camera scales it, not the viewport */
    --bar-w: 320px;
    --amt-size: 33px;
    --ut: 46px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 15px;
    user-select: none; -webkit-user-select: none;
  }

  /* ================= forge (the viewport) ================= */

  #forge {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    cursor: grab; touch-action: none;
    background:
      radial-gradient(60% 40% at 50% 102%, rgba(255,154,60,.20), transparent 68%),
      radial-gradient(110% 80% at 50% -10%, #191e2b, var(--bg) 72%);
  }
  #forge.grabbing { cursor: grabbing; }
  #forge::after {
    content: ''; position: absolute; left: -20%; right: -20%; bottom: -12%; height: 40%;
    background: radial-gradient(closest-side, rgba(255,120,30,.18), transparent 72%);
    filter: blur(26px); animation: haze 7s ease-in-out infinite; pointer-events: none;
  }
  @keyframes haze {
    0%,100% { transform: scaleY(1) translateY(0); opacity: .75; }
    50%     { transform: scaleY(1.22) translateY(-10px); opacity: 1; }
  }

  /* ================= world (the pannable, zoomable map) ================= */

  /* No will-change here on purpose: promoting this to a compositor layer makes
     the browser rasterise it once and stretch that bitmap, which is what turns
     every label soft as soon as you zoom in. Letting it repaint keeps text
     crisp at any zoom, and the scene is small enough that it costs nothing. */
  #world {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
  }

  #embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ember {
    position: absolute; bottom: -20px; border-radius: 50%;
    background: var(--ember); filter: blur(1px); animation: emberUp linear infinite;
  }
  @keyframes emberUp {
    0%   { transform: translate(0,0) scale(.5); opacity: 0; }
    12%  { opacity: .85; }
    70%  { opacity: .5; }
    100% { transform: translate(var(--drift), -104vh) scale(1.15); opacity: 0; }
  }

  /* One column, so however many lines the hint wraps to it can never end up
     underneath the title. */
  #corner {
    position: absolute; bottom: 18px; left: 26px; z-index: 3;
    display: flex; flex-direction: column; gap: 9px;
    max-width: min(620px, calc(100% - 320px)); pointer-events: none;
  }
  #title { font-size: 13px; letter-spacing: .42em; text-transform: uppercase; color: var(--dimmer); }
  #title b { color: var(--ember-dim); letter-spacing: .42em; text-shadow: 0 0 22px rgba(255,154,60,.45); }
  #hint { font-size: 11px; color: #454b5b; letter-spacing: .05em; line-height: 1.7; }
  /* on a narrow window the controls win the bottom strip */
  @media (max-width: 720px) { #hint { display: none; } }

  #camui {
    position: absolute; bottom: 18px; right: 22px; z-index: 25;
    display: flex; gap: 6px; align-items: center;
  }
  #camui button {
    font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    background: rgba(10,13,19,.7); border: 1px solid var(--line); color: var(--dimmer);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; font-family: var(--font);
    transition: all .13s;
  }
  #camui button:hover { border-color: var(--line2); color: var(--dim); }
  #camui .zbtn { width: 32px; padding: 7px 0; text-align: center; font-size: 13px; letter-spacing: 0; }
  #camui #zlevel {
    font-family: var(--mono); font-size: 10px; color: var(--dimmer);
    min-width: 40px; text-align: center;
  }
  #camui #btn-reset:hover { border-color: var(--bad); color: var(--bad); }
  #camui #btn-sound.on { color: var(--good); border-color: rgba(110,231,168,.4); }

  /* ================= links — one per unlock ingredient ================= */

  #arc { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .lbase { fill: none; stroke: #1c212c; stroke-width: 6; stroke-linecap: round; }
  /* the glow is a fat translucent stroke under the line, not a drop-shadow
     filter — a filter would rasterise the line itself and go soft on zoom */
  .lglow {
    fill: none; stroke: var(--lc); stroke-width: 12; stroke-linecap: round;
    opacity: .13; transition: stroke-dasharray .16s linear;
  }
  .lfill {
    fill: none; stroke: var(--lc); stroke-width: 3.5; stroke-linecap: round;
    transition: stroke-dasharray .16s linear;
  }
  .link.lit .lglow { stroke-width: 20; animation: glowPulse 1.25s ease-in-out infinite; }
  .link.lit .lfill { stroke-width: 5.5; animation: linkPulse 1.25s ease-in-out infinite; }
  @keyframes linkPulse { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
  @keyframes glowPulse { 0%,100% { opacity: .20; } 50% { opacity: .42; } }
  /* a fuel line reads as a flow, not a requirement: dashed rail, thinner core */
  .link.feed .lbase { stroke-dasharray: 11 10; stroke-width: 5; }
  .link.feed .lfill { stroke-width: 3; }
  .link.done { opacity: .3; }
  .link.done .lfill { stroke-width: 2.5; }
  .link.done .lglow { opacity: 0; }
  .link.dormant { opacity: .34; }
  .link.dormant .lglow { opacity: 0; }

  #linklabels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .llabel {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
    padding: 3px 7px; border-radius: 5px; white-space: nowrap;
    background: rgba(9,11,16,.92); border: 1px solid var(--line); color: var(--dim);
    transition: opacity .2s;
  }
  .llabel.ready {
    color: #0c0f15; background: var(--lc); border-color: var(--lc);
    box-shadow: 0 0 18px -2px var(--lc); animation: linkPulse 1.25s ease-in-out infinite;
  }
  .llabel.gone { opacity: 0; }

  /* ================= ore tile ================= */

  .ore {
    position: absolute; z-index: 4;
    width: var(--bar-w); transform: translate(-50%, -50%);
    padding: 10px 13px 11px;
    border: 1px solid var(--line); border-radius: 12px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.035), transparent 40%),
      linear-gradient(180deg, #1b2029, #14171f);
    box-shadow: 0 10px 26px -12px #000, inset 0 1px 0 rgba(255,255,255,.05);
    transition: border-color .18s, box-shadow .18s, transform .14s, opacity .25s;
  }
  .ore:not(.run) { opacity: .92; }
  .ore.run { z-index: 5; border-color: color-mix(in srgb, var(--ore) 70%, var(--line)); }
  .ore.locked { opacity: .55; background: #0e1117; border-style: dashed; }
  .ore.ready {
    opacity: .96; border-style: solid; border-color: var(--ore);
    box-shadow: 0 0 34px -10px var(--ore), 0 10px 26px -14px #000;
    animation: readyPulse 1.6s ease-in-out infinite;
  }
  @keyframes readyPulse {
    0%,100% { box-shadow: 0 0 40px -14px var(--ore), 0 14px 30px -14px #000; }
    50%     { box-shadow: 0 0 62px -6px  var(--ore), 0 14px 30px -14px #000; }
  }
  .ore.facility {
    background:
      linear-gradient(180deg, rgba(243,173,85,.12), transparent 45%),
      linear-gradient(180deg, #25201a, #161513);
  }
  .ore.facility.hot {
    border-color: var(--ore);
    box-shadow: 0 0 32px -10px var(--ore), 0 12px 28px -14px #000;
  }
  /* The one tile the worker is stood at. Exactly one card on the board ever
     carries this, so it is the loudest thing on screen that is not a purchase.
     The furnace is never one of them — you trigger it, you do not stand at it. */
  .ore.worked {
    opacity: 1; border-color: var(--ember);
    box-shadow: 0 0 34px -8px var(--ember), 0 12px 28px -14px #000;
    animation: workedPulse 1.9s ease-in-out infinite;
  }
  @keyframes workedPulse {
    0%,100% { box-shadow: 0 0 30px -10px var(--ember), 0 12px 28px -14px #000; }
    50%     { box-shadow: 0 0 52px -4px  var(--ember), 0 12px 28px -14px #000; }
  }
  .tag.work {
    background: rgba(255,154,60,.16); color: var(--ember-hot);
    border-color: rgba(255,154,60,.45); box-shadow: 0 0 12px -3px var(--ember);
  }
  /* below the smelting line the bar is dull embers; once iron pours it goes to flame */
  .ore.facility .fill {
    background: linear-gradient(90deg, #3a2a22, #7a4a2a 60%, #a8663a);
    transition: width .1s linear, background .3s;
  }
  .ore.facility.smelting .fill {
    background: linear-gradient(90deg, #48250f, #d96820 55%, #ffd26b);
    box-shadow: 0 0 14px -2px #ff9a3c;
  }
  .ore.facility .floormark {
    width: 3px; z-index: 4; opacity: 1; background: #fff3c4;
    box-shadow: 0 0 6px #ffd27a, 0 0 12px #ff9a3c;
  }
  /* Feedback is done with light, never with scale. Animating the transform of
     a tile re-rasterises everything inside it, so every pour used to smear the
     readouts for a third of a second. */
  .ore.pop { animation: pop .40s ease-out; }
  @keyframes pop {
    0%   { box-shadow: 0 10px 26px -12px #000, inset 0 1px 0 rgba(255,255,255,.05); }
    26%  { box-shadow: 0 0 40px -6px var(--ore), 0 10px 26px -12px #000,
                       inset 0 1px 0 rgba(255,255,255,.30); }
    100% { box-shadow: 0 10px 26px -12px #000, inset 0 1px 0 rgba(255,255,255,.05); }
  }
  /* a tile arriving on the board for the first time — a one-off entrance, so a
     scale here is fine; it never overlaps anything you're trying to read */
  .ore.appear { animation: appear .55s cubic-bezier(.2,.9,.3,1); }
  @keyframes appear {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.84); }
    55%  { opacity: 1; }
    100% { opacity: .92; transform: translate(-50%,-50%) scale(1); }
  }
  /* click acknowledgement: a ring that expands off the edge and fades */
  .ore.hit { animation: hit .34s ease-out; }
  @keyframes hit {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ore) 60%, transparent),
                       0 10px 26px -12px #000; }
    100% { box-shadow: 0 0 0 14px transparent, 0 10px 26px -12px #000; }
  }

  .obody { cursor: pointer; }
  .obody:hover .ore-name { text-shadow: 0 0 22px var(--ore); }
  /* the furnace works this tile, so there is nothing here to press */
  .ore.passive .obody { cursor: inherit; }

  .ore-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .ore-name {
    font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ore); font-size: 12.5px;
    text-shadow: 0 0 16px color-mix(in srgb, var(--ore) 55%, transparent);
  }
  .ore-tags { margin-left: auto; display: flex; gap: 5px; }
  .tag {
    font-size: 9px; font-weight: 600; letter-spacing: .1em;
    padding: 2px 5px; border-radius: 4px;
    background: #262d3c; color: var(--dim); border: 1px solid #333c4f;
  }
  .tag.on {
    background: rgba(110,231,168,.14); color: var(--good);
    border-color: rgba(110,231,168,.38); box-shadow: 0 0 12px -4px var(--good);
  }
  .tag.cold {
    background: rgba(95,120,160,.14); color: #7f93b4; border-color: rgba(95,120,160,.4);
  }

  .amt { display: flex; align-items: baseline; gap: 7px; margin-bottom: 8px; }
  .amt .cur {
    font-family: var(--mono); font-size: var(--amt-size); font-weight: 700;
    line-height: 1; letter-spacing: -.02em; color: var(--ore);
    text-shadow: 0 0 26px color-mix(in srgb, var(--ore) 60%, transparent);
  }
  /* the capacity figure and the + that raises it read as one unit, set apart
     from the stock figure by the row gap rather than floating between them */
  .capgrp { display: inline-flex; align-items: center; gap: 6px; }
  .amt .capv { font-family: var(--mono); font-size: 19px; color: var(--dimmer); }
  .amt .rate {
    margin-left: auto; font-family: var(--mono); font-size: 12px;
    color: var(--good); text-shadow: 0 0 14px rgba(110,231,168,.45);
  }
  .amt .rate.neg { color: var(--dimmer); text-shadow: none; }

  /* the output bar and the + that widens it share a row */
  .trackrow { display: flex; align-items: center; gap: 7px; }
  .trackrow .track { flex: 1 1 auto; min-width: 0; }
  /* the number flashes white rather than growing — a scale or a filter on text
     is the single worst offender for blur inside a zoomed layer */
  .cur.tick { animation: tick .34s ease-out; }
  @keyframes tick {
    0%   { color: var(--ore); text-shadow: 0 0 26px color-mix(in srgb, var(--ore) 60%, transparent); }
    20%  { color: #fff;       text-shadow: 0 0 12px #fff, 0 0 38px var(--ore); }
    100% { color: var(--ore); text-shadow: 0 0 26px color-mix(in srgb, var(--ore) 60%, transparent); }
  }
  .ore.full .cur { color: var(--ember-hot); animation: fullPulse 1.1s ease-in-out infinite; }
  @keyframes fullPulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* the stock bar */
  .track {
    position: relative; height: 24px; border-radius: 5px;
    background: #06070a; border: 1px solid #262d3c; overflow: hidden;
    box-shadow: inset 0 2px 7px rgba(0,0,0,.85);
  }
  .fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background:
      linear-gradient(100deg,
        color-mix(in srgb, var(--ore) 30%, #000) 0%, var(--ore) 42%,
        color-mix(in srgb, var(--ore) 55%, #fff) 52%, var(--ore) 62%,
        color-mix(in srgb, var(--ore) 30%, #000) 100%);
    background-size: 260% 100%; animation: molten 3.4s linear infinite;
    box-shadow: 0 0 18px -3px var(--ore); transition: width .14s linear;
  }
  @keyframes molten { from { background-position: 160% 0; } to { background-position: -100% 0; } }
  .gloss {
    position: absolute; inset: 0 0 auto 0; height: 45%;
    background: linear-gradient(180deg, rgba(255,255,255,.20), transparent); pointer-events: none;
  }
  .tstatus {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .14em;
    color: rgba(255,255,255,.92); text-shadow: 0 1px 5px #000, 0 0 12px #000;
    pointer-events: none; opacity: .62; transition: opacity .2s;
  }
  .obody:hover .tstatus, .ore.run .tstatus { opacity: 1; }
  .tstatus.go { color: var(--ember-hot); animation: fullPulse 1.3s ease-in-out infinite; }
  .tstatus.cold { color: #8fa6c8; }

  /* the work cycle — its own rail UNDER the stock bar, never overlapping it */
  .cycbar {
    height: 6px; margin-top: 5px; border-radius: 3px; overflow: hidden;
    background: #06070a; border: 1px solid #1f2532;
  }
  .cyc {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--ember-dim), var(--ember-hot));
    box-shadow: 0 0 10px var(--ember);
    opacity: 0; transition: opacity .2s;
  }
  .cyc.on { opacity: 1; }
  /* heat going in reads hotter than the wait that follows it */
  .cyc.burn {
    background: linear-gradient(90deg, #d96820, #fff0c0);
    box-shadow: 0 0 14px var(--ember-hot);
  }
  .cyc.cool {
    background: linear-gradient(90deg, #2b3546, #55627d);
    box-shadow: none;
  }

  /* ---- the casting bench: a row of moulds, each on its own timer ----
     These are the only controls on the board that are NOT the worked tile:
     you press a mould directly, from wherever the worker happens to be stood. */
  .mrow { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
  .moulds { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 5px; }
  .mould {
    flex: 1 1 26px; min-width: 26px; height: 30px; padding: 0;
    position: relative; overflow: hidden;
    border: 1px solid #2b3242; border-radius: 6px;
    background: linear-gradient(180deg, #0f1219, #080a0f);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.8);
    cursor: pointer; font-family: var(--mono);
    transition: border-color .14s, box-shadow .14s, opacity .14s, transform .1s;
  }
  /* the cooling bar drains right to left; the hot layer fades out over it, so a
     mould goes orange -> grey as it sets, without animating any transform */
  .mcool { position: absolute; inset: 0 auto 0 0; width: 0%;
           background: linear-gradient(180deg, #46536b, #2b3546);
           transition: width .12s linear; }
  .mhot { position: absolute; inset: 0;
          background: linear-gradient(180deg, #ffb457, #d1610f);
          box-shadow: 0 0 12px var(--ember); transition: opacity .12s linear; }
  .msym {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    font-size: 8.5px; font-weight: 700; letter-spacing: .06em;
    color: var(--dimmer); text-shadow: 0 1px 3px #000;
  }
  /* the rails: top and bottom edges filling left to right toward one pour */
  .mprog { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .mprog::before, .mprog::after {
    content: ''; position: absolute; left: 0; height: 2px; width: var(--p, 0%);
    background: var(--ore); box-shadow: 0 0 7px var(--ore);
    border-radius: 2px; transition: width .18s linear;
  }
  .mprog::before { top: 0; }
  .mprog::after  { bottom: 0; }
  .mould.empty.no .mprog::before, .mould.empty.no .mprog::after { opacity: .7; }
  .mould.empty.can { border-color: var(--ore); box-shadow: 0 0 12px -5px var(--ore); }
  .mould.empty.can .msym { color: var(--ore); }
  .mould.empty.can .mprog { display: none; }
  .mould.empty:hover { border-color: var(--ore); box-shadow: 0 0 14px -5px var(--ore); }
  .mould.empty:hover .msym { color: var(--ore); }
  .mould.empty.no { opacity: .38; cursor: default; }
  .mould.cool { cursor: default; border-color: #3d4557; }
  .mould.cool .msym { color: #f0e0c8; }
  .mould.ready {
    border-color: var(--ore);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--ore) 62%, #000),
      color-mix(in srgb, var(--ore) 26%, #000));
    animation: mready 1.2s ease-in-out infinite;
  }
  .mould.ready .msym { color: #10131a; text-shadow: none; }
  .mould.ready.no { animation: none; opacity: .55; cursor: default; }
  @keyframes mready {
    0%,100% { box-shadow: 0 0 12px -5px var(--ore), inset 0 1px 0 rgba(255,255,255,.22); }
    50%     { box-shadow: 0 0 24px -2px var(--ore), inset 0 1px 0 rgba(255,255,255,.34); }
  }
  .mould:active:not(.cool):not(.no) { transform: scale(.94); }
  /* a furrow runs the same timer as a mould, but nothing in it is molten —
     green going in, green coming out */
  .mould.crop .mhot { background: linear-gradient(180deg, #8fd45f, #3f7a2a);
                      box-shadow: 0 0 12px rgba(143,191,106,.5); }
  .mould.crop .mcool { background: linear-gradient(180deg, #3b4a33, #232d1f); }
  .mould.crop.cool .msym { color: #dcecc9; }

  /* a charcoal stack: orange going in, fading to black as it chars */
  .mould.char .mhot { background: linear-gradient(180deg, #ff9a3c, #7a3410); box-shadow: 0 0 12px var(--ember); }
  .mould.char .mcool { background: linear-gradient(180deg, #2a2724, #141210); }
  .mould.char.cool .msym { color: #e8dccb; }
  /* a steel mould: white-hot, then a cold blue-grey, and a frozen one dark */
  .mould.steel .mhot { background: linear-gradient(180deg, #fff3d6, #ffb457); box-shadow: 0 0 14px #ffe9c0; }
  .mould.steel .mcool { background: linear-gradient(180deg, #56657f, #2e3848); }
  .mould.steel.frozen { border-color: #4a5a78; }
  .mould.steel.frozen .mhot { opacity: 0 !important; }
  .mould.steel.frozen .msym { color: #8fa6c8; }

  /* ---- buckets: a mould that fills from the left with water and then just
     sits there, full, waiting for whatever wants water ---- */
  .mould.bucket { cursor: default; flex: none; width: 46px; min-width: 0; }
  .mould.bucket .mcool { background: linear-gradient(180deg, #3aa7d6, #1f5f86);
                         box-shadow: 0 0 10px rgba(95,183,224,.45); }
  .mould.bucket .mhot { display: none; }
  .mould.bucket .msym { color: #dff3fb; }
  .mould.bucket.full { border-color: var(--ore); animation: mready 1.6s ease-in-out infinite; }
  .mould.bucket.full .msym { color: #10131a; }
  .mould.bucket.still .msym { color: var(--dimmer); }

  /* ---- the water: sun, cloud and ocean on one card ---- */
  .ore.water {
    background:
      linear-gradient(180deg, rgba(95,183,224,.12), transparent 45%),
      linear-gradient(180deg, #171f2b, #10141c);
  }
  .ore.water.hot { border-color: var(--ore); box-shadow: 0 0 32px -10px var(--ore), 0 12px 28px -14px #000; }
  .ore.water .fill { background: linear-gradient(90deg, #1f5f86, #5fb7e0 60%, #bfe9fb); }
  /* the river's floor, marked on the flow bar */
  .floormark {
    position: absolute; top: 0; bottom: 0; left: 0; width: 2px; z-index: 2;
    background: #ffd27a; box-shadow: 0 0 8px #ffd27a; opacity: .9; display: none;
    transition: left .18s linear;
  }
  .wrow { display: flex; gap: 6px; margin-top: 7px; }
  .wbtn {
    flex: 1 1 0; position: relative; overflow: hidden; height: 46px; padding: 0;
    border: 1px solid #2b3242; border-radius: 8px;
    background: linear-gradient(180deg, #0f1219, #080a0f);

  .wbtn.cloud .wfill { background: linear-gradient(180deg, #c9d6e6, #6f8199); opacity: .8; }
  .wbtn .wtxt {

  .wbtn.held .wtxt { animation: fullPulse 1s ease-in-out infinite; }

  .ocean {

  /* ---- the field: expandable plots on a grid, each walked through plow, seed,
     water and growth by hand ---- */
  .moulds.grid3 { display: grid; grid-template-columns: repeat(3, 66px); gap: 6px; justify-content: center; }
  .mould.plot { width: 66px; height: 66px; flex: none; min-width: 0; }
  .mould.plot .msym { font-size: 10px; }
  .mould.plot .mhot { display: none; }
  .mould.plot.empty   { background: linear-gradient(180deg, #2a2620, #17140f); }
  .mould.plot.plowed  { background: linear-gradient(180deg, #4a3826, #2a1f12); border-color: #5a4630; }
  .mould.plot.planted { background: linear-gradient(180deg, #4a3826, #2a1f12); border-color: #6f8a4a; }
  .mould.plot.planted .msym, .mould.plot.plowed .msym { color: #cdbfa8; }
  .mould.plot.plowing { border-color: #5a4630; }

  .mould.plot.plowing .msym { color: #e0cfb4; }

  .mould.plot.cool .mcool { background: linear-gradient(180deg, #5faa3f, #2f6a22); box-shadow: 0 0 10px rgba(143,191,106,.45); }
  .mould.plot.cool .msym { color: #e8f5d8; }
  .mould.plot.no { opacity: .45; cursor: default; }
  .mould.plot:not(.cool):not(.no):hover { border-color: var(--ore); box-shadow: 0 0 14px -5px var(--ore); }

  /* the field's seed pouch: which kind goes in next */
  .seedsel { display: flex; gap: 5px; margin-top: 7px; }
  .seedbtn {
    flex: 1 1 0; padding: 5px 4px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2b3242; background: linear-gradient(180deg, #0f1219, #080a0f);
    font-family: var(--mono); color: var(--dim); text-align: center;
    display: flex; flex-direction: column; gap: 2px; transition: all .13s;
  }
  .seedbtn b { font-size: 9.5px; letter-spacing: .14em; color: var(--c); }
  .seedbtn .sn { font-size: 9px; color: var(--dimmer); }
  .seedbtn.on { border-color: var(--c); box-shadow: 0 0 12px -4px var(--c); background: color-mix(in srgb, var(--c) 12%, #0b0d12); }
  .seedbtn.none b { opacity: .5; }
  /* the hero's pack on the battle card */
  .pack { display: flex; gap: 8px; margin-top: 11px; }
  .packbtn {
    flex: 1 1 0; padding: 9px 8px; border-radius: 7px; cursor: pointer;
    border: 1px solid #2b3242; background: linear-gradient(180deg, #0f1219, #080a0f);
    font-family: var(--mono); color: var(--dim); text-align: center;
    display: flex; flex-direction: column; gap: 2px; transition: all .13s;
  }
  .packbtn b { font-size: 17px; letter-spacing: .14em; color: var(--c); }
  .packbtn .pn { font-size: 15px; color: var(--dimmer); white-space: nowrap; }
  .packbtn.on {
    border-color: color-mix(in srgb, var(--c) 70%, #2b3242);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 30%, #0f1219), color-mix(in srgb, var(--c) 14%, #080a0f));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 10px -6px var(--c);
  }
  .packbtn.on .pn { color: var(--dim); }
  .startbtn.on {
    border: 2px solid var(--c); padding: 8px 7px;
    box-shadow: 0 0 16px -4px var(--c), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .startbtn.on b { color: #fff; text-shadow: 0 0 10px var(--c); }
  .packbtn.off { opacity: .5; border-style: dashed; }
  .packbtn.none b { opacity: .5; }
  /* a crop going down: the button flares in its colour and settles */
  .packbtn.used { animation: packUsed .7s ease-out; }
  @keyframes packUsed {
    0%   { transform: scale(1.12); background: color-mix(in srgb, var(--c) 45%, #0f1219); border-color: var(--c); box-shadow: 0 0 22px -2px var(--c); filter: brightness(1.8); }
    60%  { transform: scale(1); box-shadow: 0 0 12px -4px var(--c); }
    100% { transform: none; filter: none; }
  }
  /* the poultice taking: a green wash over the hero */
  .port.healed { animation: healed .8s ease-out; }
  @keyframes healed {
    0%   { box-shadow: 0 0 34px 2px #8fd45f, inset 0 0 22px rgba(143,212,95,.7); border-color: #8fd45f; filter: brightness(1.6) saturate(1.3); }
    100% { box-shadow: 0 0 18px -6px #ffd27a, inset 0 0 22px rgba(0,0,0,.65); }
  }

  /* ---- the equipment rack ---- */
  .ore.gear { width: 580px; }
  .ore.battle { width: 580px; }
  /* compact: everything a step or two down from the big card, the loot as a
     grid under the fighters, no wave picker */
  .ore.battle .amt .rate.gold { font-size: 22px; }
  .ore.battle .ore-tags .tag { font-size: 10.5px; }
  .ore.battle .arena { gap: 8px; }
  .ore.battle .fighter { gap: 4px; padding: 10px 8px 8px; }
  .ore.battle .port { width: 96px; height: 96px; }
  .ore.battle .port svg { width: 80px; height: 80px; }
  .ore.battle .fname { font-size: 14px; }
  .ore.battle .fstat { font-size: 12px; }
  .ore.battle .hpbar { height: 20px; }
  .ore.battle .hplab { font-size: 12px; }
  .ore.battle .vs { font-size: 14px; }
  .ore.battle .loot {

  }
  .ore.battle .loot .lt { grid-column: 1 / -1; font-size: 11px; margin-bottom: 0; }
  .ore.battle .lootrow { padding: 4px 8px; font-size: 12px; }
  .ore.battle .lootrow .ln { font-size: 14px; }
  .ore.battle .lootall { grid-column: 1 / -1; margin-top: 2px; padding: 6px; font-size: 12px; }
  .ore.battle .bstat { margin-top: 6px; min-height: 15px; font-size: 13px; }
  .ore.battle .pack { gap: 6px; margin-top: 7px; }
  .ore.battle .packbtn { padding: 6px 6px; }
  .ore.battle .packbtn b { font-size: 12.5px; }
  .ore.battle .packbtn .pn { font-size: 11px; }
  .ore.battle .amt .rate.gold {
    font-size: 34px; font-weight: 800; letter-spacing: .02em; color: #ffd27a;
    text-shadow: 0 0 22px rgba(255,210,122,.45);
  }
  .ore.battle .ore-tags .tag { font-size: 12.5px; }
  .ore.gear {
    background:
      linear-gradient(180deg, rgba(201,162,77,.10), transparent 45%),
      linear-gradient(180deg, #221e16, #14120e);
  }
  .grows { display: flex; flex-direction: column; gap: 8px; margin-top: 26px; }
  .gdiv { flex: none; width: 1px; margin: 4px 4px; background: rgba(255,255,255,.14); }
  /* the column titles sit over the first row's chips */
  .grows .grow:first-child .gchip { overflow: visible; }
  .grows .grow:first-child .gchip::before {
    position: absolute; left: 0; top: -17px; font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .18em; color: var(--dimmer); white-space: nowrap; font-weight: 700;
  }
  .grows .grow:first-child .gchip.eq::before { content: 'WORN'; }
  .grows .grow:first-child .gdiv + .gchip::before { content: 'RESERVE'; }
  .gchip.eq { background: linear-gradient(180deg, #1c1a12, #0f0e0a); }
  /* a piece taking shape: shaking, glowing ember-hot, no drop and no drag */
  .gchip.forging {
    --amp: 0px; --glow: 0; --tc: #ff9a3c; cursor: default;
    border-style: solid; overflow: visible;
    animation: benchShake .11s linear infinite;
    box-shadow: 0 0 calc(4px + 30px * var(--glow)) calc(-6px + 4px * var(--glow)) var(--tc), inset 0 2px 6px rgba(0,0,0,.8);
  }
  .gchip.forging .gname { color: var(--ember-hot); }
  .gchip.forging .ftime { color: var(--ember); }
  /* the finish: a ring bursting out in the piece's own colour */
  .gchip.born { animation: born .9s ease-out; }
  @keyframes born {
    0%   { box-shadow: 0 0 0 0 var(--tc), 0 0 30px 4px var(--tc), inset 0 0 40px var(--tc); filter: brightness(2.2); }
    60%  { filter: brightness(1.3); }
    100% { box-shadow: 0 0 0 22px transparent, 0 0 0 0 transparent, inset 0 2px 6px rgba(0,0,0,.8); filter: none; }
  }
  .grow { display: flex; align-items: center; gap: 9px; }
  .glab {
    flex: none; width: 84px; font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: .14em; color: var(--dimmer);
  }
  .gchips { flex: 1 1 auto; min-width: 0; display: flex; gap: 7px; }
  .gchip {
    --tc: #4a5164;
    flex: 1 1 0; min-width: 0; height: 52px; padding: 0 10px; position: relative;
    border: 1px solid var(--tc); border-radius: 6px;
    background: linear-gradient(180deg, #0f1219, #080a0f);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.8);
    font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .04em;
    color: var(--dim); cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    transition: border-color .13s, box-shadow .13s, opacity .13s;
  }
  .gchip .gname { color: var(--mc, var(--tc)); font-size: 12.5px; letter-spacing: .08em; }
  .gchip .gstat { color: var(--text); min-height: 1.25em; }
  .gchip.t1 .gstat, .gchip.t2 .gstat, .gchip.t3 .gstat { color: var(--tc); }
  /* the chip wears its metal: iron in the warm tan of the bars it came from,
     steel in the cool bright blue of the steelworks, with a sheen and a glow
     so it plainly outranks iron; the rarity colour stays on the stats line */
  .gchip.iron {
    --mc: #e6cdb8;
    border-color: color-mix(in srgb, var(--mc) 55%, #2b3242);
    background: linear-gradient(180deg, color-mix(in srgb, var(--mc) 13%, #0f1219), color-mix(in srgb, var(--mc) 5%, #080a0f));
  }
  .gchip.steel {
    --mc: #a9d6ff;
    border-color: color-mix(in srgb, var(--mc) 75%, #2b3242);
    background: linear-gradient(180deg, color-mix(in srgb, var(--mc) 22%, #0f1219), color-mix(in srgb, var(--mc) 8%, #080a0f));
    box-shadow: 0 0 14px -5px var(--mc), inset 0 1px 0 rgba(255,255,255,.10), inset 0 2px 6px rgba(0,0,0,.6);
  }
  .gchip.steel .gname { text-shadow: 0 0 10px color-mix(in srgb, var(--mc) 70%, transparent); }
  .gchip.t0 { --tc: #7c8598; }
  .gchip.t1 { --tc: #6ee7a8; }
  .gchip.t2 { --tc: #6fb3ff; }
  .gchip.t3 { --tc: #d9a0ff; }
  .gchip .gplus {
    position: absolute; right: 4px; top: 4px; padding: 1px 5px; border-radius: 4px;
    background: rgba(255,210,122,.16); border: 1px solid rgba(255,210,122,.5); color: #ffd27a;
    font-size: 10.5px; letter-spacing: .04em; line-height: 1.3;
  }
  .gchip.steel .gname::before { content: '\2726 '; }
  .gchip.none { border-style: dashed; cursor: default; color: var(--dimmer); justify-content: center; align-items: center; }
  .gchip.over { border-color: #fff; box-shadow: 0 0 14px -3px #fff, inset 0 2px 6px rgba(0,0,0,.8); }
  .gchip.bad { border-color: var(--bad); box-shadow: 0 0 14px -3px var(--bad); }
  .gchip.eq { box-shadow: 0 0 14px -4px var(--mc, var(--tc)), inset 0 2px 6px rgba(0,0,0,.8); border-left: 3px solid #ffd27a; }
  .gchip.eq.steel { box-shadow: 0 0 18px -3px var(--mc), inset 0 1px 0 rgba(255,255,255,.14), inset 0 2px 6px rgba(0,0,0,.6); }
  .gchip.bak:hover { border-color: #fff; }
  .gchip .gx {
    position: absolute; top: 3px; right: 3px; width: 19px; height: 19px; padding: 0;
    border: 0; border-radius: 4px; background: rgba(0,0,0,.5); color: var(--dimmer);
    font-size: 14px; line-height: 19px; cursor: pointer; font-family: var(--mono); text-align: center;
  }
  .gchip .gx:hover { color: var(--bad); background: rgba(239,107,107,.2); }
  .gsum {
    margin-top: 11px; padding: 9px 12px; border-radius: 6px; background: rgba(0,0,0,.35);
    font-family: var(--mono); font-size: 13.5px; letter-spacing: .1em; color: var(--dim); text-align: center;
  }
  .gsum b { color: var(--text); font-weight: 700; }

  /* ---- the scrap pile ---- */
  .ore.recycle {
    background:
      linear-gradient(180deg, rgba(201,162,77,.10), transparent 45%),
      linear-gradient(180deg, #221d14, #14110c);
  }
  .rbox { margin-top: 6px; }
  .rslot {
    position: relative; min-height: 64px; border-radius: 10px; padding: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed #5a4a2c; background: rgba(0,0,0,.28);
    transition: border-color .14s, background .14s, box-shadow .14s;
  }
  .rslot.armed { border-color: color-mix(in srgb, var(--ore) 55%, #5a4a2c); }
  .rslot.over { border-style: solid; border-color: var(--ore); background: rgba(201,162,77,.14); box-shadow: 0 0 24px -6px var(--ore); }
  .rhint {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .18em;
    color: var(--dimmer); pointer-events: none;
  }
  .rslot.over .rhint { color: var(--ore); }
  .rtxt {
    margin-top: 7px; text-align: center;
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--dim);
  }

  /* ---- the enhancement bench ---- */
  .ore.bench {
    width: 372px;
    background:
      linear-gradient(180deg, rgba(217,140,255,.10), transparent 45%),
      linear-gradient(180deg, #1e1826, #120f16);
  }
  .ore.bench.hot { border-color: var(--ore); box-shadow: 0 0 calc(14px + 30px * var(--glow, 0)) -8px var(--ore), 0 12px 28px -14px #000; }
  .benchbox { margin-top: 2px; }
  /* the head: the odds large on the left, the two ember counters on the right */
  .bhead { display: flex; align-items: stretch; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .bchance { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
  .bpct {
    font-family: var(--mono); font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -.01em; white-space: nowrap;
    color: var(--dimmer); text-shadow: none; transition: color .2s;
  }
  .bpct.good { color: #8fe0a8; text-shadow: 0 0 22px rgba(143,224,168,.45); }
  .bpct.fair { color: var(--ember-hot); text-shadow: 0 0 22px rgba(255,210,122,.4); }
  .bpct.poor { color: #ef6b6b; text-shadow: 0 0 22px rgba(239,107,107,.4); }
  .blab { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .14em; color: var(--dim); white-space: pre-line; line-height: 1.45; }
  .bembers { display: flex; gap: 6px; flex: none; }
  .bember {
    width: 64px; padding: 6px 4px 5px; border-radius: 8px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    border: 1px solid var(--line2); background: rgba(0,0,0,.28); transition: all .14s;
  }
  .bember .bn { font-family: var(--mono); font-size: 20px; font-weight: 800; line-height: 1; color: var(--text); }
  .bember b { font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; line-height: 1.25; color: var(--c); }
  .bember.none { opacity: .45; }
  .bember.wanted { opacity: 1; border-color: color-mix(in srgb, var(--c) 65%, #2b3242); box-shadow: 0 0 14px -4px var(--c); }
  .bember.short { opacity: 1; border-color: #ef6b6b; box-shadow: 0 0 14px -4px #ef6b6b; }
  .bember.short .bn { color: #ef6b6b; }
  .bslot {
    --amp: 0px; --glow: 0;
    position: relative; min-height: 78px; border-radius: 10px; padding: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed #4a3f5c; background: rgba(0,0,0,.28);
    transition: border-color .14s, background .14s;
  }
  .bslot.empty { cursor: default; }
  .bslot.over { border-color: var(--ore); background: rgba(217,140,255,.10); box-shadow: 0 0 22px -6px var(--ore); }
  .bslot.working, .bslot.done, .bslot.offer { border-style: solid; border-color: color-mix(in srgb, var(--ore) 55%, #4a3f5c); }
  .bslot.offer { background: rgba(217,140,255,.06); }
  .bslot .bchip { width: 62%; }
  .bslot .bchip .gchip { width: 100%; height: 52px; cursor: default;
    box-shadow: 0 0 calc(6px + 34px * var(--glow)) calc(-6px + 4px * var(--glow)) var(--ore), inset 0 2px 6px rgba(0,0,0,.8); }
  .bslot.working .bchip { animation: benchShake .11s linear infinite; }
  @keyframes benchShake {
    0%   { transform: translate(calc(-1 * var(--amp)), 0); }
    25%  { transform: translate(0, calc(-0.6 * var(--amp))); }
    50%  { transform: translate(var(--amp), 0); }
    75%  { transform: translate(0, calc(0.6 * var(--amp))); }
    100% { transform: translate(calc(-1 * var(--amp)), 0); }
  }
  .bslot.done .bchip { animation: fullPulse 1s ease-in-out infinite; }
  .bhint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .18em; color: var(--dimmer);
    pointer-events: none;
  }
  .bslot.working .bhint, .bslot.done .bhint, .bslot.offer .bhint { display: none; }
  .bbtns { display: flex; gap: 6px; margin-top: 7px; }
  .bbtn {
    flex: 1 1 0; padding: 8px 6px; border-radius: 8px; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
    border: 1px solid var(--line2); background: rgba(255,255,255,.04); color: var(--dim);
    transition: all .13s;
  }
  .bbtn:hover { border-color: var(--text); color: var(--text); }
  .bbtn.bgo.can { border-color: var(--ore); color: #fff; background: rgba(217,140,255,.16); box-shadow: 0 0 16px -4px var(--ore); animation: fullPulse 1.3s ease-in-out infinite; }
  .bbtn.bgo.poor { opacity: .45; cursor: default; }
  .bbar { height: 8px; margin-top: 7px; border-radius: 4px; overflow: hidden; background: #06070a; border: 1px solid #1f2532; }
  .bfill { height: 100%; width: 0%; background: linear-gradient(90deg, #5a3a78, #d98cff); box-shadow: 0 0 10px #d98cff; transition: width .1s linear; }
  #gghost {
    position: fixed; z-index: 200; pointer-events: none; width: 150px;
    transform: translate(-50%, -50%) rotate(-3deg) scale(1.05); display: none;
  }
  #gghost.show { display: block; }
  #gghost .gchip { width: 100%; height: 52px; box-shadow: 0 14px 24px -8px #000; }
  #gghost .gx { display: none; }
  .gchip { cursor: grab; }
  .gchip:active { cursor: grabbing; }

  /* ---- the battle ---- */
  .ore.battle {
    background:
      linear-gradient(180deg, rgba(224,107,107,.10), transparent 45%),
      linear-gradient(180deg, #241717, #15100f);
  }
  .ore.battle .fill { background: linear-gradient(90deg, #7a2323, #e06b6b 60%, #ffb3b3); }
  .ore.battle.dead { opacity: .7; }
  .ore.battle.dead .fill { background: linear-gradient(90deg, #2b3546, #55627d); }
  .brow { margin-top: 4px; }
  /* the arena: two fighters face to face, each with a portrait and a health bar */
  .arena { display: flex; align-items: stretch; gap: 12px; }
  .fighter .skull {
    position: absolute; left: 50%; top: 8px; width: 96px; height: 96px; transform: translateX(-50%);
    display: none; align-items: center; justify-content: center; pointer-events: none; z-index: 3;
    font-size: 58px; line-height: 1; color: #f2f2f6; text-shadow: 0 0 6px #000, 0 0 18px #000, 0 2px 2px #000;
  }
  .fighter.dead .skull { display: flex; animation: skullIn .5s ease-out; }
  .fighter.dead .port svg { filter: grayscale(1) brightness(.4); }
  .fighter.dead .fname, .fighter.dead .fstat { color: var(--dimmer); }
  .fighter.dead .hpfill { filter: grayscale(1) brightness(.6); }
  @keyframes skullIn { 0% { transform: translateX(-50%) scale(1.6); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
  .fighter {
    position: relative;
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 12px 12px; border-radius: 10px;
    background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.06);
  }
  .port {
    width: 170px; height: 170px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 38%, #2b3140, #0d1015 72%);
    border: 1px solid #333c4f; box-shadow: inset 0 0 22px rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .port svg { width: 140px; height: 140px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)); }
  .fighter.hero .port  { border-color: rgba(255,210,122,.5); box-shadow: 0 0 18px -6px #ffd27a, inset 0 0 22px rgba(0,0,0,.65); }
  .fighter.enemy .port { border-color: rgba(160,102,224,.5); box-shadow: 0 0 18px -6px #a066e0, inset 0 0 22px rgba(0,0,0,.65); }
  .port.struck { animation: struck .2s ease-out; }
  @keyframes struck {
    0%   { transform: translateX(-3px); filter: brightness(2.4) saturate(.2); }
    50%  { transform: translateX(3px); }
    100% { transform: none; filter: none; }
  }
  .port.dead svg { filter: grayscale(1) brightness(.45); }
  .port.idle svg { opacity: .4; }
  .fname { font-family: var(--mono); font-size: 21px; letter-spacing: .16em; font-weight: 700; color: var(--text); white-space: nowrap; }
  .fighter.enemy .fname { color: #d9bbff; }
  .fighter.hero .fname { color: var(--ember-hot); }
  .fstat { font-family: var(--mono); font-size: 17px; letter-spacing: .06em; color: var(--dim); white-space: nowrap; }
  .hpbar {
    position: relative; width: 100%; height: 30px; border-radius: 4px; overflow: hidden;
    background: #06070a; border: 1px solid #262d3c; box-shadow: inset 0 2px 6px rgba(0,0,0,.85);
  }
  .hpfill { position: absolute; inset: 0 auto 0 0; width: 0%; transition: width .1s linear; }
  .hfill { background: linear-gradient(90deg, #7a2323, #e06b6b 60%, #ffb3b3); box-shadow: 0 0 12px -3px #e06b6b; }
  .efill { background: linear-gradient(90deg, #4a2a6a, #a066e0 60%, #d9bbff); box-shadow: 0 0 12px -3px #a066e0; }
  .hplab {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 16.5px; font-weight: 700; letter-spacing: .12em;
    color: rgba(255,255,255,.92); text-shadow: 0 1px 5px #000, 0 0 12px #000;
  }
  .vs { align-self: center; font-family: var(--mono); font-size: 21px; font-weight: 800; letter-spacing: .2em; color: var(--dimmer); }
  /* the floor: a column of drop rows beside the fighters */
  .loot {
    flex: 0 0 300px; display: flex; flex-direction: column; gap: 7px; padding: 13px;
    border-radius: 10px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.06);
  }
  .loot .lt { font-family: var(--mono); font-size: 14px; letter-spacing: .16em; font-weight: 700; color: var(--dimmer); text-align: center; margin-bottom: 4px; }
  .lootrow {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 11px;
    border-radius: 6px; border: 1px solid var(--line2); background: rgba(255,255,255,.03);
    font-family: var(--mono); font-size: 15.5px; letter-spacing: .08em; color: var(--dim); cursor: pointer; transition: all .13s;
  }
  .lootrow b { color: var(--c); font-weight: 700; white-space: nowrap; }
  .lootrow .ln { font-weight: 700; font-size: 19px; color: var(--text); }
  .lootrow.none { opacity: .35; cursor: default; }
  .lootrow.some { border-color: color-mix(in srgb, var(--c) 60%, #2b3242); box-shadow: 0 0 10px -4px var(--c); }
  .lootrow.some:hover { background: rgba(255,255,255,.08); }
  /* a drop landing: the row falls in from above, flashes, and settles */
  .lootrow.drop { animation: lootDrop .5s cubic-bezier(.2, .9, .3, 1.25); }
  .lootrow.drop .ln { animation: lootNum .5s ease-out; }
  @keyframes lootDrop {
    0%   { transform: translateY(-14px) scale(1.06); filter: brightness(2.2); box-shadow: 0 10px 18px -6px #000, 0 0 16px -2px var(--c); }
    45%  { transform: translateY(2px) scale(1); filter: brightness(1.5); }
    70%  { transform: translateY(-1px); }
    100% { transform: none; filter: none; }
  }
  @keyframes lootNum {
    0%   { transform: scale(1.7); color: #fff; }
    100% { transform: none; }
  }
  .lootall {
    margin-top: auto; padding: 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line2); background: rgba(255,210,122,.08); color: var(--ember-hot);
    font-family: var(--mono); font-size: 15.5px; letter-spacing: .14em; font-weight: 700;
  }
  .lootall.none { opacity: .35; cursor: default; }
  .lootall.some { border-color: var(--ember-hot); animation: fullPulse 1.3s ease-in-out infinite; }
  .startsel { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .startbtn { flex: 1 1 90px; }
  .startbtn.buy.can { border-color: var(--ember-hot); animation: fullPulse 1.3s ease-in-out infinite; }
  .bstat {
    margin-top: 6px; text-align: center; min-height: 19px;
    font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: .16em; color: var(--dim);
  }
  .bstat.go { color: var(--ember-hot); animation: fullPulse 1.3s ease-in-out infinite; }
  .bstat.cold { color: #8fa6c8; }

  .lockmsg {
    font-family: var(--mono); font-size: 11px; color: var(--dimmer);
    text-align: center; letter-spacing: .05em; line-height: 1.65; padding: 3px 0 1px;
  }
  .lockmsg b { color: var(--dim); font-weight: 600; }

  .float {
    position: absolute; z-index: 30; pointer-events: none;
    font-family: var(--mono); font-size: 22px; font-weight: 700;
    text-shadow: 0 0 20px currentColor, 0 2px 6px #000;
    animation: rise 1.05s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rise {
    0%   { opacity: 0; transform: translate(-50%, 6px)   scale(.7); }
    18%  { opacity: 1; transform: translate(-50%, -6px)  scale(1.14); }
    100% { opacity: 0; transform: translate(-50%, -74px) scale(1); }
  }

  /* ========== upgrades ==========
     Each one sits on the card next to what it changes. The bottom strip is
     kept clear for whatever comes next, and only a locked card uses it. */

  .ustrip {
    display: flex; flex-direction: column; gap: 4px;
    margin-top: 9px; padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,.06);
  }

  .uslot { display: inline-flex; align-items: center; flex: none; }

  /* a full-width button whose face is a line of text */
  .utext {
    --uc: var(--line2);
    position: relative; display: block; width: 100%;
    padding: 8px 12px; margin: 0;
    border: 1px solid color-mix(in srgb, var(--uc) 42%, var(--line));
    border-radius: 8px;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--uc) 15%, var(--panel3)),
        color-mix(in srgb, var(--uc) 7%,  var(--panel2)));
    text-align: left; font-family: var(--mono);
    font-size: 11px; letter-spacing: .04em; line-height: 1.2;
    color: var(--dim); cursor: pointer;
    transition: border-color .13s, box-shadow .13s, color .13s, opacity .13s, transform .1s;
  }
  .ulabel { position: relative; z-index: 2; }
  .utext.can {
    border-color: var(--uc); color: color-mix(in srgb, var(--uc) 78%, #fff);
    box-shadow: 0 0 15px -3px var(--uc), inset 0 0 14px -9px var(--uc);
  }
  .utext:hover:not(.max) {
    border-color: var(--uc); color: color-mix(in srgb, var(--uc) 78%, #fff);
    box-shadow: 0 0 20px -4px var(--uc);
  }
  .utext:active:not(.max) { transform: scale(.985); }
  .utext.gated { opacity: .45; }
  .utext.max { opacity: .35; cursor: default; border-style: dashed; }

  /* the compact + button */
  .ubtn {
    --uc: var(--line2);
    position: relative; flex: none;
    width: 28px; height: 28px; padding: 0;
    border: 1px solid color-mix(in srgb, var(--uc) 42%, var(--line));
    border-radius: 7px;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--uc) 15%, var(--panel3)),
        color-mix(in srgb, var(--uc) 7%,  var(--panel2)));
    color: var(--dim); cursor: pointer; font-family: var(--font);
    transition: border-color .13s, box-shadow .13s, color .13s, opacity .13s, transform .1s;
  }
  /* two bars rather than a glyph: a typed "+" sits off-centre in its em box,
     and no font metric can be trusted to centre it in a 28px square */
  .uplus { position: absolute; inset: 0; z-index: 2; }
  .uplus::before, .uplus::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    background: currentColor; border-radius: 1px;
    transform: translate(-50%, -50%);
  }
  .uplus::before { width: 13px; height: 2.5px; }
  .uplus::after  { width: 2.5px; height: 13px; }

  /* cost progress runs right around the button, so the glow closes on all four
     sides instead of stopping at the top and bottom rails */
  .uring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
           pointer-events: none; z-index: 3; }
  /* No stroke-dasharray here: a CSS rule outranks a presentation attribute, so
     declaring it would pin the ring at its initial value and nothing painted
     per-frame could ever move it. The dash is set as an inline style instead.
     Butt caps, not round — a round cap on a zero-length dash paints a dot. */
  .uringbar {
    fill: none; stroke: var(--uc); stroke-width: 2; stroke-linecap: butt;
    transition: stroke-dasharray .18s linear;
  }
  .ubtn.can .uringbar { stroke-width: 2.5; }

  .ubtn.can {
    border-color: var(--uc);
    color: color-mix(in srgb, var(--uc) 72%, #fff);
    box-shadow: 0 0 15px -3px var(--uc), inset 0 0 12px -8px var(--uc);
  }
  .ubtn:hover:not(.max) {
    border-color: var(--uc); color: color-mix(in srgb, var(--uc) 72%, #fff);
    box-shadow: 0 0 20px -4px var(--uc);
  }
  .ubtn:active:not(.max) { transform: scale(.9); }
  .ubtn.gated { opacity: .45; }
  .ubtn.max { opacity: .3; cursor: default; border-style: dashed; }
  .ubtn.max .uringbar, .utext.max .uringbar { display: none; }
  /* --uc is the colour of the resource this upgrade is priced in */
  .utile {
    --uc: var(--line2);
    position: relative; flex: none;
    width: var(--ut); min-height: 50px; padding: 4px 3px 3px;
    border: 1px solid color-mix(in srgb, var(--uc) 45%, var(--line));
    border-radius: 7px;
    background:
      linear-gradient(180deg,
        color-mix(in srgb, var(--uc) 15%, var(--panel3)),
        color-mix(in srgb, var(--uc) 7%,  var(--panel2)));
    color: var(--dim); cursor: pointer; font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: border-color .13s, transform .1s, box-shadow .13s, color .13s, opacity .13s;
  }
  .utile.wide { width: auto; padding: 6px 14px 5px; }
  .usym {
    position: relative; z-index: 2;
    font-size: 11.5px; font-weight: 800; letter-spacing: .03em; line-height: 1;
  }
  .ucost {
    position: relative; z-index: 2;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; line-height: 1;
    color: var(--pricec, var(--dimmer)); white-space: nowrap;
  }
  .utile.wide .ucost { font-size: 11px; display: flex; gap: 8px; }
  /* how many times this has been bought — always shown, starts at 0 */
  .ulv {
    position: relative; z-index: 2;
    font-family: var(--mono); font-size: 9.5px; font-weight: 700; line-height: 1;
    color: var(--dimmer); padding: 1px 5px; border-radius: 3px;
    background: rgba(0,0,0,.35); min-width: 18px; text-align: center;
  }
  .utile.owned .ulv { color: var(--good); }

  /* progress runs along the EDGES only — top and bottom rails, left to right */
  .uprog { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .uprog::before, .uprog::after {
    content: ''; position: absolute; left: 0; height: 2px; width: var(--p, 0%);
    background: var(--uc); box-shadow: 0 0 7px var(--uc);
    border-radius: 2px; transition: width .18s linear;
  }
  .uprog::before { top: -1px; }
  .uprog::after  { bottom: -1px; }

  .utile.can {
    border-color: var(--uc);
    color: color-mix(in srgb, var(--uc) 70%, #fff);
    box-shadow: 0 0 15px -3px var(--uc);
  }
  .utile.gated { opacity: .5; }
  .utile:hover:not(.max):not(.owned) {
    transform: translateY(-2px);
    border-color: var(--uc); color: color-mix(in srgb, var(--uc) 70%, #fff);
    box-shadow: 0 8px 16px -8px #000, 0 0 20px -5px var(--uc);
  }
  .utile:active:not(.max):not(.owned) { transform: translateY(0) scale(.94); }
  .utile.owned {
    border-color: rgba(110,231,168,.42); background: rgba(110,231,168,.08);
    color: var(--good); cursor: default;
  }
  .utile.max { opacity: .38; cursor: default; border-style: dashed; }

  /* shared hover card, parked in the viewport so no tile can clip it and
     zooming never distorts it */
  #upop {
    position: absolute; z-index: 40; width: 300px; pointer-events: none;
    padding: 15px 17px; border-radius: 12px;
    background: rgba(9,12,18,.975);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line2); box-shadow: 0 22px 50px -18px #000;
    opacity: 0; transition: opacity .12s;
  }
  #upop.show { opacity: 1; }
  #upop .pt { font-size: 18px; font-weight: 700; letter-spacing: .01em; line-height: 1.25; }
  #upop .pe { font-size: 15.5px; color: var(--text); margin-top: 9px; line-height: 1.5; }
  #upop .pe em { color: var(--ember); font-style: normal; font-weight: 700; }
  #upop .pe b { color: var(--ember-hot); font-weight: 700; }
  #upop .pd { font-size: 13.5px; color: var(--dim); margin-top: 9px; line-height: 1.45; }
  #upop .pc { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; font-family: var(--mono); font-size: 14px; }
  #upop .pc span {
    padding: 5px 10px; border-radius: 6px; border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 7px; font-weight: 600;
  }
  #upop .pc span::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--c); box-shadow: 0 0 7px var(--c);
  }
  #upop .pc span.ok    { color: var(--text); background: #10141c; border-color: var(--line); }
  #upop .pc span.short { color: var(--bad); background: rgba(239,107,107,.10); border-color: rgba(239,107,107,.32); }

  #sidebar {
    position:absolute; z-index:26; top:16px; right:16px; width:270px; max-width:calc(100vw - 32px);
    max-height:calc(100vh - 90px); overflow:auto; padding:14px 16px; background:rgba(12,16,23,.96);
    border:1px solid var(--line2); border-radius:12px; box-shadow:0 8px 28px #0006;
    font-family: var(--mono); font-size:16px; color: var(--dim);
  }
  #sidebar summary { cursor:pointer; list-style:none; font-size:14px; letter-spacing:.2em; color: var(--dimmer); }
  #sidebar summary::-webkit-details-marker { display:none; }
  #sidebar summary b { color: var(--ember-dim); }
  #sidebar[open] summary { margin-bottom:10px; }
  #sidebar { width:380px; }
  .sb-section + .sb-section { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.08); }
  .sb-head { font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; color: var(--dimmer); margin-bottom:7px; }
  .sb-group { margin-top:8px; }
  .sb-card { font-size:13.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; color: var(--ember-dim); padding:4px 0 2px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:3px; }
  #sb-stocks { display:flex; flex-wrap:wrap; gap:6px; }
  .sb-row { display:flex; flex-direction:column; gap:1px; padding:5px 9px; border-radius:7px; line-height:1.2;
    border:1px solid var(--line2); background:rgba(255,255,255,.03); min-width:74px; }
  .sb-row .sb-n { color: var(--c, var(--text)); font-size:11px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
  .sb-row .sb-v { color: var(--text); font-weight:700; font-size:17px; white-space:nowrap; }
  .sb-row .sb-v small { color: var(--dimmer); font-weight:400; font-size:11px; }
  .sb-row.sb-full { border-color: color-mix(in srgb, var(--ember-hot) 50%, var(--line2)); }
  .sb-row.sb-full .sb-v { color: var(--ember-hot); }
  .sb-up { display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%; text-align:left;
    padding:6px 8px; margin:3px 0; border-radius:6px; cursor:pointer;
    border:1px solid var(--line2); background:rgba(255,255,255,.03); color: var(--dim); font:inherit; }
  .sb-up .sb-name { color: var(--text); line-height:1.3; }
  .sb-up .sb-name small { color: var(--dimmer); font-size:12.5px; margin-left:4px; }
  .sb-up .sb-cost { color: var(--dimmer); white-space:nowrap; text-align:right; flex:none; }
  .sb-up .sb-cost span { color: var(--c); display:block; }
  .sb-up.can { border-color: color-mix(in srgb, var(--uc, var(--ember)) 60%, var(--line2)); }
  .sb-up.can .sb-name { color:#fff; }
  .sb-up.can .sb-cost span { color: var(--good); }
  .sb-up.can:hover { background:rgba(255,255,255,.07); }
  .sb-up.poor { opacity:.7; cursor:default; }
  .sb-empty { color: var(--dimmer); font-size:14px; padding:2px 0; }
  @media (max-width:720px) { #sidebar { display:none; } }
  #astra-guide { position:absolute; z-index:26; top:16px; left:16px; width:280px; max-width:calc(100vw - 32px); padding:14px; background:rgba(12,16,23,.96); border:1px solid var(--line2); border-radius:12px; box-shadow:0 8px 28px #0006; }
  #astra-guide summary { cursor:pointer; font-size:11px; letter-spacing:.12em; color:var(--dim); }
  #astra-guide summary b { color:var(--ember); } #astra-guide summary span { float:right; letter-spacing:0; }
  #astra-goal { display:block; margin-top:14px; font-size:17px; }
  #astra-guide p { margin:9px 0; font-size:12px; line-height:1.5; color:var(--dim); }
  #astra-guide #astra-notice { color:var(--good); } #astra-notice:empty { display:none; }
  #astra-guide small { display:block; margin-top:10px; color:var(--dim); font-size:10px; line-height:1.5; }
  #astra-guide button, .astra-actions button { border:1px solid var(--line2); background:#242d3c; color:var(--text); border-radius:5px; padding:7px 9px; font:inherit; font-size:11px; cursor:pointer; }
  #astra-guide button:hover, .astra-actions button:hover { border-color:var(--ember); }
  .astra-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; } .astra-actions:empty { display:none; }
  .blab { display:block; max-width:260px; font-size:11px; line-height:1.5; white-space:normal; }
  @media (max-width:720px) { #astra-guide { top:8px; left:8px; width:230px; padding:10px; } #astra-guide p { font-size:11px; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  .ore.facility.burn-ready { border-color:#ffb85c; box-shadow:0 0 0 1px #ffb85c55,0 12px 30px -12px #000; }
  .furnace-actions { flex-direction:column; gap:9px; }
  .burn-control { width:100%; padding:10px; border:1px solid #3b4557; border-radius:8px; background:#0c111a; }
  .astra-actions .burn-button { width:100%; min-height:46px; font-size:15px; font-weight:750; letter-spacing:.01em; background:#293445; color:#bfcbdc; border-color:#48566c; }
  .astra-actions .burn-button:disabled { cursor:default; opacity:1; }
  .burn-control.ready { background:#2c1c10; border-color:#b77732; }
  .astra-actions .ready .burn-button { background:linear-gradient(#ffc779,#f59a36); color:#231307; border-color:#ffdc9e; box-shadow:0 2px 12px #e58a2933; cursor:pointer; }
  .astra-actions .ready .burn-button:hover { background:#ffd79c; box-shadow:0 0 0 2px #ffbd6344; }
  .astra-actions .ready .burn-button:active { background:#f09c45; }
  .burn-explanation { margin:8px 0 0; color:#b5c1d2; font-size:11px; line-height:1.5; }
  .ready .burn-explanation { color:#ffd6a4; }
  .burn-clock { height:4px; margin-top:8px; background:#080c12; border-radius:3px; overflow:hidden; }
  .burn-clock > div { height:100%; background:#819abb; }

<body>
<div id="forge">
  <div id="embers"></div>
  <div id="world">
    <svg id="arc"></svg>
    <div id="linklabels"></div>
  </div>
  <details id="sidebar" open>
    <summary><b>STOCKS</b> &amp; UPGRADES</summary>
    <div class="sb-section"><div class="sb-head">Stocks</div><div id="sb-stocks"></div></div>
    <div class="sb-section"><div class="sb-head">Upgrades</div><div id="sb-ups"></div><div class="sb-empty" id="sb-none">nothing to buy yet</div></div>
  </details>
  <div id="camui">
    <button class="zbtn" id="cam-out" title="zoom out">&minus;</button>
    <span id="zlevel">100%</span>
    <button class="zbtn" id="cam-in" title="zoom in">+</button>
    <button id="cam-fit">fit</button>
    <button id="btn-sound" title="toggle sound">sound</button>
    <button id="btn-reset">reset</button>
  </div>
  <div id="upop"></div>
</div>
<div id="gghost"></div>

<script>
'use strict';

/* =========================================================================
   RESOURCE DEFINITIONS
        ___    ___
         ___  ___
           ___
   Wood -> Stone -> [Furnace] -> Iron -> [Moulds] -> [Plow Field].
   Every bar starts at 0/5 — capacity is the first thing you ever buy.
   ========================================================================= */

const BASE_CAP = 5;

const FURNACE_ID           = 'furnace';
const FURNACE_HEAT_MAX     = 100;   // what a bare furnace can hold
const LINING_STEP          = 20;    // degrees each level of Firebrick adds to that
/* the furnace's top heat: the bare hundred, plus twenty a level of lining */
function heatMaxAt(lvl) { return FURNACE_HEAT_MAX + LINING_STEP * (lvl || 0); }
function heatMax() { return heatMaxAt(S.ores[FURNACE_ID].lvl.lining); }
const FURNACE_STOKE_COST   = 5;     // wood per stoke
const FURNACE_HEAT_GAIN    = 25;    // total heat one burn delivers
const FURNACE_BURN_TIME    = 4.0;   // seconds the burn takes to deliver it
const FURNACE_COOLDOWN     = 14.0;  // base seconds of cooldown once the burn ends
const FURNACE_IDLE_COOL    = 0.10;  // flat heat lost per second
const SMELT_MIN_HEAT       = 30;    // iron only pours once the furnace reads this
const SMELT_HEAT_DRAIN     = 0.30;  // extra heat per second while the furnace is smelting
const HEAT_SMELT_RATE      = 0.80;  // ingots per second at full heat

/* Losses also rise with temperature, the way a real hot thing sheds heat
   faster than a warm one. That is what stops heat climbing for ever: a stoke
   delivers a fixed 25°, so each Bellows level settles at the temperature where
   its cycle's losses finally cancel that out. The furnace is generous: every
   stoke nets a gain until it is nearly full — base holds ~82°, one Bellows 100°. */
const HEAT_LOSS_K          = 0.012;   // extra loss per second, per degree held

const BELLOWS_STEP         = 0.80;  // each level multiplies the cooldown
const BELLOWS_FLOOR        = 1.5;   // and never takes it below this
/* The Stoker is a trickle, not a hand: every few seconds it drops wood
   straight onto the fire for a little heat. It never lights a burn and never
   touches the cooldown, so the furnace still wants you at it. Level L feeds
   L logs a time for 2 degrees each, a worse rate than a burn's 5 per log. */
const STOKER_EVERY         = 12;     // seconds between feeds
const STOKER_HEAT_PER_WOOD = 2;     // heat one fed log gives
function stokerWood(lvl) { return lvl; }
function stokerRate(lvl) { lvl = lvl ?? S.ores[FURNACE_ID].lvl.stoker; return lvl > 0 ? stokerWood(lvl) * STOKER_HEAT_PER_WOOD / STOKER_EVERY : 0; }

/* ---- the casting bench ----
   Moulds are the one tile that is not "worked": each mould is its own little
   machine you press directly, so the bench runs alongside whatever the worker
   is doing rather than competing with it for the one pair of hands. */
const MOULD_FILL_COST      = 3;     // iron poured into one mould
const MOULD_COOL_TIME      = 8;     // seconds it takes to set
const MOULD_AUTO_INTERVAL  = 4;     // seconds per automated action at level 1
const MOULD_BASE           = 3;     // moulds on the bench before any upgrade
const MOULD_PER_LEVEL      = 1;     // More Moulds adds this many each level

/* ---- the plow field ----
   A furrow is the same little machine as a mould, with the pour taken out:
   sowing costs only the labour of the click, and what comes back is grain. */
const FURROW_GROW_TIME     = 20;    // seconds a watered plot takes to ripen (grain)
const PLOW_TIME            = 6;     // seconds a plot takes to turn over

/* ---- crops and what they do ----
   Three seeds fall from the battle, by depth, and grow into three crops the
   hero eats on its own: a meal at the start of a run, a tonic with it, and a
   poultice when things go badly — that last one on a cooldown, so a full
   larder cannot make a fight trivial. */
const CROPS = {
  grain: { name:'Grain', sym:'G', color:'#d9c26a', grow:20, seedTo:Infinity, use:'meal',     desc:'Eaten at the start of a run: +20% max HP for the run.' },
};
const CROP_KINDS = Object.keys(CROPS);
function seedKindFor(wave) { return CROP_KINDS.find(k => wave <= CROPS[k].seedTo) || 'grain'; }
const MEAL_HP          = 0.20;
const TONIC_ATK        = 0.25;
const POULTICE_AT      = 0.30;   // of max HP
const POULTICE_HEAL    = 0.50;   // of max HP
const POULTICE_CD      = 20;     // seconds
const FIELD_SIZE           = 3;     // a 3x3 of plots, fixed
const FURROW_BASE          = FIELD_SIZE;
const FURROW_PER_LEVEL     = 1;

/* ---- the equipment rack ----
   Five slots on the body, one worn and two spare for each. A piece is beaten
   out of iron and rolls its stats on the anvil: plain, or one or two extras. */
const GEAR_SLOTS = ['head', 'chest', 'weapon', 'offhand', 'legs'];
const GEAR_NAME  = { head:'Helm', chest:'Plate', weapon:'Blade', offhand:'Shield', legs:'Greaves' };
const GEAR_BASE  = { head:{ def:1, hp:4 }, chest:{ def:2, hp:8 }, weapon:{ atk:3 }, offhand:{ def:2 }, legs:{ def:1, hp:5 } };
const GEAR_EXTRA = { atk:[1, 3], def:[1, 2], hp:[3, 8], spd:[5, 15] };   // roll range per extra stat
const GEAR_TIER  = ['Plain', 'Fine', 'Masterwork', 'Legendary'];
/* what a piece is made of: the stat scale, the extras it can roll, what it
   costs at the rack and gives back at the melt */
const GEAR_MATS = {
  iron:  { name:'Iron',  scale:1, extraScale:1,   rolls:[0.5, 0.85, 1],  pay:'bars',  cost:3, back:1, time:5 },
  steel: { name:'Steel', scale:2, extraScale:1.5, rolls:[0, 0.4, 0.8, 1], pay:'steel', cost:3, back:1, time:8 },
};
const TIER_COLOR = ['#9aa3b5', '#6ee7a8', '#6fb3ff', '#d9a0ff'];
/* the rack forges one piece at a time; the spare slot it will land in is
   held for it while it takes shape */
function forgeJob() { return S.ores.gear.job; }
function isReserved(slot, i) { const j = forgeJob(); return !!j && j.slot === slot && j.i === i; }
const FORGE_COST = 3;     // bars per piece — iron has to go through the moulds first
const MELT_BACK  = 1;     // bars returned when a piece is melted
const HERO_BASE  = { hp:20, atk:1, def:0, spd:0 };

/* ---- the battle ----
   Waves come one after another until you fall. Each one beaten drops gold
   and a seed; falling rests you for half a minute. */
const BATTLE_COOLDOWN  = 10;
const FLEE_REGEN_TIME  = 10;    // seconds from empty to full after running away
const ENEMY_NAMES = ['Rat', 'Wolf', 'Bandit', 'Boar', 'Ghoul', 'Ogre', 'Golem', 'Wyrm', 'Lich', 'Dragon'];
/* the difficulty curve is stretched so that wave 10 is as hard as wave 9 used
   to be: the steel drop sits at 10, and it must be reachable on iron gear */
const WAVE_STRETCH = 8 / 9;
/* past the steel drop the curve turns exponential, so that wave 20 asks for a
   full set of steel with a few enhancements on it: plain iron tops out near
   15, plain steel near 16, good steel near 18, good steel at +3 clears 20 */
const STEEP_FROM = 12;
const STEEP_HP   = 1.10;   // enemy HP grows this much per wave beyond STEEP_FROM
const STEEP_ATK  = 1.05;   // and attack and defence this much
function enemyFor(wave) {
  const n = Math.max(1, wave);
  const k = 1 + (n - 1) * WAVE_STRETCH;          // the wave the stats are drawn from
  let hp = 10 + 7 * (k - 1) + 0.5 * (k - 1) * (k - 1);
  let atk = 2 + Math.floor(k * 0.8), def = Math.floor(k / 4);
  if (n > STEEP_FROM) {
    const x = n - STEEP_FROM;
    hp *= Math.pow(STEEP_HP, x); atk *= Math.pow(STEEP_ATK, x); def *= Math.pow(STEEP_ATK, x);
  }
  return { name: ENEMY_NAMES[Math.min(ENEMY_NAMES.length - 1, Math.floor((n - 1) / 3))] + ' ' + n,
           hp: Math.round(hp), atk: Math.round(atk), def: Math.floor(def), every: 1.0 };
}

/* ---- water ----
   A fixed hundred units of water are split between the cloud and the ocean.
   Holding the sun lifts ocean into cloud; holding the cloud rains it back. Every
   unit moved counts toward the FLOW, measured over the last few seconds, and
   flow is what fills the buckets. A river guarantees a floor under it. */
const WATER_TOTAL          = 100;   // units in the cycle, cloud + ocean
const CYCLE_RATE           = 10;    // units moved per second while a hold is down
const FLOW_WINDOW          = 10;    // seconds the flow readout looks back over
const FLOW_MAX             = CYCLE_RATE;   // what a perfectly worked cycle reads
const BUCKET_SIZE          = 100;   // units of fill in a full bucket
const BUCKET_FILL_K        = 0.8;   // fill per second, per unit of flow — 25s at half flow
const BUCKET_MAX           = 8;
const RIVER_FLOOR_STEP     = 1.2;   // flow the river guarantees, per level
const RIVER_MAX            = 6;
/* what a River level asks: the flow it needs to see right now, the flow it
   spends out of the last window, and the stone it is built from */
function riverGate(lvl)  { return 2 + 1.5 * lvl; }
function riverSpend(lvl) { return 20 + 10 * lvl; }
function riverStone(lvl) { return Math.floor(25 * Math.pow(1.6, lvl)); }
function riverFloor(lvl) { lvl = lvl ?? S.ores.water.lvl.river; return RIVER_FLOOR_STEP * lvl; }
/* the next bucket, priced in bars — 2, 3, 4, 6, 10, 15, 22, 34 */
function bucketCost(n) { n = n ?? S.ores.buckets.buckets.length; return Math.max(1, Math.floor(2 * Math.pow(1.5, n))); }

/* ---- the steel moulds (and the shelved charcoal clamp) ----
   Steel is iron that only sets while the furnace is properly hot. The clamp
   constants stay for when charcoal returns; no tile uses them now. Both
   are benches like the moulds, and both are learned from the battle. */
const CLAMP_WOOD           = 5;     // wood buried per stack
const CLAMP_TIME           = 25;    // seconds a stack smoulders
const STEEL_IRON           = 3;     // iron per steel mould
const STEEL_CHAR           = 1;     // charcoal per steel mould
const STEEL_TIME           = 12;    // seconds to set, while hot enough
const STEEL_HEAT           = 90;    // the furnace must read at least this
/* ---- the enhancement bench ----
   Drop a piece on it, pay, and wait. It comes back one level higher, with a
   tenth more of everything per level; failures preserve the equipment. The odds fall with
   every level; the wait and the price climb. */
const ENH_CHANCE = [1, 1, 1, 0.80, 0.70];         // by current level; 70% after
const ENH_FLOOR  = 0.70;
const ENH_TIME   = (plus) => 10 + 5 * plus;                 // seconds, by current level
const ENH_STEP   = 0.10;                                    // stat bonus per level
function enhChance(plus) { return ENH_CHANCE[plus] ?? ENH_FLOOR; }
/* gold for one attempt: the target level, times the material, times the tier */
function enhCost(item) {
  const t = (item.plus || 0) + 1;
  const mat = item.mat === 'steel' ? 2 : 1;
  return Math.round(10 * t * mat * (1 + 0.25 * (item.tier || 0)));
}
/* embers for one attempt, of the piece's own metal: 1, 3, 6, 10, 15, ... */
function enhEmbers(target) { return target * (target + 1) / 2; }
function enhMat(item) { return item.mat === 'steel' ? 'steel' : 'iron'; }

/* what falls out of the battle: a tile appears on the board the first time
   you beat the wave named here */
const DROPS = [
  { wave:10, text:'THE BOAR DROPS THE STEEL RECIPE · STEELWORKS ABOVE THE MOULDS, A FIELD AND BUCKETS TO THE LEFT' },
];

/* All the benches run on the same plot machinery; these say which numbers
   and words a given one uses, so there is one implementation rather than four. */
function isBench(id)   { const d = BY_ID[id]; return !!d && (d.casting || d.farming || d.charring || d.steeling); }
function plotCount(id, lvl) {
  const d = BY_ID[id];
  if (!isBench(id)) return 0;
  lvl = lvl ?? S.ores[id].lvl.mould;
  return d.farming ? FURROW_BASE + FURROW_PER_LEVEL * lvl : MOULD_BASE + MOULD_PER_LEVEL * lvl;
}
function plotTime(id) {
  const d = BY_ID[id];
  return d.farming ? FURROW_GROW_TIME : d.charring ? CLAMP_TIME : d.steeling ? STEEL_TIME : MOULD_COOL_TIME;
}
/* what one plot costs to start — the field asks for nothing but the click */
function plotCost(id) {
  const d = BY_ID[id];
  if (d.farming) return null;
  if (d.charring) return { wood: CLAMP_WOOD };
  if (d.steeling) return { iron: STEEL_IRON };
  return { iron: MOULD_FILL_COST };
}
/* a price in words: "3 iron + 1 charcoal", or in symbols: "3Fe+1Ch" */
function costWords(cost) { return Object.keys(cost).map(k => `${cost[k]} ${resName(k).toLowerCase()}`).join(' + '); }
function resWord(k)      { return resName(k).toLowerCase(); }
function costSyms(cost)  { return Object.keys(cost).map(k => `${cost[k]} ${resWord(k)}`).join(' + '); }
function plotWords(id) {
  const d = BY_ID[id], cost = plotCost(id);
  if (d.farming)  return { unit:'furrow', start:'SOW', startVerb:'sow it', busy:'growing', done:'ripe', take:'reap' };
  if (d.charring) return { unit:'stack', start:costSyms(cost), startVerb:`bury ${costWords(cost)}`, busy:'smouldering', done:'done', take:'take out' };   // done stacks empty themselves
  if (d.steeling) return { unit:'mould', start:costSyms(cost), startVerb:`pour ${costWords(cost)} in`, busy:'setting', done:'set', take:'take out' };
  return { unit:'mould', start:costSyms(cost), startVerb:`pour ${costWords(cost)} in`, busy:'setting', done:'set', take:'take out' };
}
/* the steel moulds only run while the furnace is hot enough */
function steelHot() { return heatOf() >= STEEL_HEAT; }

const ORES = [
  { id:'wood',       name:'Wood',       sym:'Wd', color:'#d68a4c', tier:1,
    unit:'logs',   verb:'CHOP',   yield:1, time:1800, unlock:null },
  { id:'stone',      name:'Stone',      sym:'St', color:'#a9a49b', tier:2,
    unit:'blocks', verb:'QUARRY', yield:1, time:2600, unlock:{ wood:8 } },
  { id:'furnace',    name:'Furnace',    sym:'Fu', color:'#f3ad55', facility:true,
    unlock:{ stone:5 } },
  /* Iron costs nothing: building the furnace opens it in the same commit, so
     it arrives with the thing that pours it. `opensWith` keeps it off the
     board until then — it has no unlock cost to show on a locked card. */
  { id:'iron',       name:'Iron',       sym:'Fe', color:'#c3d2e6', tier:3,
    unit:'iron', verb:'SMELT', heatDriven:true, yield:1, unlock:null,
    opensWith: FURNACE_ID },
  /* The bench. `name` is what the tile is called, `res` what it holds — the
     card says MOULDS, but every cost and lock line says "iron bars". */
  /* The moulds live ON the iron card and come free with the furnace: `hosted`
     names the card that draws them. They keep their own stock (bars), their
     own upgrades and their own links; only the card is shared. */
  { id:'bars',       name:'Moulds',     sym:'Br', color:'#e6cdb8', tier:4,
    res:'Iron Bars', unit:'bars', verb:'CAST', casting:true, yield:1,
    unlockLabel:'CAST MOULDS', unlock:{ iron:5 } },
  /* The field. Same bench shape as the moulds — a row of furrows, each on its
     own timer — but nothing is poured in: the cost is the plow, paid once, and
     after that it is only ever labour and time. */
  { id:'farm',       name:'Plow Field', sym:'Pl', color:'#8fbf6a', tier:5,
    res:'Grain', unit:'sheaves', verb:'REAP', farming:true, yield:1,
    unlockLabel:'CRAFT PLOW', unlock:{ bars:2 }, dropAt:10 },
  /* Buckets are beaten out of bars and fill with water on their own. They
     arrive with the first bar you cast, and cost nothing to open. */
  { id:'buckets',    name:'Buckets',    sym:'Bk', color:'#7fc4d8',
    unit:'buckets', bucketing:true, unlockLabel:'BUILD SHELF', unlock:{ bars:2 }, dropAt:10 },
  /* The water cycle. Opens the moment the first bucket exists to fill. */
  { id:'water',      name:'Water',      sym:'Wa', color:'#5fb7e0',
    unit:'flow', water:true, unlockLabel:'OPEN THE SKY', unlock:{ stone:30 },
    revealWhen: () => S.ores.buckets.unlocked },
  /* The rack: iron's third use. Gear is forged here and worn here. */
  { id:'gear',       name:'Equipment',  sym:'Eq', color:'#c9a24d',
    unit:'pieces', gearing:true, unlockLabel:'BUILD RACK', unlock:{ bars:2 }, noLink:true },
  /* The battle. Arrives with the rack; you stand here to fight. */
  { id:'battle',     name:'Battle',     sym:'Bt', color:'#e06b6b',
    unit:'waves', verb:'FIGHT', battling:true, unlock:null, opensWith:'gear' },
  /* Steel: iron set while the furnace is at full roar. Learned from the
     boars, built with gold. (The charcoal clamp is shelved for now: the
     charring bench machinery stays, but no tile uses it.) */
  { id:'steel',      name:'Steel',      sym:'Sl', color:'#9fb7d6', tier:5,
    res:'Steel Bars', unit:'steel', verb:'TEMPER', steeling:true, yield:1,
    unlockLabel:'BUILD STEELWORKS', unlock:{ gold:250 }, dropAt:10 },
  /* The enhancement bench: drag gear onto it, pay, wait, hope. */
  { id:'bench',      name:'Enhance',    sym:'En', color:'#d98cff',
    unit:'levels', enhancing:true, unlockLabel:'BUILD BENCH', unlock:{ gold:50 } },
  /* The scrap pile: drag a piece of gear onto it and it goes back to a bar
     of its metal. Cheap, because it is the only way to be rid of a dud. */
  { id:'recycle',    name:'Recycle',    sym:'Rc', color:'#c9a24d',
    unit:'pieces', recycling:true, unlockLabel:'START A SCRAP PILE', unlock:{ gold:25 } },
];
ORES.forEach(o => { if (!o.facility) o.cap = BASE_CAP; });

const BY_ID = {};
ORES.forEach(o => BY_ID[o.id] = o);
/* Gold is not a tile: it is the battle's purse. It sits in BY_ID so prices
   and hover cards can name and colour it like any other stock. */
const GOLD = { id:'gold', name:'Gold', sym:'Au', color:'#ffd27a', unit:'gold', virtual:true };
BY_ID.gold = GOLD;
/* what a beaten wave pays: rising with depth, so the deep runs are the rich ones */
function goldFor(wave) { return Math.ceil(2 * Math.pow(1.35, Math.max(0, wave - 1))); }

/* ---- what a kill drops ----
   Gold every wave, but a random amount around the wave's figure; a seed of
   the band's kind on a chance; and, on a chance that climbs with depth, an
   ember — the stuff the enhancement bench burns. Iron embers fall in the
