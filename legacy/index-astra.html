/* ---- the battle, one slice at a time ----
   Switched on with a click, it fights by itself alongside whatever you are
   working: wave after wave until a fall. A fall switches it off: after the
   rest, it waits for another click, so nothing from the pack is eaten on a
   run you did not ask for. A second click mid-run pauses it where it stands. */
function stepBattle(o, dt) {
  o.poulticeCd = Math.max(0, o.poulticeCd - dt);
  if (o.cooldown > 0) {
    // the rest after a fall: the hero comes back to full over its length
    o.cooldown = Math.max(0, o.cooldown - dt);
    o.heroHp = Math.min(heroStats(false).hp, o.heroHp + heroMaxRest() / BATTLE_COOLDOWN * dt);
    o.running = false;
    return;
  }
  if (!o.active) {
    // resting: the hero mends at the rate the last fight left it with
    const max = heroMaxRest();
    if (o.heroHp < max) o.heroHp = Math.min(max, o.heroHp + (o.regenRate || max / FLEE_REGEN_TIME) * dt);
    o.running = false;
    if (!o.auto) return;
    if (o.heroHp < max - 1e-6) return;          // still mending: wait, keep the intent
    startRun(o);
  }
  o.running = true;
  const hero = heroStats();
  o.heroT += dt; o.enemyT += dt;
  const enemy = enemyFor(o.wave);
  let guard = 0;
  while (o.heroT >= hero.every && guard++ < 50) {
    o.heroT -= hero.every;
    o.enemyHp -= heroDamage(hero, enemy);
    if (!fxOff) { sfx('hit'); replay(bars.battle.eport, 'struck'); }
    if (o.enemyHp <= 0) { winWave(o, hero); return; }
  }
  guard = 0;
  while (o.enemyT >= enemy.every && guard++ < 50) {
    o.enemyT -= enemy.every;
    o.heroHp -= enemyDamage(enemy, hero);
    if (!fxOff) { sfx('hurt'); replay(bars.battle.hport, 'struck'); }
    if (o.heroHp > 0) tryPoultice(o, hero);
    if (o.heroHp <= 0) { fall(o); return; }
  }
}
/* the hero's full health while resting: the rack alone, no meal */
function heroMaxRest() { return heroStats(false).hp; }
/* running away: the run ends where it stands, the hero keeps what health it
   has and mends it over a few seconds before it may go again */
function flee(o) {
  o.active = false; o.auto = false; o.buff = null; o.running = false;
  o.heroHp = Math.max(0, Math.min(o.heroHp, heroMaxRest()));
  o.regenRate = heroMaxRest() / FLEE_REGEN_TIME;
  replay(bars.battle.root, 'hit');
  sfx('no');
}
function startRun(o) {
  // the pack: a meal and a tonic, if they are there and allowed
  o.buff = { hp: 0, atk: 0 };
  const f = S.ores.farm;
  // whatever is lying on the floor stays there: the next run's drops pile on top
  o.active = true;
  const hero = heroStats();
  o.wave = 1; o.startAt = 1; o.heroHp = hero.hp;
  const e = enemyFor(o.wave);
  o.enemyHp = o.enemyMax = e.hp;
  o.heroT = 0; o.enemyT = 0;
}
/* a crop being used: its pack button flares for a moment */
function packUsed(kind) {
  if (fxOff || !bars.battle) return;
  const btn = bars.battle.pack.querySelector(`.packbtn[data-k="${kind}"]`);
  if (btn) replay(btn, 'used');
}
/* the poultice: when the hero is in trouble, if there is one, and not too soon */
function tryPoultice(o, hero) {
  return false;   // the poultice went with the herb
  if (o.poulticeCd > 0 || !o.pack.herb || S.ores.farm.crops.herb < 1) return false;
  if (o.heroHp > hero.hp * POULTICE_AT) return false;
  S.ores.farm.crops.herb -= 1;
  o.heroHp = Math.min(hero.hp, o.heroHp + hero.hp * POULTICE_HEAL);
  o.poulticeCd = POULTICE_CD;
  packUsed('herb');
  if (!fxOff) replay(bars.battle.hport, 'healed');
  sfx('heal');
  return true;
}
/* a wave beaten: its drops onto the floor, a breather for the hero, the next one in */
function winWave(o, hero) {
  const L = rollDrops(o.wave);
  o.floor.gold += L.gold;
  if (L.seed) o.floor.seeds[L.seed] += 1;
  if (L.ember) o.floor.embers[L.ember] += 1;
  const wasBest = o.best;
  o.best = Math.max(o.best, o.wave);
  // the first fall of a named wave puts a new tile on the board
  DROPS.forEach(D => {
    if (wasBest < D.wave && o.best >= D.wave) {
      floatText('battle', D.text, BY_ID.steel.color);
      sfx('unlock');
      pendingUnlock = true;
      pendingFit = true;                 // the new tile may be off-screen: show it
    }
  });
  o.wave++;
  o.heroHp = Math.min(hero.hp, o.heroHp + hero.hp * 0.25);
  const e = enemyFor(o.wave);
  o.enemyHp = o.enemyMax = e.hp;
  o.heroT = 0; o.enemyT = 0;
  o.lifetime += 1;
  // no words for the drop itself: the loot rows bounce and the coins ring
  punch('battle');
  sfx('coin');
}
function fall(o) {
  o.heroHp = 0; o.active = false; o.cooldown = BATTLE_COOLDOWN; o.buff = null;
  o.running = false;                            // auto stays on: it fights again once mended
  o.regenRate = heroMaxRest() / BATTLE_COOLDOWN;
  floatText('battle', 'FELL AT WAVE ' + o.wave, BY_ID.battle.color);
  replay(bars.battle.root, 'hit');
  sfx('die');
}

/* =========================================================================
   DOM
   ========================================================================= */

const el = {
  forge:  document.getElementById('forge'),
  world:  document.getElementById('world'),
  arc:    document.getElementById('arc'),
  labels: document.getElementById('linklabels'),
  embers: document.getElementById('embers'),
  upop:   document.getElementById('upop'),
  zlevel: document.getElementById('zlevel'),
};

el.world.style.width  = WORLD.w + 'px';
el.world.style.height = WORLD.h + 'px';

const bars = {};
const linkEls = {};
let upTiles = [];
let hovered = null;

function fmt(n) {
  if (n < 1000) {
    if (n % 1 === 0 || n >= 10) return String(Math.floor(n));
    return n < 1 ? n.toFixed(2) : n.toFixed(1);   // sub-1 rates deserve the extra digit
  }
  const units = ['K','M','B','T','Qa','Qi','Sx','Sp'];
  let u = -1;
  while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + units[u];
}

/* =========================================================================
   CAMERA — pan by dragging, zoom on the wheel
   ========================================================================= */

const ZOOM_MIN = 0.30, ZOOM_MAX = 2.40;
let cam = { x: 0, y: 0, z: 1 };

function clampZoom(z) { return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)); }

/* keep at least a slice of the map on screen no matter how far you drag */
function clampPan() {
  const W = el.forge.clientWidth, H = el.forge.clientHeight;
  const m = 160;
  cam.x = Math.min(W - m, Math.max(m - WORLD.w * cam.z, cam.x));
  cam.y = Math.min(H - m, Math.max(m - WORLD.h * cam.z, cam.y));
}

function applyCam() {
  clampPan();
  // land the map on whole device pixels — a half-pixel offset softens every
  // border and glyph on the board
  const dpr = window.devicePixelRatio || 1;
  const px = Math.round(cam.x * dpr) / dpr;
  const py = Math.round(cam.y * dpr) / dpr;
  el.world.style.transform = `translate(${px}px, ${py}px) scale(${cam.z})`;
  const pct = Math.round(cam.z * 100) + '%';
  if (el.zlevel.textContent !== pct) el.zlevel.textContent = pct;
}

/* zoom around a point in viewport space, so the map stays under the cursor */
function zoomAt(sx, sy, z) {
  const nz = clampZoom(z);
  if (nz === cam.z) return;
  cam.x = sx - (sx - cam.x) * (nz / cam.z);
  cam.y = sy - (sy - cam.y) * (nz / cam.z);
  cam.z = nz;
  applyCam();
}

/* the wheel fires far too often to write storage on every notch */
let camSaveT;
function saveCam() { clearTimeout(camSaveT); camSaveT = setTimeout(save, 400); }

function zoomCenter(mult) {
  zoomAt(el.forge.clientWidth / 2, el.forge.clientHeight / 2, cam.z * mult);
  saveCam();
}

/* Frame what is actually on the board, not the whole empty map — early on that
   is just Wood and Stone, and the view opens out as the ladder reveals. */
/* a tile's box in world units — untransformed, so the camera can't skew it */
function tileBox(id) {
  const bar = bars[id], n = bar.root;
  // a hidden card measures zero, so keep the last real size it reported
  if (n.offsetWidth) { bar._bw = n.offsetWidth; bar._bh = n.offsetHeight; }
  const w = bar._bw || 320, h = bar._bh || 130;
  return { cx: n.offsetLeft, cy: n.offsetTop,
           l: n.offsetLeft - w / 2, r: n.offsetLeft + w / 2,
           t: n.offsetTop  - h / 2, b: n.offsetTop  + h / 2 };
}

function revealedBounds() {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  ORES.forEach(d => {
    if (!revealed.has(d.id) || d.hosted) return;
    const q = tileBox(d.id);
    l = Math.min(l, q.l); r = Math.max(r, q.r);
    t = Math.min(t, q.t); b = Math.max(b, q.b);
  });
  if (!Number.isFinite(l)) return { l: 0, t: 0, r: WORLD.w, b: WORLD.h };
  const pad = 70;
  return { l: l - pad, t: t - pad, r: r + pad, b: b + pad };
}

function fitCam() {
  const W = el.forge.clientWidth, H = el.forge.clientHeight;
  const g = revealedBounds(), gw = g.r - g.l, gh = g.b - g.t;
  // never blow a two-tile board up past life size
  cam.z = clampZoom(Math.min(1, W / gw, H / gh));
  cam.x = (W - gw * cam.z) / 2 - g.l * cam.z;
  cam.y = (H - gh * cam.z) / 2 - g.t * cam.z;
  applyCam();
}

/* The opening shot: Wood dead centre, pulled back just far enough that the
   Stone it feeds sits up in the top-left corner. */
function openingCam() {
  if (!revealed.has('stone')) return fitCam();
  const W = el.forge.clientWidth, H = el.forge.clientHeight;
  const w = tileBox('wood'), s = tileBox('stone');
  const margin = 34;
  // wood is centred, so half the viewport has to reach stone's outer corner
  const dx = (w.cx - s.l) + margin, dy = (w.cy - s.t) + margin;
  cam.z = clampZoom(Math.min(1, (W / 2) / dx, (H / 2) / dy));
  cam.x = W / 2 - w.cx * cam.z;
  cam.y = H / 2 - w.cy * cam.z;
  applyCam();
}

el.forge.addEventListener('wheel', e => {
  e.preventDefault();
  const f = el.forge.getBoundingClientRect();
  // trackpad pinches arrive as ctrl+wheel and want a stronger response
  const k = e.ctrlKey ? 0.010 : 0.0016;
  const step = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX - f.left, e.clientY - f.top, cam.z * Math.exp(-step * k));
  hidePop();
  saveCam();
}, { passive: false });

/* Dragging pans from anywhere, tiles included — a drag past a few pixels
   cancels the click underneath so panning never smelts by accident. */
let drag = null, panned = false, swallowClick = false;

el.forge.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.button !== 1) return;
  drag = { sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, id: e.pointerId };
  panned = false;
});

window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!panned) {
    if (Math.hypot(dx, dy) < 5) return;
    panned = true;
    el.forge.classList.add('grabbing');
    hovered = null;
    hidePop();
  }
  cam.x = drag.cx + dx;
  cam.y = drag.cy + dy;
  applyCam();
});

window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null;
  el.forge.classList.remove('grabbing');
  if (panned) { swallowClick = true; saveCam(); }
  panned = false;
});

el.forge.addEventListener('click', e => {
  if (!swallowClick) return;
  swallowClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* ---- links ---- */

/* the card's footprint plus a little breathing room, in world units */
function linkBox(id) {
  const q = tileBox(id), pad = 8;
  return { l: q.l - pad, r: q.r + pad, t: q.t - pad, b: q.b + pad };
}
function inBox(bx, p) { return p[0] > bx.l && p[0] < bx.r && p[1] > bx.t && p[1] < bx.b; }

/* bisect between a point known to be inside the box and one known to be
   outside it, and return the parameter that lands on the boundary */
function edgeT(bez, box, tIn, tOut) {
  for (let k = 0; k < 18; k++) {
    const m = (tIn + tOut) / 2;
    if (inBox(box, bez(m))) tIn = m; else tOut = m;
  }
  return tOut;
}

function buildLinks() {
  const W = WORLD.w, H = WORLD.h;
  const at = id => { const box = tileBox(id); return { x:box.cx, y:box.cy }; };

  const byTarget = {};
  LINKS.forEach(L => (byTarget[L.at || L.ore] = byTarget[L.at || L.ore] || []).push(L));

  let svg = '', labels = '';
  Object.keys(byTarget).forEach(target => {
    const group = byTarget[target];
    group.forEach((L, i) => {
      const a = at(L.src), b = at(target);
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      const off = (i - (group.length - 1) / 2) * Math.min(70, len * 0.22);
      const c = { x: (a.x + b.x) / 2 - dy / len * off, y: (a.y + b.y) / 2 + dx / len * off };
      const bez = t => { const u = 1 - t;
        return [u*u*a.x + 2*u*t*c.x + t*t*b.x, u*u*a.y + 2*u*t*c.y + t*t*b.y]; };

      /* Both ends start at a card's centre, where the card itself covers them.
         Walk in from each end to where the curve clears the card, and draw
         only the span between — so a line runs edge to edge, not centre to
         centre, and the whole of it is visible. */
      const sb = linkBox(L.src), tb = linkBox(target);
      const N = 48;
      let t0 = 0, t1 = 1;
      for (let k = 1; k <= N; k++) {
        const t = k / N;
        if (!inBox(sb, bez(t))) { t0 = edgeT(bez, sb, (k - 1) / N, t); break; }
      }
      for (let k = N - 1; k >= 0; k--) {
        const t = k / N;
        if (!inBox(tb, bez(t))) { t1 = edgeT(bez, tb, (k + 1) / N, t); break; }
      }
      if (!(t1 > t0)) { t0 = 0.46; t1 = 0.54; }   // cards overlap: leave a stub

      const pts = [];
      for (let s = 0; s <= 24; s++) {
        const p = bez(t0 + (t1 - t0) * (s / 24));
        pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
      }
      const d = pts.join(' ');
      const col = BY_ID[L.src].color;
      svg += `<g class="link" data-k="${L.key}" style="--lc:${col}">
          <polyline class="lbase" points="${d}"/>
          <polyline class="lglow" points="${d}" pathLength="100" stroke-dasharray="0 200"/>
          <polyline class="lfill" points="${d}" pathLength="100" stroke-dasharray="0 200"/>
        </g>`;
      L._pts = pts.map(s => s.split(',').map(Number));
      labels += `<div class="llabel" data-k="${L.key}" style="--lc:${col}"></div>`;
    });
  });
  el.arc.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.arc.innerHTML = svg;
  el.labels.innerHTML = labels;

  LINKS.forEach(L => {
    const g = el.arc.querySelector(`.link[data-k="${L.key}"]`);
    linkEls[L.key] = { g, fill: g && g.querySelector('.lfill'),
                       glow: g && g.querySelector('.lglow'),
                       label: el.labels.querySelector(`.llabel[data-k="${L.key}"]`) };
  });
  placeLabels();
}

/* Slide each readout along its own curve to a spot that clears the tiles.
   Measured in world units via offset*, so the camera never skews it. */
function placeLabels() {
  const boxes = ORES.filter(d => revealed.has(d.id) && !d.hosted).map(d => {
    const n = bars[d.id].root;
    const w = n.offsetWidth, h = n.offsetHeight;
    return { l: n.offsetLeft - w / 2 - 6, r: n.offsetLeft + w / 2 + 6,
             t: n.offsetTop  - h / 2 - 6, b: n.offsetTop  + h / 2 + 6 };
  });
  const clear = (p) => !boxes.some(x => p[0] > x.l && p[0] < x.r && p[1] > x.t && p[1] < x.b);
  const order = [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.2, 0.8];
  LINKS.forEach(L => {
    const e = linkEls[L.key];
    if (!e || !e.label || !L._pts || !revealed.has(L.ore)) return;
    const at = t => L._pts[Math.min(L._pts.length - 1, Math.round(t * (L._pts.length - 1)))];
    const p = (order.map(at).find(clear)) || at(0.5);
    e.label.style.left = p[0].toFixed(1) + 'px';
    e.label.style.top  = p[1].toFixed(1) + 'px';
  });
}

function paintLinks() {
  LINKS.forEach(L => {
    const e = linkEls[L.key];
    if (!e || !e.fill || !revealed.has(L.ore)) return;
    const srcOpen = S.ores[L.src].unlocked;
    // a supply line is never "done" — it reports a live flow
    const done = !L.feed && S.ores[L.ore].unlocked;
    const nextBucket = L.bucket && S.ores.buckets.buckets.length < BUCKET_MAX;
    const p = L.heat   ? heatOf() / heatMax()
            : L.flow   ? Math.min(1, flowNow() / FLOW_MAX)
            : L.bucket ? (nextBucket ? Math.min(1, heldOf('bars') / bucketCost()) : 1)
            : L.seeds  ? Math.min(1, seedsHeld())
            : L.water  ? Math.min(1, fullBuckets())
            : L.gear   ? GEAR_SLOTS.filter(k => S.gear[k].eq).length / GEAR_SLOTS.length
            : done     ? 1
            :            Math.min(1, heldOf(L.src) / L.need);
    // a heat or flow line runs at any level; the others only once affordable
    const lit = (L.heat || L.flow || L.gear) ? p > 0 : p >= 1;

    const dash = (p * 100).toFixed(2) + ' 200';
    if (e.fill.getAttribute('stroke-dasharray') !== dash) {
      e.fill.setAttribute('stroke-dasharray', dash);
      if (e.glow) e.glow.setAttribute('stroke-dasharray', dash);
    }
    let cls = 'link' + (L.feed ? ' feed' : '');
    cls += done ? ' done' : (!srcOpen ? ' dormant' : (lit ? ' lit' : ''));
    if (e.g.getAttribute('class') !== cls) e.g.setAttribute('class', cls);

    if (!e.label) return;
    let txt = '', lc = 'llabel';
    if (done || !srcOpen) lc += ' gone';
    else if (L.heat) txt = !lit ? 'NO HEAT' : L.hot ? `${Math.round(heatOf())}° / ${L.hot}°` : `${Math.round(heatOf())}°`;
    else if (L.flow) txt = lit ? `${fmt(flowNow())}/s` : 'NO FLOW';
    else if (L.bucket) txt = nextBucket ? `${fmt(heldOf('bars'))}/${bucketCost()} ${resWord('bars')}` : 'ALL FORGED';
    else if (L.seeds) txt = `${seedsHeld()} SEEDS`;
    else if (L.water) txt = `${fullBuckets()} FULL`;
    else if (L.gear) txt = `${GEAR_SLOTS.filter(k => S.gear[k].eq).length}/${GEAR_SLOTS.length} WORN`;
    else if (L.feed) txt = (p >= 1 ? 'FUEL ' : `${fmt(heldOf(L.src))}/`) +
                           `${fmt(L.need)} ${resWord(L.src)}`;
    else txt = `${fmt(heldOf(L.src))}/${fmt(L.need)} ${resWord(L.src)}`;
    if (e.label.textContent !== txt) e.label.textContent = txt;
    if (e.label.className !== lc) e.label.className = lc;
  });
}

function buildEmbers() {
  let html = '';
  for (let i = 0; i < 26; i++) {
    const size = 2 + Math.random() * 4, dur = 9 + Math.random() * 12;
    html += `<div class="ember" style="

}

/* Show or hide whole tiles and their supply lines. Reveal only ever changes on
   an unlock, so this runs on commit rather than every frame. */
const revealed = new Set();

function syncTiles(animate) {
  ORES.forEach(d => {
    const on = isRevealed(d.id), was = revealed.has(d.id);
    // a hosted tile's card is its host's; only the reveal set is its own
    if (d.hosted) { if (on) revealed.add(d.id); else revealed.delete(d.id); return; }
    bars[d.id].root.style.display = on ? '' : 'none';
    if (on) { revealed.add(d.id); if (!was && animate) replay(bars[d.id].root, 'appear'); }
    else revealed.delete(d.id);
  });
  fitRings();               // a tile just shown can finally be measured
}

function syncLinks() {
  LINKS.forEach(L => {
    const e = linkEls[L.key];
    if (!e) return;
    const on = revealed.has(L.ore);
    if (e.g) e.g.style.display = on ? '' : 'none';
    if (e.label) e.label.style.display = on ? '' : 'none';
  });
}

function syncReveal(animate) { syncTiles(animate); syncLinks(); }

/* Tiles must be shown before the lines are cut, because each line is trimmed
   to the measured edges of the cards it runs between. */
// Keep the authored map order, but reserve the actual height of every card.
// Controls and wrapped text can grow without colliding with the next card.
const ASTRA_MAP_HEIGHT = WORLD.h;
const ASTRA_CARD_GAP = 48;
function spaceAstraCards(cards, gap = ASTRA_CARD_GAP) {
  const placed = [];
  for (const card of [...cards].sort((a, b) => a.y - b.y || a.x - b.x)) {
    let y = Math.max(card.y, card.height / 2 + gap);
    for (const previous of placed) {
      if (Math.abs(card.x - previous.x) < (card.width + previous.width) / 2 + gap) {
        y = Math.max(y, previous.y + previous.height / 2 + gap + card.height / 2);
      }
    }
    placed.push({ ...card, y });
  }
  return placed;
}
function layoutAstraCards() {
  const cards = ORES.filter(d => !d.hosted && revealed.has(d.id)).map(d => {
    const node = bars[d.id].root, pos = POS_OF_ORE[d.id];
    return { id:d.id, x:pos.x / 100 * WORLD.w, y:pos.y / 100 * ASTRA_MAP_HEIGHT,
             width:node.offsetWidth || 320, height:node.offsetHeight || 130 };
  });
  const placed = spaceAstraCards(cards);
  for (const card of placed) {
    const node = bars[card.id].root;
    node.style.left = card.x + 'px'; node.style.top = card.y + 'px';
  }
  WORLD.h = Math.max(ASTRA_MAP_HEIGHT, ...placed.map(c => c.y + c.height / 2 + ASTRA_CARD_GAP));
  el.world.style.height = WORLD.h + 'px';
}
function rebuildBoard(animate) {
  renderStrips();
  syncTiles(animate);
  layoutAstraCards();
  buildLinks();
  syncLinks();
  placeLabels();
}

/* Fast-forwarding runs thousands of cycles in one go. Every one of them would
   otherwise spawn a floating number and restart an animation, so the feedback
   is muted while the sim is being driven rather than played. */
let fxOff = false;

function replay(node, cls) {
  if (fxOff) return;
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

function punch(id) {
  const b = bars[id];
  if (!b) return;
  replay(b.root, 'pop');
  replay(b.cur, 'tick');
}

function floatText(id, txt, color) {
  const b = bars[id];
  if (!b || fxOff) return;
  const n = document.createElement('div');
  n.className = 'float';
  n.textContent = txt;
  n.style.color = color;
  n.style.left = b.pos.x + '%';
  n.style.top = (b.pos.y - 6) + '%';
  el.world.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

/* ---- the bench's moulds ----
   Each mould is its own button. They are rebuilt only when the row changes
   length, which happens exactly once per More Moulds level; everything else is
   diffed in place, the same as the rest of the board. */

function buildMoulds(id, n) {
  const b = bars[id];
  b.mouldsEl.innerHTML = '';
  b.mouldEls = [];
  for (let i = 0; i < n; i++) {
    const m = document.createElement('button');
    m.className = 'mould empty';
    m.innerHTML = `<span class="mcool"><span class="mhot"></span></span><span class="msym"></span><span class="mprog"></span>`;
    /* A mould is a DIRECT action: it never moves the worker, so the click must
       not reach the tile body underneath it. */
    m.addEventListener('click', ev => {
      ev.stopPropagation();
      const st = S.ores[id].moulds[i];
      if (!st) return;
      if (BY_ID[id].farming) { if (!pressPlot(id, i)) sfx('no'); return; }
      if (st.s === 'ready') harvestMould(id, i);
      else if (st.s === 'empty') fillMould(id, i);
    });
    b.mouldsEl.appendChild(m);
    b.mouldEls.push({ node: m, cool: m.querySelector('.mcool'),
                      hot: m.querySelector('.mhot'), sym: m.querySelector('.msym'),
                      prog: m.querySelector('.mprog') });
  }
}

/* the field plots: each shows the step it is waiting for, greyed when the
   seed or bucket that step needs is missing */
function paintField(d, o, b) {
  const list = syncMoulds(d.id);
  if (b.mouldEls.length !== list.length) buildMoulds(d.id, list.length);
  const kind = o.seedKind, seeds = seedsHeld(kind), water = fullBuckets(), cap = capOf(d.id);
  list.forEach((m, i) => {
    const e = b.mouldEls[i];
    if (!e) return;
    const C = CROPS[m.kind || 'grain'];
    let cls = 'mould plot ' + m.s, sym = '', tip = '', w = 0;
    if (m.s === 'empty')        { sym = 'PLOW';  tip = 'Bare — click to plow it'; }
    else if (m.s === 'plowing') { const k = Math.max(0, Math.min(1, 1 - m.t / PLOW_TIME)); w = k * 100;
                                  sym = Math.ceil(m.t) + 's'; tip = `Plowing — ${m.t.toFixed(1)}s left`; }
    else if (m.s === 'plowed')  { sym = 'SEED';  if (seeds < 1) cls += ' no';
                                  tip = seeds < 1 ? `Plowed — needs a ${CROPS[kind].name.toLowerCase()} seed from the battle` : `Plowed — click to plant ${CROPS[kind].name.toLowerCase()}`; }
    else if (m.s === 'planted') { sym = C.sym + ' · WATER'; if (water < 1) cls += ' no';
                                  tip = water < 1 ? `${C.name} planted — needs a full bucket` : `${C.name} planted — click to water it with a bucket`; }
    else if (m.s === 'cool')    { const k = Math.max(0, Math.min(1, 1 - m.t / C.grow)); w = k * 100;
                                  sym = C.sym + ' ' + Math.ceil(m.t) + 's'; tip = `${C.name} growing — ${m.t.toFixed(1)}s left`; }
    else                        { const full = o.crops[m.kind || 'grain'] >= cap;
                                  sym = full ? 'FULL' : 'REAP ' + C.sym; if (full) cls += ' no';
                                  tip = full ? `${C.name} ripe — no room, expand storage` : `${C.name} ripe — click to reap ${fmt(yieldOf(d.id))}`; }
    if (e.node.className !== cls) e.node.className = cls;
    const wpx = w.toFixed(1) + '%';
    if (e.cool.style.width !== wpx) e.cool.style.width = wpx;
    if (e.sym.textContent !== sym) e.sym.textContent = sym;
    if (e.node.title !== tip) e.node.title = tip;
  });
}

function paintMoulds(d, o, b) {
  if (d.farming) { paintField(d, o, b); return; }
  const list = syncMoulds(d.id);
  if (b.mouldEls.length !== list.length) buildMoulds(d.id, list.length);
  const cost = plotCost(d.id), W = plotWords(d.id);
  const poor = !!cost && !canPay(cost);
  const full = isFull(d.id);
  const frozen = d.steeling && !steelHot();
  // how far the stock has come toward one pour: the rails on every empty mould
  const prog = cost ? costProgress(cost) : 1;
  const progPct = (prog * 100).toFixed(1) + '%';
  list.forEach((m, i) => {
    const e = b.mouldEls[i];
    if (!e) return;
    let cls = 'mould ' + m.s + (d.farming ? ' crop' : d.charring ? ' char' : d.steeling ? ' steel' : ''), sym = '', tip = '';
    let w = 0, hot = 0;
    const railPct = m.s === 'empty' ? progPct : '0%';
    if (e.prog && e.prog.style.getPropertyValue('--p') !== railPct) e.prog.style.setProperty('--p', railPct);
    if (m.s === 'empty') {
      if (poor) cls += ' no'; else cls += ' can';
      sym = W.start;
      tip = poor ? `Empty — needs ${costWords(cost)}`
                 : `Empty — click to ${W.startVerb}`;
    } else if (m.s === 'cool') {
      // the bar drains as it sets, and the heat fades out of it with it
      const k = Math.max(0, Math.min(1, m.t / plotTime(d.id)));
      w = k * 100; hot = k;
      sym = frozen ? 'COLD' : Math.ceil(m.t) + 's';
      if (frozen) cls += ' frozen';
      tip = frozen ? `Waiting — the furnace must reach ${STEEL_HEAT}° for it to set (${m.t.toFixed(1)}s of setting left)`
                   : `${W.busy[0].toUpperCase() + W.busy.slice(1)} — ${m.t.toFixed(1)}s left`;
    } else {
      if (full) cls += ' no';
      sym = full ? 'FULL' : (d.farming ? 'REAP' : 'OUT');
      tip = full ? `${W.done} — no room, expand storage`
                 : `${W.done} — click to ${W.take} ${fmt(yieldOf(d.id))} ${d.unit}`;
    }
    if (e.node.className !== cls) e.node.className = cls;
    const wpx = w.toFixed(1) + '%';
    if (e.cool.style.width !== wpx) e.cool.style.width = wpx;
    const op = hot.toFixed(2);
    if (e.hot.style.opacity !== op) e.hot.style.opacity = op;
    if (e.sym.textContent !== sym) e.sym.textContent = sym;
    if (e.node.title !== tip) e.node.title = tip;
  });
}

/* the bench's own status line, in place of a work cycle */
function benchStatus(d, o) {
  const list = o.moulds;
  const ready = list.some(m => m.s === 'ready');
  if (!d.farming && isFull(d.id)) return ['FULL · EXPAND STORAGE', 'tstatus'];
  if (d.farming) {
    if (ready) return ['RIPE · REAP IT', 'tstatus go'];
    const growing = list.filter(m => m.s === 'cool' || m.s === 'plowing');
    const need = list.find(m => m.s === 'planted') ? 'water' : list.find(m => m.s === 'plowed') ? 'seed' : null;
    if (need === 'water' && fullBuckets() < 1) return growing.length
      ? [`GROWING · ${Math.min(...growing.map(m => m.t)).toFixed(1)}S`, 'tstatus'] : ['NEEDS A FULL BUCKET', 'tstatus cold'];
    if (need === 'seed' && seedsHeld(o.seedKind) < 1) return growing.length
      ? [`GROWING · ${Math.min(...growing.map(m => m.t)).toFixed(1)}S`, 'tstatus'] : [`NO ${CROPS[o.seedKind].name.toUpperCase()} SEED · PICK ANOTHER OR FIGHT`, 'tstatus cold'];
    if (need) return [need === 'water' ? 'CLICK · WATER IT' : 'CLICK · PLANT A SEED', 'tstatus go'];
    if (growing.length) {
      const busy = growing.every(m => m.s === 'plowing') ? 'PLOWING' : 'GROWING';
      return [`${busy} · ${Math.min(...growing.map(m => m.t)).toFixed(1)}S`, 'tstatus'];
    }
    return ['CLICK A PLOT · PLOW IT', 'tstatus go'];
  }
  if (ready) return [d.farming ? 'RIPE · REAP IT' : 'SET · TAKE IT OUT', 'tstatus go'];
  const cooling = list.filter(m => m.s === 'cool');
  const empty = list.some(m => m.s === 'empty');
  const cost = plotCost(d.id), W = plotWords(d.id);
  const busy = W.busy.toUpperCase();
  if (d.steeling && cooling.length && !steelHot())
    return [`FURNACE TOO COOL · NEEDS ${STEEL_HEAT}°`, 'tstatus cold'];
  const waiting = () => [`${busy} · ${Math.min(...cooling.map(m => m.t)).toFixed(1)}S`, 'tstatus'];
  const poor = !!cost && !canPay(cost);
  if (empty && poor) {
    return cooling.length ? waiting() : [`NEEDS ${costSyms(cost).toUpperCase()}`, 'tstatus cold'];
  }
  if (empty) return [`CLICK A ${W.unit.toUpperCase()}` + (cost ? ` · ${costSyms(cost).toUpperCase()}` : ''), 'tstatus go'];
  return waiting();
}

/* ---- per-frame paint ---- */

function lockLines(d) {
  const need = Object.keys(d.unlock)
    .map(k => `<b>${fmt(d.unlock[k])}</b> ${resName(k).toLowerCase()}`).join(' + ');
  const head = unlockProgress(d.id) >= 1
    ? (d.facility ? 'READY TO BUILD' : 'READY TO OPEN')
    : 'LOCKED';
  return head + '<br>' + need;
}

function paintLocked(d, b) {
  b.amtRow.style.display = 'none';
  b.amt2.style.display = 'none';
  b.trackEl.style.display = 'none';
  b.mrow.style.display = 'none';
  b.seedsel.style.display = 'none';
  b.wrow.style.display = 'none';
  b.ocean.style.display = 'none';
  b.grows.style.display = 'none';
  b.gsum.style.display = 'none';
  b.brow.style.display = 'none';
  b.benchbox.style.display = 'none';
  b.cycbar.style.display = 'none';
  b.lock.style.display = '';
  const html = lockLines(d);
  if (b.lock.innerHTML !== html) b.lock.innerHTML = html;
  if (b.tags.innerHTML !== '') b.tags.innerHTML = '';
}

function furnaceActionState() {
  const o = S.ores.furnace;
  if (!o.unlocked) return { state:'locked', enabled:false, label:'Build the furnace first', detail:'Needs 5 stone.', progress:0 };
  if (o.burnLeft > 0) return { state:'burning', enabled:false, label:'Burning · ' + o.burnLeft.toFixed(1) + 's left', detail:'Adding heat now. The next burn becomes available after cooldown.', progress:1 - o.burnLeft / FURNACE_BURN_TIME };
  if (o.burnCooldown > 0) return { state:'cooldown', enabled:false, label:o.burnCooldown.toFixed(1) + 's', detail:'The furnace still smelts while this timer runs.', progress:1 - o.burnCooldown / Math.max(0.001, o.burnCooldownMax || stokeCooldown()) };
  if (o.heat >= heatMax()) return { state:'full', enabled:false, label:'Heat full', detail:'Burn again when there is room for more heat.', progress:1 };
  if (S.ores.wood.amount < FURNACE_STOKE_COST) return { state:'short', enabled:false, label:'Burn ' + FURNACE_STOKE_COST + ' wood', detail:fmt(S.ores.wood.amount) + ' / ' + FURNACE_STOKE_COST + ' wood available · chop some more.', progress:1 };
  const gain = Math.min(FURNACE_HEAT_GAIN, heatMax() - o.heat);
  return { state:'ready', enabled:true, label:'Burn ' + FURNACE_STOKE_COST + ' wood', detail:'READY NOW · adds up to ' + fmt(gain) + '° over ' + FURNACE_BURN_TIME + 's. Click to light it.', progress:1 };
}
function paintFurnace(d, o, b) {
  let cls = 'ore facility';
  if (!o.unlocked) {
    cls += ' locked';
    if (unlockProgress(d.id) >= 1) cls += ' ready';
  } else if (o.heat > 0) cls += ' hot';
  if (o.unlocked && hasHeat()) cls += ' smelting';
  if (b.root.classList.contains('hit')) cls += ' hit';
  if (b.root.classList.contains('appear')) cls += ' appear';
  if (b.root.className !== cls) b.root.className = cls;

  if (!o.unlocked) { paintLocked(d, b); return; }

  b.amtRow.style.display = '';
  b.amt2.style.display = 'none';
  b.trackEl.style.display = '';
  b.mrow.style.display = 'none';
  b.wrow.style.display = 'none';
  b.ocean.style.display = 'none';
  b.grows.style.display = 'none';
  b.gsum.style.display = 'none';
  b.benchbox.style.display = 'none';
  b.brow.style.display = 'none';
  b.cycbar.style.display = '';
  b.lock.style.display = 'none';

  b.fill.style.width = (o.heat / heatMax() * 100) + '%';
  // the line the iron waits for: the furnace pours nothing below it
  if (b.floor.style.display !== '') b.floor.style.display = '';
  const fl = (SMELT_MIN_HEAT / heatMax() * 100).toFixed(2) + '%';
  if (b.floor.style.left !== fl) b.floor.style.left = fl;
  const heatTxt = fmt(o.heat);
  if (b.cur.textContent !== heatTxt) b.cur.textContent = heatTxt;
  const capTxt = `/ ${heatMax()}°`;
  if (b.capv.textContent !== capTxt) b.capv.textContent = capTxt;

  const rateTxt = (heatNetNow >= 0 ? '+' : '') + heatNetNow.toFixed(1) + '°/s';
  if (b.rate.textContent !== rateTxt) b.rate.textContent = rateTxt;
  const rateCls = 'rate' + (heatNetNow < 0 ? ' neg' : '');
  if (b.rate.className !== rateCls) b.rate.className = rateCls;

  const action = furnaceActionState();
  b.root.classList.toggle('burn-ready', action.enabled);
  if (b.burnControl) {
    const c = b.burnControl;
    c.control.className = 'burn-control ' + action.state;
    c.burn.disabled = !action.enabled;
    c.burn.textContent = action.label;
    c.burn.title = action.detail;
    c.fill.style.width = Math.max(0, Math.min(100, action.progress * 100)) + '%';
  }
  const stoker = o.lvl.stoker > 0;
  const fed = S.ores.wood.amount >= FURNACE_STOKE_COST;
  let st = '', stCls = 'tstatus';
  if (o.burnLeft > 0)             st = `BURNING · ${o.burnLeft.toFixed(1)}S`;
  else if (o.burnCooldown > 0)    st = `COOLING · ${o.burnCooldown.toFixed(1)}S`;
  else if (o.heat >= heatMax()) st = 'AT FULL HEAT';
  else if (!fed)   st = '';
  else { st = 'HEAT · READY TO BURN'; stCls += ' go'; }
  if (b.status.textContent !== st) b.status.textContent = st;
  if (b.status.className !== stCls) b.status.className = stCls;

  // the burn fills the rail left to right as heat goes in; the cooldown then
  // runs the other way, draining back off from the right until it is ready
  let cycP = 0, burning = o.burnLeft > 0, cooling = !burning && o.burnCooldown > 0;
  if (burning) cycP = 1 - o.burnLeft / FURNACE_BURN_TIME;
  else if (cooling) cycP = o.burnCooldown / Math.max(0.001, o.burnCooldownMax || stokeCooldown());
  b.cyc.style.width = Math.max(0, Math.min(100, cycP * 100)) + '%';
  const cycCls = 'cyc' + (burning || cooling ? ' on' : '') +
                 (burning ? ' burn' : cooling ? ' cool' : '');
  if (b.cyc.className !== cycCls) b.cyc.className = cycCls;

  SFX.loopSet('fire', o.burnLeft > 0);

  // the STOKER n tag below already says whether one is fitted
  let tag = o.heat > 0
    ? '<span class="tag on">LIT</span>'
    : '<span class="tag cold">COLD</span>';
  // always shown, so the + beside it has a label
  tag += `<span class="tag${stoker ? ' on' : ''}">STOKER ${o.lvl.stoker}</span>`;
  if (o.lvl.lining > 0) tag += `<span class="tag on">BRICK ${o.lvl.lining}</span>`;
  if (stoker && S.ores.wood.amount < stokerWood(o.lvl.stoker)) tag += '<span class="tag cold">NO WOOD</span>';
  if (b.tags.innerHTML !== tag) b.tags.innerHTML = tag;
}

/* ---- the buckets: a row of them, filling from the flow ---- */

function buildBuckets(id, n) {
  const b = bars[id];
  b.mouldsEl.innerHTML = '';
  b.mouldEls = [];
  for (let i = 0; i < n; i++) {
    const m = document.createElement('button');
    m.className = 'mould bucket';
    m.innerHTML = `<span class="mcool"><span class="mhot"></span></span><span class="msym"></span><span class="mprog"></span>`;
    m.addEventListener('click', ev => ev.stopPropagation());
    b.mouldsEl.appendChild(m);
    b.mouldEls.push({ node: m, cool: m.querySelector('.mcool'),
                      hot: m.querySelector('.mhot'), sym: m.querySelector('.msym'),
                      prog: m.querySelector('.mprog') });
  }
}

function paintBuckets(d, o, b) {
  let cls = 'ore passive';
  if (!o.unlocked) {
    cls += ' locked';
    if (unlockProgress(d.id) >= 1) cls += ' ready';
  }
  if (o.running) cls += ' run';
  if (o.unlocked && o.buckets.length && o.buckets.every(q => q.f >= BUCKET_SIZE)) cls += ' full';
  if (b.root.classList.contains('pop')) cls += ' pop';
  if (b.root.classList.contains('hit')) cls += ' hit';
  if (b.root.classList.contains('appear')) cls += ' appear';
  if (b.root.className !== cls) b.root.className = cls;
  if (!o.unlocked) { paintLocked(d, b); return; }

  b.amtRow.style.display = '';
  b.amt2.style.display = 'none';
  b.trackEl.style.display = '';
  b.mrow.style.display = '';
  b.wrow.style.display = 'none';
  b.ocean.style.display = 'none';
  b.grows.style.display = 'none';
  b.gsum.style.display = 'none';
  b.benchbox.style.display = 'none';
  b.brow.style.display = 'none';
  b.cycbar.style.display = 'none';
  b.lock.style.display = 'none';

  const list = o.buckets;
  if (b.mouldEls.length !== list.length) buildBuckets(d.id, list.length);
  const rate = bucketFillRate();
  const full = list.filter(q => q.f >= BUCKET_SIZE).length;
  list.forEach((q, i) => {
    const e = b.mouldEls[i];
    if (!e) return;
    const isFullB = q.f >= BUCKET_SIZE;
    const c = 'mould bucket' + (isFullB ? ' full' : (rate > 0 ? '' : ' still'));
    if (e.node.className !== c) e.node.className = c;
    const wpx = (q.f / BUCKET_SIZE * 100).toFixed(1) + '%';
    if (e.cool.style.width !== wpx) e.cool.style.width = wpx;
    const sym = isFullB ? 'FULL' : Math.floor(q.f / BUCKET_SIZE * 100) + '%';
    if (e.sym.textContent !== sym) e.sym.textContent = sym;
    const tip = isFullB ? 'Full — it keeps its water for whatever needs it next'
              : rate > 0 ? `Filling — ${((BUCKET_SIZE - q.f) / rate).toFixed(1)}s to go at this flow`
              : 'Empty — needs water flowing';
    if (e.node.title !== tip) e.node.title = tip;
  });

  // the big bar is the average fill of the row
  const mean = list.length ? list.reduce((a, q) => a + q.f, 0) / (list.length * BUCKET_SIZE) : 0;
  b.fill.style.width = (mean * 100) + '%';
  const curTxt = String(full);
  if (b.cur.textContent !== curTxt) b.cur.textContent = curTxt;
  const capTxt = `/ ${list.length} full`;
  if (b.capv.textContent !== capTxt) b.capv.textContent = capTxt;
  const rateTxt = rate > 0 ? `+${fmt(rate)}/s each` : (list.length ? '· no flow ·' : '');
  if (b.rate.textContent !== rateTxt) b.rate.textContent = rateTxt;
  const rc = 'rate' + (rate > 0 ? '' : ' neg');
  if (b.rate.className !== rc) b.rate.className = rc;

  let st = '', stCls = 'tstatus';
  const wOpen = S.ores.water.unlocked;
  if (!list.length) { st = `FORGE A BUCKET · ${bucketCost()} BARS`; stCls += ' go'; }
  else if (full === list.length) st = 'ALL FULL · WAITING FOR A USE';
  else if (!wOpen) st = 'NO WATER YET';
  else if (rate <= 0) { st = 'NO FLOW · WORK THE WATER'; stCls += ' cold'; }
  else st = `FILLING · ${((BUCKET_SIZE - Math.min(...list.filter(q => q.f < BUCKET_SIZE).map(q => q.f))) / rate).toFixed(1)}S`;
  if (b.status.textContent !== st) b.status.textContent = st;
  if (b.status.className !== stCls) b.status.className = stCls;

  let tags = '';
  tags += rate > 0 ? `<span class="tag on">FLOW ${fmt(flowNow())}/s</span>` : '<span class="tag cold">NO FLOW</span>';
  if (b.tags.innerHTML !== tags) b.tags.innerHTML = tags;
}

/* ---- the water card ---- */

function paintWater(d, o, b) {
  const raw = rawFlow(), floor = riverFloor(), eff = flowNow();
  let cls = 'ore water passive';
  if (!o.unlocked) {
    cls += ' locked';
    if (unlockProgress(d.id) >= 1) cls += ' ready';
  }
  if (o.running) cls += ' run';
  if (o.holding) cls += ' hot';
  if (b.root.classList.contains('pop')) cls += ' pop';
  if (b.root.classList.contains('hit')) cls += ' hit';
  if (b.root.classList.contains('appear')) cls += ' appear';
  if (b.root.className !== cls) b.root.className = cls;
  if (!o.unlocked) { paintLocked(d, b); return; }

  b.amtRow.style.display = '';
  b.amt2.style.display = 'none';
  b.trackEl.style.display = '';
  b.mrow.style.display = 'none';
  b.wrow.style.display = '';
  b.ocean.style.display = '';
  b.grows.style.display = 'none';
  b.gsum.style.display = 'none';
  b.benchbox.style.display = 'none';
  b.brow.style.display = 'none';
  b.cycbar.style.display = 'none';
  b.lock.style.display = 'none';

  // the flow bar, with the river's floor marked on it
  b.fill.style.width = Math.min(100, eff / FLOW_MAX * 100) + '%';
  b.floor.style.display = floor > 0 ? '' : 'none';
  const fl = Math.min(100, floor / FLOW_MAX * 100).toFixed(1) + '%';
  if (b.floor.style.left !== fl) b.floor.style.left = fl;

  const curTxt = fmt(eff);
  if (b.cur.textContent !== curTxt) b.cur.textContent = curTxt;
  const capTxt = `/ ${FLOW_MAX}`;
  if (b.capv.textContent !== capTxt) b.capv.textContent = capTxt;
  const rateTxt = floor > 0 ? `floor ${fmt(floor)}/s` : 'no river yet';
  if (b.rate.textContent !== rateTxt) b.rate.textContent = rateTxt;
  const rc = 'rate' + (floor > 0 ? '' : ' neg');
  if (b.rate.className !== rc) b.rate.className = rc;

  let st = '', stCls = 'tstatus';
  if (o.holding === 'sun' && o.ocean > 0)   { st = 'EVAPORATING · OCEAN → CLOUD'; stCls += ' go'; }
  else if (o.holding === 'cloud' && o.cloud > 0) { st = 'RAINING · CLOUD → OCEAN'; stCls += ' go'; }
  else if (o.holding === 'sun')   { st = 'OCEAN DRY · HOLD THE CLOUD'; stCls += ' cold'; }
  else if (o.holding === 'cloud') { st = 'CLOUD EMPTY · HOLD THE SUN'; stCls += ' cold'; }
  else if (raw > 0) st = `FLOW ${fmt(raw)}/S · FADING`;
  else if (floor > 0) st = `RIVER · ${fmt(floor)}/S`;
  else { st = 'HOLD THE SUN OR THE CLOUD'; stCls += ' go'; }
  if (b.status.textContent !== st) b.status.textContent = st;
  if (b.status.className !== stCls) b.status.className = stCls;

  // the two holds: the sun shows the ocean it has left to lift, the cloud what it holds
  const sunC = 'wbtn sun' + (o.holding === 'sun' ? ' held' : '') + (o.ocean <= 0 ? ' dry' : '');
  if (b.sun.className !== sunC) b.sun.className = sunC;
  const cloudC = 'wbtn cloud' + (o.holding === 'cloud' ? ' held' : '') + (o.cloud <= 0 ? ' dry' : '');
  if (b.cloud.className !== cloudC) b.cloud.className = cloudC;
  const sh = (o.ocean / WATER_TOTAL * 100).toFixed(1) + '%';
  if (b.sunFill.style.height !== sh) b.sunFill.style.height = sh;
  const ch = (o.cloud / WATER_TOTAL * 100).toFixed(1) + '%';
  if (b.cloudFill.style.height !== ch) b.cloudFill.style.height = ch;
  const sl = o.holding === 'sun' ? 'LIFTING' : 'HOLD · EVAPORATE';
  if (b.sunLab.textContent !== sl) b.sunLab.textContent = sl;
  const cl = o.holding === 'cloud' ? 'RAINING' : `HOLD · RAIN ${Math.round(o.cloud)}%`;
  if (b.cloudLab.textContent !== cl) b.cloudLab.textContent = cl;
  const ow = (o.ocean / WATER_TOTAL * 100).toFixed(1) + '%';
  if (b.oceanFill.style.width !== ow) b.oceanFill.style.width = ow;
  const ol = `OCEAN ${Math.round(o.ocean)}%`;

/* ---- the rack ---- */

function chipHtml(item, kind, pos, slot) {
  const posAttr = pos !== undefined ? ` data-pos="${pos}"` : '';
  if (!item && slot && isReserved(slot, pos)) {
    const j = forgeJob(), M = GEAR_MATS[j.mat];
    return `<button class="gchip forging ${kind}${j.mat === 'steel' ? ' steel' : ' iron'}"${posAttr}>` +
           `<span class="gname">${M.name.toUpperCase()} ${GEAR_NAME[slot].toUpperCase()}</span><span class="gstat ftime"></span></button>`;
  }
  if (!item) return `<button class="gchip none ${kind}"${posAttr}>—</button>`;
  const st = gearStats(item), M = GEAR_MATS[item.mat || 'iron'];
  const extras = Object.keys(item.extra).map(k => `+${k.toUpperCase()} ${item.extra[k]}`).join(' · ');
  const worn = S.gear[item.slot].eq;
  const wornStats = worn ? gearStats(worn) : {};
  const comparison = kind === 'bak' ? ['atk', 'def', 'hp', 'spd'].map(k => {
    const delta = (st[k] || 0) - (wornStats[k] || 0);
    return delta ? k.toUpperCase() + ' ' + (delta > 0 ? '+' : '') + delta : '';
  }).filter(Boolean).join(' · ') || 'same stats' : '';
  const tip = `${GEAR_TIER[item.tier]} ${gearName(item)} — ${statLine(st)}` + (extras ? ` (${extras})` : '') +
              (kind === 'bak' ? ' · vs equipped: ' + comparison + ' · click to wear it' : kind === 'onbench' ? ' · enhancement preview' : ' · worn');
  const onBench = kind === 'onbench';
  return `<button class="gchip t${item.tier} ${kind} ${item.mat === 'steel' ? 'steel' : 'iron'}"${onBench ? '' : ` data-uid="${item.uid}"`}${posAttr} title="${tip}">` +
         `<span class="gname">${M.name.toUpperCase()} ${GEAR_NAME[item.slot].toUpperCase()}</span>` +
         `<span class="gstat">${extraLine(item)}</span>` +
         (item.plus ? `<span class="gplus">+${item.plus}</span>` : '') + `</button>`;
}

function paintGear(d, o, b) {

    }
  });
  const h = heroStats(false);

function paintBattle(d, o, b) {
  const worked = o.auto, dead = o.cooldown > 0;

  if (worked && o.active && !dead) cls += ' worked';

  b.mrow.style.display = 'none';

  const capTxt = `/ best ${o.best}`;
  if (b.capv.textContent !== capTxt) b.capv.textContent = capTxt;
  const goldTxt = `${Math.floor(o.gold).toLocaleString()} gold`;
  if (b.rate.textContent !== goldTxt) b.rate.textContent = goldTxt;
  if (b.rate.className !== 'rate gold') b.rate.className = 'rate gold';

  // the floor: counts per row, lit where there is something to pick up
  b.loot.querySelectorAll('.lootrow').forEach(row => {
    const n = floorOf(row.dataset.k);
    const ln = row.querySelector('.ln'), t = String(n), was = Number(ln.textContent) || 0;
    if (ln.textContent !== t) ln.textContent = t;
    // a row that has just gained something lands with a bounce
    if (n > was) replay(row, 'drop');
    const c = 'lootrow' + (n > 0 ? ' some' : ' none') + (row.classList.contains('drop') ? ' drop' : '');
    if (row.className !== c) row.className = c;
  });
  const all = b.loot.querySelector('.lootall'), ac = 'lootall' + (floorCount() > 0 ? ' some' : ' none');
  if (all.className !== ac) all.className = ac;


  // the hero: portrait redrawn only when the rack changes, health under it
  const gkey = GEAR_SLOTS.map(k => S.gear[k].eq ? S.gear[k].eq.uid : 0).join(',');
  if (b.hport._key !== gkey) { b.hport._key = gkey; b.hport.innerHTML = heroSvg(); }
  const hp = Math.max(0, Math.min(1, o.heroHp / hero.hp));
  b.hfill.style.width = (hp * 100) + '%';
  const resting = !o.active && !dead && o.heroHp < hero.hp - 1e-6;
  const hl = dead ? `FALLEN · ${Math.ceil(o.heroHp)} / ${hero.hp}` : `${Math.ceil(o.heroHp)} / ${hero.hp}`;
  if (b.hlab.textContent !== hl) b.hlab.textContent = hl;
  const hs = `ATK ${hero.atk} · DEF ${hero.def} · ${(1 / hero.every).toFixed(2)}/s`;
  if (b.hstat.textContent !== hs) b.hstat.textContent = hs;
  const hpc = 'port hport' + (dead ? ' dead' : '') + (b.hport.classList.contains('struck') ? ' struck' : '') + (b.hport.classList.contains('healed') ? ' healed' : '');
  // while the hero is down both fighters grey out under a skull
  const hf = b.hport.closest('.fighter'), ef = b.eport.closest('.fighter');
  const hfc = 'fighter hero' + (dead ? ' dead' : ''), efc = 'fighter enemy' + (dead ? ' dead' : '');
  if (hf.className !== hfc) hf.className = hfc;
  if (ef.className !== efc) ef.className = efc;
  if (b.hport.className !== hpc) b.hport.className = hpc;

  let st = '', stCls = 'bstat';
  if (dead) { st = `FALLEN · REST ${Math.ceil(o.cooldown)}S`; stCls += ' cold'; }
  else if (o.active) st = `WAVE ${o.wave}`;
  else if (resting) { st = `MENDING · ${Math.round(hp * 100)}%`; stCls += ' cold'; }
  else { st = 'CLICK TO FIGHT'; stCls += ' go'; }
  if (b.bstat.textContent !== st) b.bstat.textContent = st;
  if (b.bstat.className !== stCls) b.bstat.className = stCls;

  // the small rail is the rest running down
  b.cyc.style.width = (dead ? o.cooldown / BATTLE_COOLDOWN * 100 : 0) + '%';
  const cycCls = 'cyc' + (dead ? ' on cool' : '');
  if (b.cyc.className !== cycCls) b.cyc.className = cycCls;

  // the enemy: the one in front of you, or the first of the next run, dimmed
  const showWave = o.active ? o.wave : o.startAt;
  const e = enemyFor(showWave);
  if (b.eport._key !== showWave) { b.eport._key = showWave; b.eport.innerHTML = enemySvg(showWave); }
  const epc = 'port eport' + (o.active ? '' : ' idle') + (dead ? ' dead' : '') + (b.eport.classList.contains('struck') ? ' struck' : '');
  if (b.eport.className !== epc) b.eport.className = epc;
  const en = (o.active ? e.name : 'NEXT · ' + e.name).toUpperCase();
  if (b.ename.textContent !== en) b.ename.textContent = en;
  const es = `ATK ${e.atk} · DEF ${e.def}`;
  if (b.estat.textContent !== es) b.estat.textContent = es;
  const ew = o.active && o.enemyMax ? Math.max(0, o.enemyHp) / o.enemyMax * 100 : 100;
  b.efill.style.width = ew + '%';
  const el2 = o.active ? `${Math.ceil(Math.max(0, o.enemyHp))} / ${o.enemyMax}` : `${e.hp} / ${e.hp}`;
  if (b.elab.textContent !== el2) b.elab.textContent = el2;

  // the pack: what the hero may eat, how much there is, and the poultice's cooldown
  b.pack.querySelectorAll('.packbtn').forEach(btn => {
    const k = btn.dataset.k, n = S.ores.farm.crops[k];
    const c = 'packbtn' + (o.pack[k] ? ' on' : ' off') + (n < 1 ? ' none' : '') + (btn.classList.contains('used') ? ' used' : '');
    if (btn.className !== c) btn.className = c;
    let t = `${CROPS[k].name.toLowerCase()} ${fmt(n)}`;
    if (k === 'herb' && o.poulticeCd > 0) t += ` · ${Math.ceil(o.poulticeCd)}s`;
    if (!o.pack[k]) t += ' · off';
    const pn = btn.querySelector('.pn');
    if (pn.textContent !== t) pn.textContent = t;
  });

  let tags = '';
  if (dead) tags += `<span class="tag cold">FALLEN · ${Math.ceil(o.cooldown)}s</span>`;
  else if (o.active) tags += '<span class="tag work">FIGHTING</span>';
  else if (resting) tags += '<span class="tag cold">MENDING</span>';
  else tags += '<span class="tag">CLICK TO FIGHT</span>';
  if (floorCount() > 0) tags += '<span class="tag work">LOOT ON THE FLOOR</span>';
  if (o.buff && o.active && (o.buff.hp || o.buff.atk)) tags += '<span class="tag on">FED</span>';
  const nextDrop = DROPS.find(D => o.best < D.wave);
  if (nextDrop) tags += `<span class="tag">DROP AT ${nextDrop.wave}</span>`;
  if (b.tags.innerHTML !== tags) b.tags.innerHTML = tags;
}

/* ---- the bench card ---- */

function paintBench(d, o, b) {
  const j = o.job;
  let cls = 'ore bench passive';
  if (!o.unlocked) {
    cls += ' locked';
    if (unlockProgress(d.id) >= 1) cls += ' ready';
  } else if (j && !j.done) cls += ' run hot';
  if (b.root.classList.contains('pop')) cls += ' pop';
  if (b.root.classList.contains('hit')) cls += ' hit';
  if (b.root.classList.contains('appear')) cls += ' appear';
  if (b.root.className !== cls) b.root.className = cls;
  if (!o.unlocked) { paintLocked(d, b); return; }

  b.amtRow.style.display = '';
  b.amt2.style.display = 'none';
  b.trackEl.style.display = 'none';
  b.mrow.style.display = 'none';
  b.wrow.style.display = 'none';
  b.ocean.style.display = 'none';
  b.grows.style.display = 'none';
  b.gsum.style.display = 'none';
  b.brow.style.display = 'none';
  b.cycbar.style.display = 'none';
  b.lock.style.display = 'none';
  b.amtRow.style.display = 'none';
  b.benchbox.style.display = '';

  const phase = j ? j.phase : 'idle';
  const working = phase === 'working', done = phase === 'done', offer = phase === 'offer';
  const need = j ? enhEmbers(j.target) : 0, mat = j ? enhMat(j.item) : null;

  // the odds, big, with the price under them; the embers as two counters beside
  const pct = j ? `+${j.target} · ${Math.round(j.chance * 100)}%` : '—';
  if (b.bpct.textContent !== pct) b.bpct.textContent = pct;
  const pc = 'bpct' + (j ? (j.chance >= 0.8 ? ' good' : j.chance >= 0.7 ? ' fair' : ' poor') : '');
  if (b.bpct.className !== pc) b.bpct.className = pc;
  b.blab.style.display = '';
  const preview = j ? enhancementPreview(j.item, j.target) + ' · ' + (j.chance === 1 ? 'Guaranteed' : 'Failure spends embers; item stays safe') : 'Guaranteed through +3. Equipment is safe on every attempt.';
  if (b.blab.textContent !== preview) b.blab.textContent = preview;
  b.bembers.querySelectorAll('.bember').forEach(el => {
    const k = el.dataset.k, n = embersHeld(k), wanted = offer && mat === k;
    // while a piece is offered both metals read held over needed, the other one over 0
    const bn = el.querySelector('.bn'), t = offer ? `${n}/${wanted ? need : 0}` : String(n);
    if (bn.textContent !== t) bn.textContent = t;
    const c = 'bember' + (n > 0 ? ' some' : ' none') + (wanted ? (n >= need ? ' wanted' : ' short') : '');
    if (el.className !== c) el.className = c;
  });

  // the piece on the bench: still while offered, shaking and glowing harder as the wait runs out
  const key = j ? j.item.uid + ':' + phase : '';
  if (b.bchip._key !== key) {
    b.bchip._key = key;
    b.bchip.innerHTML = j ? chipHtml(j.item, 'onbench') : '';
  }
  const p = working ? 1 - j.t / j.total : done ? 1 : 0;
  const over = gdrag && gdrag.over;
  const sc = 'bslot ' + (j ? phase : 'empty') + (over ? ' over' : '');
  if (b.bslot.className !== sc) b.bslot.className = sc;
  const amp = (working ? (0.5 + 6 * p * p) : 0).toFixed(2) + 'px';
  if (b.bslot.style.getPropertyValue('--amp') !== amp) b.bslot.style.setProperty('--amp', amp);
  const glow = (working ? p : done ? 1 : 0).toFixed(2);
  if (b.bslot.style.getPropertyValue('--glow') !== glow) b.bslot.style.setProperty('--glow', glow);
  const hint = j ? '' : (gdrag ? 'DROP IT HERE' : 'DROP A PIECE HERE');
  if (b.bhint.textContent !== hint) b.bhint.textContent = hint;
  b.bfill.style.width = (p * 100) + '%';

  // the offer's two buttons
  b.bbtns.style.display = offer ? '' : 'none';
  if (offer) {
    const can = embersHeld(mat) >= need;
    const gc = 'bbtn bgo' + (can ? ' can' : ' poor');
    if (b.bgo.className !== gc) b.bgo.className = gc;
    if (b.bgo.textContent !== 'CONFIRM') b.bgo.textContent = 'CONFIRM';
  }

  let tags = done ? '<span class="tag on">DONE</span>' : working ? `<span class="tag work">WORKING · ${j.t.toFixed(1)}S</span>`
           : offer ? '<span class="tag">OFFERED</span>' : '<span class="tag">IDLE</span>';
  if (offer) tags += `<span class="tag">${j.total}S</span>`;
  if (done) tags += '<span class="tag cold">NO SPARE SLOT</span>';
  if (b.tags.innerHTML !== tags) b.tags.innerHTML = tags;
}

/* ---- the sidebar: every stock in hand, every purchase on the board ----
