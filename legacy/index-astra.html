const sbEl = { root: document.getElementById('sidebar'), stocks: document.getElementById('sb-stocks'),
               ups: document.getElementById('sb-ups'), none: document.getElementById('sb-none') };
let sbUpKey = '';
function sidebarStocks() {
  const rows = [];
  const o = S.ores;
  ORES.forEach(d => {
    if (!o[d.id].unlocked) return;
    if (d.facility || d.battling || d.gearing || d.enhancing || d.recycling || d.water) return;
    if (d.bucketing) { rows.push({ n: 'buckets', c: d.color, v: `${fullBuckets()} <small>full / ${o.buckets.buckets.length}</small>` }); return; }
    if (d.farming) { CROP_KINDS.forEach(k => rows.push({ n: CROPS[k].name.toLowerCase(), c: CROPS[k].color, v: `${fmt(o.farm.crops[k])} <small>/ ${fmt(capOf('farm'))}</small>`, full: o.farm.crops[k] >= capOf('farm') })); return; }
    rows.push({ n: resWord(d.id), c: d.color, v: `${fmt(o[d.id].amount)} <small>/ ${fmt(capOf(d.id))}</small>`, full: isFull(d.id) });
  });
  if (o.battle.unlocked) {
    rows.push({ n: 'gold', c: '#ffd27a', v: fmt(o.battle.gold) });
    CROP_KINDS.forEach(k => { if (o.battle.seedsOf[k] > 0) rows.push({ n: CROPS[k].name.toLowerCase() + ' seed', c: CROPS[k].color, v: fmt(o.battle.seedsOf[k]) }); });
    EMBER_KINDS.forEach(k => { if (o.battle.embers[k] > 0) rows.push({ n: EMBER[k].name.toLowerCase(), c: EMBER[k].color, v: fmt(o.battle.embers[k]) }); });
  }
  return rows;
}
function paintSidebar() {
  if (!sbEl.root || !sbEl.root.open) return;
  // stocks: rebuilt when the set changes, values diffed otherwise
  const rows = sidebarStocks();
  const skey = rows.map(r => r.n).join('|');
  if (sbEl.stocks._key !== skey) {
    sbEl.stocks._key = skey;
    sbEl.stocks.innerHTML = rows.map(r => `<div class="sb-row" data-n="${r.n}" style="--c:${r.c}"><span class="sb-n">${r.n}</span><span class="sb-v"></span></div>`).join('');
  }
  const els = sbEl.stocks.children;
  rows.forEach((r, i) => {
    const el = els[i]; if (!el) return;
    const v = el.querySelector('.sb-v'); if (v.innerHTML !== r.v) v.innerHTML = r.v;
    const c = 'sb-row' + (r.full ? ' sb-full' : ''); if (el.className !== c) el.className = c;
  });
  // upgrades: one row per priced tile on the board, grouped as they come
  // only tiles on cards that are actually on the board: a card that has not
  // been revealed yet keeps its price to itself
  // forging is the rack's own business, so its buttons stay off the list
  const tiles = upTiles.filter(t => {
    if (!t.node.isConnected || !t.node._cur || !t.node._cur.cost) return false;
    const card = t.node.closest('.ore');
    if (!card || card.style.display === 'none') return false;
    return !t.node.closest('.gslot, .gchips, .grow');
  });
  const ukey = tiles.map(t => t.node._cur.title + ':' + JSON.stringify(t.node._cur.cost)).join('|');
  if (sbUpKey !== ukey) {
    sbUpKey = ukey;
    // grouped under the card each belongs to, in board order
    const groups = [];
    tiles.forEach((t, i) => {
      const card = t.node.closest('.ore'), name = card.querySelector('.ore-name').textContent.trim();
      let g = groups.find(x => x.card === card); if (!g) { g = { card, name, rows: [] }; groups.push(g); }
      g.rows.push({ t, i });
    });
    sbEl.ups.innerHTML = groups.map(g => `<div class="sb-group"><div class="sb-card">${g.name}</div>` + g.rows.map(({ t, i }) => {
      const sp = t.node._cur;
      const tint = sp.tint && BY_ID[sp.tint] ? BY_ID[sp.tint].color : 'var(--ember)';
      const cost = Object.keys(sp.cost).map(k => `<span style="--c:${BY_ID[k].color}">${fmt(sp.cost[k])} ${resWord(k)}</span>`).join('');
      // "Storage — level 1/30" reads as the name with the level as a small tag
      const m = /^(.*?)\s+[—-]\s+(?:level\s+)?(\S+)$/.exec(sp.title);
      const name = m ? `${m[1]} <small>${m[2]}</small>` : sp.title;
      return `<button class="sb-up" data-i="${i}" style="--uc:${tint}"><span class="sb-name">${name}</span><span class="sb-cost">${cost}</span></button>`;
    }).join('') + `</div>`).join('');
    sbEl.ups._tiles = tiles;
  }
  sbEl.ups.querySelectorAll('.sb-up').forEach(el => {
    const t = tiles[Number(el.dataset.i)]; if (!t) return;
    const c = 'sb-up ' + (canPay(t.node._cur.cost) ? 'can' : 'poor');
    if (el.className !== c) el.className = c;
  });
  const none = tiles.length === 0;
  if (sbEl.none.style.display !== (none ? '' : 'none')) sbEl.none.style.display = none ? '' : 'none';
}
if (sbEl.ups) {
  sbEl.ups.addEventListener('pointerdown', ev => ev.stopPropagation());
  sbEl.ups.addEventListener('click', ev => {
    ev.stopPropagation();
    const row = ev.target.closest('.sb-up'); if (!row) return;
    const t = (sbEl.ups._tiles || [])[Number(row.dataset.i)];
    if (t && t.node.isConnected) t.node.click();     // the same purchase, the same checks, the same sound
  });
  sbEl.root.addEventListener('pointerdown', ev => ev.stopPropagation());
  sbEl.root.addEventListener('wheel', ev => ev.stopPropagation());
}

function paint() {
  paintSidebar();
  ORES.forEach(d => {
    if (!revealed.has(d.id)) return;          // off the board entirely
    if (d.hosted) return;                      // its host paints it
    const o = S.ores[d.id], b = bars[d.id];
    if (d.enhancing) { paintBench(d, o, b); return; }
    if (d.recycling) { paintRecycle(d, o, b); return; }
    if (d.gearing) { paintGear(d, o, b); return; }
    if (d.battling) { paintBattle(d, o, b); return; }
    if (d.bucketing) { paintBuckets(d, o, b); return; }
    if (d.water) { paintWater(d, o, b); return; }
    if (d.facility) { paintFurnace(d, o, b); return; }

    const cap = capOf(d.id);
    const worked = o.unlocked && isWorked(d.id);
    let cls = 'ore';
    if (o.running) cls += ' run';
    if (!o.unlocked) {
      cls += ' locked';
      if (unlockProgress(d.id) >= 1) cls += ' ready';
    }
    if (o.unlocked && Math.floor(o.amount) >= cap) cls += ' full';
    if (worked) cls += ' worked';
    // nothing to click on the card itself: the furnace pours iron, and on the
    // bench the only controls are the moulds
    if (d.heatDriven || isBench(d.id)) cls += ' passive';
    if (b.root.classList.contains('pop')) cls += ' pop';
    if (b.root.classList.contains('hit')) cls += ' hit';
    if (b.root.classList.contains('appear')) cls += ' appear';
    if (b.root.className !== cls) b.root.className = cls;

    if (!o.unlocked) { paintLocked(d, b); return; }

    b.amtRow.style.display = '';
    b.trackEl.style.display = '';
    b.wrow.style.display = 'none';
    b.ocean.style.display = 'none';
    b.grows.style.display = 'none';
    b.gsum.style.display = 'none';
    b.benchbox.style.display = 'none';
    b.brow.style.display = 'none';
    // the bench's moulds take the place of the work-cycle rail
    const hosting = hostedBy(d.id);
    if (!hosting.length) { b.mrow.style.display = isBench(d.id) ? '' : 'none'; b.amt2.style.display = 'none'; }
    b.cycbar.style.display = isBench(d.id) ? 'none' : '';
    b.lock.style.display = 'none';
    b.fill.style.width = Math.min(100, o.amount / cap * 100) + '%';

    if (isBench(d.id)) paintMoulds(d, o, b);
    hosting.forEach(x => paintHosted(x, b));

    const cold = heatBlocked(d.id);
    // on a heat-driven bar the cycle rail becomes a live furnace-heat gauge
    const cycP = d.heatDriven ? heatOf() / heatMax() : o.progress;
    b.cyc.style.width = (cycP * 100) + '%';
    const cycCls = 'cyc' + ((d.heatDriven ? heatOf() > 0 : o.running) ? ' on' : '');
    if (b.cyc.className !== cycCls) b.cyc.className = cycCls;

    let st = '', stCls = 'tstatus';
    if (isBench(d.id)) { const r = benchStatus(d, o); st = r[0]; stCls = r[1]; }
    else if (isFull(d.id)) st = worked ? 'FULL · WORK ELSEWHERE' : 'FULL · EXPAND STORAGE';
    else if (cold) {
      st = furnaceBuilt() ? `FURNACE UNDER ${SMELT_MIN_HEAT}° · STOKE IT` : 'NEEDS A FURNACE';
      stCls += ' cold';
    }
    else if (d.heatDriven) st = `SMELTING AT ${Math.round(heatOf())}°`;
    else if (o.running) st = d.verb + ' · ' + ((1 - o.progress) * timeOf(d.id) / 1000).toFixed(1) + 'S';
    else if (worked) { st = `CLICK · ${d.verb}`; stCls += ' go'; }
    else if (autoFeeds(d.id)) st = `AUTO · +${fmt(autoRate(d.id))}/S`;
    else if (!S.worked && d.id === 'wood') { st = 'CLICK TO GATHER WOOD'; stCls += ' go'; }
    else { st = 'IDLE · CLICK TO WORK'; stCls += ' go'; }
    if (b.status.textContent !== st) b.status.textContent = st;
    if (b.status.className !== stCls) b.status.className = stCls;

    const curTxt = d.farming ? fmt(o.crops.grain) : fmt(o.amount);
    if (b.cur.textContent !== curTxt) b.cur.textContent = curTxt;
    // the bench names its unit: "12 / 20 bars" reads as stock, not as a cycle
    const capTxt = '/ ' + fmt(cap) + (d.farming ? ' grain' : isBench(d.id) ? ' ' + d.unit : '');
    if (b.capv.textContent !== capTxt) b.capv.textContent = capTxt;
    const rate = totalRate(d.id);
    const rateTxt = d.farming ? ''
                  : rate > 0 ? '+' + fmt(rate) + '/s'
                  : (d.heatDriven || autoRate(d.id) > 0) && cold ? '· idle ·' : '';
    if (b.rate.textContent !== rateTxt) b.rate.textContent = rateTxt;
    if (d.farming) {
      b.seedsel.style.display = '';
      b.seedsel.querySelectorAll('.seedbtn').forEach(btn => {
        const k = btn.dataset.k, n = seedsHeld(k);
        const c = 'seedbtn' + (o.seedKind === k ? ' on' : '') + (n < 1 ? ' none' : '');
        if (btn.className !== c) btn.className = c;
        const sn = btn.querySelector('.sn'), t = n + ' seed' + (n === 1 ? '' : 's');
        if (sn.textContent !== t) sn.textContent = t;
      });
    }

    let tags = '';
    if (worked) tags += '<span class="tag work">WORKING</span>';
    if (d.heatDriven) tags += hasHeat()
      ? '<span class="tag on">HEAT</span>'
      : '<span class="tag cold">NO HEAT</span>';
    // always shown where automation exists, so the + beside it has a label
    if (canAuto(d.id)) tags += `<span class="tag${o.lvl.auto > 0 ? ' on' : ''}">AUTO ${o.lvl.auto}</span>`;
    if (b.tags.innerHTML !== tags) b.tags.innerHTML = tags;
  });

  paintLinks();
  paintTiles();
}

/* ---- upgrades: inline on the card, beside whatever they change ---- */

/* Buttons are built once and then kept — buying an upgrade refreshes the
   numbers on the existing node rather than replacing it. Rebuilding would
   reset every cost ring on the board back to zero, so a single purchase looked
   like it had cleared everyone's progress. */
function applySpec(b, spec) {
  b._cur = spec;
  if (spec.tint) b.style.setProperty('--uc', BY_ID[spec.tint].color);
  const l = b.querySelector('.ulabel');
  if (l) { const txt = labelOf(spec); if (l.textContent !== txt) l.textContent = txt; }
  b._pop = { title: spec.title, eff: spec.eff, tip: spec.tip, cost: spec.cost,
             gate: spec.gate, gateText: spec.gateText };
  if (hovered === b) showPop(b);            // keep an open hover card current
}

/* shared wiring for any upgrade control — hover card, purchase, and the
   registration that drives its cost ring every frame */
function wireUp(b, spec, base) {
  b.addEventListener('mouseenter', () => { if (panned) return; hovered = b; showPop(b); });
  b.addEventListener('mouseleave', () => { if (hovered === b) { hovered = null; hidePop(); } });
  b.addEventListener('pointerdown', ev => ev.stopPropagation());
  b.addEventListener('click', (ev) => {
    ev.stopPropagation();                   // never works the tile underneath
    const s = b._cur;
    if (s && s.cost && s.buy && canPay(s.cost) && (!s.gate || s.gate())) { s.buy(); sfx(s.sound || 'buy'); }
    else if (s && s.cost) sfx('no');
  });
  upTiles.push({ node: b, prog: b.querySelector('.uprog'),
                 ring: b.querySelector('.uringbar'), base });
  applySpec(b, spec);
  return b;
}

/* re-read every live button's cost and description in place */
function refreshUps() {
  ORES.forEach(d => (bars[d.id].ups || []).forEach(b => applySpec(b, b._spec())));
}

/* the wide OPEN / BUILD button that fills a locked card's bottom strip */
function uTile(o) {
  const b = document.createElement('button');
  b.className = 'utile wide';
  if (o.tint) b.style.setProperty('--uc', BY_ID[o.tint].color);
  const price = o.cost
    ? `<span class="ucost">` + Object.keys(o.cost).map(k =>
        `<span style="color:${BY_ID[k].color}">${fmt(o.cost[k])} ${resWord(k)}</span>`).join('') + `</span>`
    : '';
  b.innerHTML = `<span class="uprog"></span><span class="usym">${o.sym}</span>` + price;
  return wireUp(b, o, 'utile wide');
}

/* a rounded-rect outline as a single path, starting at top centre and running
   clockwise, so stroke-dasharray fills it like a dial */
function ringPath(w, h, inset, r) {
  const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset;
  const rr = Math.max(0, Math.min(r, (x1 - x0) / 2, (y1 - y0) / 2));
  const cx = ((x0 + x1) / 2).toFixed(2);
  return `M${cx} ${y0} H${(x1 - rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${x1} ${(y0 + rr).toFixed(2)} ` +
         `V${(y1 - rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${(x1 - rr).toFixed(2)} ${y1} ` +
         `H${(x0 + rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${x0} ${(y1 - rr).toFixed(2)} ` +
         `V${(y0 + rr).toFixed(2)} A${rr} ${rr} 0 0 1 ${(x0 + rr).toFixed(2)} ${y0} Z`;
}

/* A wide button whose face is a line of text. Its ring has to be built from
   the rendered size — the world is a fixed-size map, so that size is stable
   once the strip is on screen. */
function fitRings() {
  upTiles.forEach(t => {
    if (!t.ring || !t.node._fitRing) return;
    const w = t.node.clientWidth, h = t.node.clientHeight;
    if (!w || !h || (t._w === w && t._h === h)) return;
    t._w = w; t._h = h;
    t.ring.ownerSVGElement.setAttribute('viewBox', `0 0 ${w} ${h}`);
    t.ring.setAttribute('d', ringPath(w, h, 1, 7));
  });
}

function uText(o) {
  const b = document.createElement('button');
  b.className = 'utext';
  b._fitRing = true;
  if (o.tint) b.style.setProperty('--uc', BY_ID[o.tint].color);
  b.innerHTML =
    `<svg class="uring"><path class="uringbar" pathLength="100" style="stroke-dasharray:0 100"/></svg>` +
    `<span class="ulabel"></span>`;
  b.querySelector('.ulabel').textContent = labelOf(o);
  return wireUp(b, o, 'utext');
}

/* a compact + that sits next to the number, bar or tag it affects. The cost
   ring is an SVG rect driven by stroke-dasharray, the same trick the supply
   lines use — exact at any zoom, and it wraps the whole button. */
function uBtn(o) {
  const b = document.createElement('button');
  b.className = 'ubtn';
  if (o.tint) b.style.setProperty('--uc', BY_ID[o.tint].color);
  // a <path>, not a <rect>: pathLength is reliable on paths, and drawing it by
  // hand lets the fill start at top centre and run clockwise
  b.innerHTML =
    `<svg class="uring" viewBox="0 0 28 28">` +
      `<path class="uringbar" pathLength="100" style="stroke-dasharray:0 100" d="` +
        `M14 1.25 H20.25 A6.5 6.5 0 0 1 26.75 7.75 V20.25 A6.5 6.5 0 0 1 20.25 26.75 ` +
        `H7.75 A6.5 6.5 0 0 1 1.25 20.25 V7.75 A6.5 6.5 0 0 1 7.75 1.25 Z"/>` +
    `</svg><span class="uplus"></span>`;
  return wireUp(b, o, 'ubtn');
}

function renderStrips() {
  upTiles = [];
  hovered = null;
  hidePop();
  ORES.forEach(d => renderStrip(d.id));
  fitRings();
}

/* A heat-driven tile is worked entirely by the furnace — it has no output of
   its own to deepen and nothing to automate, only somewhere to put the ingots.
   The field has nothing above it to pay an automator with, so it never gets
   one: the top of the ladder is worked by hand for ever. */
function upgradesFor(d) {
  if (d.heatDriven) return UPGRADES.filter(u => u.key === 'cap');
  // the bench gets More Moulds where a worked tile would show nothing extra;
  // the field expands one plot at a time and supports a helper
  if (d.farming) return UPGRADES.concat([MOULDS, AUTO]);
  // the moulds: a bar is a bar, so no Bigger Haul — only room, more moulds, and the hand
  if (d.casting) return UPGRADES.filter(u => u.key === 'cap').concat([MOULDS]);   // the iron moulds are poured by hand
  if (d.steeling) return UPGRADES.filter(u => u.key === 'cap').concat([MOULDS, AUTO]);
  if (isBench(d.id)) return UPGRADES.concat([MOULDS, AUTO]);
  return canAuto(d.id) ? TILE_UPGRADES : UPGRADES;
}

/* what automation costs right now, in plain words */
function autoTip(id) {
  return `Paid in <b>gold</b> from the battle. Every level costs three times the last, ` +
         `and the deep waves are where the gold is.`;
}

function unlockBlurb(d) {
  if (d.farming) {
    return `Beats <b>${d.unlock.iron} iron</b> into a plow and breaks a <b>three plots</b>, ` +
           `<b>0 / ${BASE_CAP}</b> sheaves. Each plot is walked through by hand: <em>plow</em> it, <em>plant</em> ` +
           `a seed won in battle, <em>water</em> it with a full bucket, wait <em>${FURROW_GROW_TIME}s</em>, then reap. ` +
           `Plowing itself takes <em>${PLOW_TIME}s</em>. ` +
           `Never the tile you are stood at, so it grows while you work elsewhere.`;
  }
  if (d.bucketing) {
    return `Builds the shelf the buckets stand on. Each bucket is then beaten out of <b>bars</b>, fills with ` +
           `water on its own once the sky is opened, and a full one waters a plot in the field.`;
  }
  if (d.recycling) {
    return `Starts the scrap pile. Drag a piece of gear onto it, worn or spare, and it melts back to ` +
           `<b>${GEAR_MATS.iron.back} bar</b> of its metal. The only way to be rid of a dud.`;
  }
  if (d.enhancing) {
    return `Builds the bench. Drag a piece of gear onto it, worn or spare, feed it the embers the battle drops, and wait: it comes back ` +
           `<b>one level higher</b>. Stat gains round up, and the first three levels are guaranteed. ` +
           `Success chances: ${ENH_CHANCE.map(c => Math.round(c * 100) + '%').join(', ')}, then ${Math.round(ENH_FLOOR * 100)}%. Failure spends embers but preserves the piece and its levels.`;
  }
  if (d.gearing) {
    return `Builds the rack: five slots on the body, each with one piece worn and two spare. ` +
           `Every piece is beaten out of <b>${FORGE_COST} iron bars</b> from the moulds and rolls on the anvil — <em>plain</em>, ` +
           `or with <em>one</em> or <em>two</em> extra stats. Melt what you do not want for <b>${MELT_BACK}</b> bar back. ` +
           `The <b>Battle</b> opens with it.`;
  }
  if (d.charring) {
    return `Builds the clamp: <b>${MOULD_BASE}</b> stacks. Bury <b>${CLAMP_WOOD} wood</b> in one, wait <em>${CLAMP_TIME}s</em> ` +
           `while it smoulders, and a charcoal comes out on its own. Charcoal goes into steel and nothing else. Paid in the boars' gold.`;
  }
  if (d.steeling) {
    return `Builds the steelworks: <b>${MOULD_BASE}</b> moulds that take <b>${STEEL_IRON} iron</b> ` +
           `each and set in <em>${STEEL_TIME}s</em> — but only while the furnace reads <b>${STEEL_HEAT}&deg;</b> or more. ` +
           `Below that they wait. Steel bars forge steel gear at the rack.`;
  }
  if (d.casting) {
    return `Opens the casting bench with <b>${MOULD_BASE}</b> moulds and <b>0 / ${BASE_CAP}</b> bars. ` +
           `Each mould takes <b>${MOULD_FILL_COST} iron</b>, sets in <em>${MOULD_COOL_TIME}s</em>, ` +
           `then hands you a bar. Press the moulds themselves — the bench is never the tile ` +
           `you are stood at, so it runs alongside whatever you are working.`;
  }
  if (d.facility) {
    return `Builds the furnace and opens <b>Iron</b> with it, free — moulds included, right on the iron card. Click the furnace to stoke it: ` +
           `<b>${FURNACE_STOKE_COST} wood</b> goes in whenever it is ready, feeding <b>+${FURNACE_HEAT_GAIN}°</b> ` +
           `over <em>${FURNACE_BURN_TIME}s</em>. Iron then pours itself, <em>faster the hotter it burns</em>. ` +
           `Heat leaks faster the hotter it gets, so stoking alone tops out around ` +
           `<b>${Math.round(heatCeiling(0, 0))}°</b>.`;
  }
  return `Brings <b>${d.name}</b> online at <b>0 / ${BASE_CAP}</b>. Worked by hand until you automate it.`;
}

/* what one upgrade offers right now — re-read after every purchase so the
   button can restate itself without being rebuilt */
function upgradeSpec(id, u) {
  const o = S.ores[id], lvl = o.lvl[u.key];
  if (lvl >= u.max) {
    return { tint: payOre(id, u), title: `${u.name} — maxed`, label: `${u.name}: maxed`,
             eff: u.eff(id, lvl - 1), tip: payOre(id, u) === 'gold' && u.pay === 'gold' ? autoTip(id) : (u.tip || `Paid in ${resName(payOre(id, u))}. It works this tile on its own, click or no click.`), cost: null };
  }
  const cost = costOf(id, u, lvl);
  return { tint: payOre(id, u), title: `${u.name} — level ${lvl}/${u.max}`,
           label: `${u.name} ${lvl}/${u.max} · ${costWords(cost)}`,
           eff: u.eff(id, lvl), tip: payOre(id, u) === 'gold' && u.pay === 'gold' ? autoTip(id) : (u.tip || `Paid in ${resName(payOre(id, u))}. It works this tile on its own, click or no click.`), cost,
           buy: () => { pay(cost); o.lvl[u.key]++; commit(); } };
}
/* what a text row says: its own label, or its title with the price after it */
function labelOf(spec) {
  const price = spec.cost ? ' · ' + costWords(spec.cost) : '';
  if (spec.label !== undefined) return spec.label + (spec.cost && !spec.label.includes(costWords(spec.cost)) ? price : '');
  return spec.title + price;
}

function bucketSpec(id) {
  const o = S.ores[id], n = o.buckets.length, maxed = n >= BUCKET_MAX;
  const cost = maxed ? null : { bars: bucketCost(n) };
  return {
    tint: 'bars',
    title: maxed ? 'Forge Bucket — the row is full' : `Forge Bucket — ${n}/${BUCKET_MAX} made`,
    eff: `Beats bars into a bucket &rarr; <b>${Math.min(BUCKET_MAX, n + 1)}</b> in the row.<br>` +
         `Every bucket fills at once, at <em>${BUCKET_FILL_K}</em> per unit of flow — ` +
         `<b>${fmt(BUCKET_SIZE / Math.max(0.01, bucketFillRate()))}s</b> to fill at today's flow.`,
    tip: 'Paid in iron bars. A full bucket stays full; it is water for whatever comes next.',
    cost,
    buy: () => { pay(cost); o.buckets.push({ f: 0 }); replay(bars[id].root, 'hit'); commit(); },
  };
}

/* The river is bought with stone AND with flow: it wants to see a strong flow
   at the moment you build it, and it takes a chunk of that flow out of the
   window. What it gives back is a floor the flow never drops under again. */
function riverSpec(id) {
  const o = S.ores[id], lvl = o.lvl.river, maxed = lvl >= RIVER_MAX;
  const gate = riverGate(lvl), spend = riverSpend(lvl);
  const cost = maxed ? null : { stone: riverStone(lvl) };
  const label = maxed ? `River: floor at ${fmt(riverFloor(lvl))}/s, as wide as it gets`
              : `River ${lvl + 1}: floor ${fmt(riverFloor(lvl))} → ${fmt(riverFloor(lvl + 1))}/s · needs flow ${fmt(gate)}/s`;
  return {
    tint: 'stone', label,
    title: maxed ? 'River — maxed' : `River — level ${lvl}/${RIVER_MAX}`,
    eff: `Flow floor <em>${fmt(riverFloor(lvl))}/s</em> &rarr; <b>${fmt(riverFloor(lvl + 1))}/s</b>. ` +
         `The buckets fill at least that fast whether or not you touch the sky.` +
         (maxed ? '' : `<br>Needs a flow of <b>${fmt(gate)}/s</b> right now (you have <b>${fmt(rawFlow())}/s</b>). ` +
                       `Building it <em>resets the flow</em> to the new floor.`),
    tip: 'Paid in stone, plus the flow you have built up: it all goes into the riverbed.',
    cost, sound: 'river',
    gate: () => rawFlow() >= gate - 1e-6,
    gateText: `flow ${fmt(gate)}/s`,
    buy: () => {
      if (rawFlow() < gate - 1e-6) return;
      pay(cost);
      o.hist = [];                 // the flow you made goes into the riverbed
      o.lvl.river++;
      floatText(id, 'RIVER ' + o.lvl.river, BY_ID[id].color);
      replay(bars[id].root, 'hit');
      commit();
    },
  };
}

/* forging a piece for one slot: it lands in a spare slot, so a full rack has
   to melt something first */
function forgeSpec(slot, mat = 'iron') {
  const M = GEAR_MATS[mat];
  const cost = { [M.pay]: M.cost };
  const free = freeBackup(slot) >= 0;
  const busy = !!forgeJob();
  const base = {}; Object.keys(GEAR_BASE[slot]).forEach(k => base[k] = GEAR_BASE[slot][k] * M.scale);
  const odds = mat === 'steel' ? 'never plain — two extras as often as one, and one time in five three'
                               : 'half the time plain, a third with one extra stat, the rest with two';
  return {
    tint: M.pay,
    title: `Forge ${M.name} ${GEAR_NAME[slot]} — ${slot}`,
    eff: `Beats <b>${M.cost} ${resName(M.pay).toLowerCase()}</b> into a ${M.name.toLowerCase()} ${GEAR_NAME[slot].toLowerCase()} ` +
         `for the <b>${slot}</b> slot over <em>${M.time}s</em>: <em>${statLine(base)}</em> as a base, then the anvil rolls — ${odds}.` +
         (free ? '' : `<br><b>Both spare slots are taken.</b> Melt one to forge again.`) +
         (busy ? `<br><b>The anvil is busy.</b> One piece at a time.` : ''),
    tip: `Paid in ${resName(M.pay).toLowerCase()}. The piece takes shape in a spare slot; click a spare to wear it, × to melt it for ${M.back} back.`,
    cost, sound: 'pour',
    gate: () => !forgeJob() && freeBackup(slot) >= 0,
    gateText: busy ? 'the anvil free' : 'a spare slot',
    buy: () => {
      const i = freeBackup(slot);
      if (i < 0 || forgeJob()) return;
      pay(cost);
      S.ores.gear.job = { slot, mat, i, t: M.time, total: M.time };
      replay(bars.gear.root, 'hit');
      commit();
    },
  };
}

function bellowsSpec(id) {
  const o = S.ores[id], lvl = o.lvl.bellows, maxed = lvl >= BELLOWS.max;
  return {
    tint: BELLOWS.pay,
    label: maxed ? 'Bellows: cooldown at minimum' : 'Bellows: reduce burn cooldown',
    title: maxed ? `${BELLOWS.name} — maxed` : `${BELLOWS.name} — level ${lvl}/${BELLOWS.max}`,
    eff: BELLOWS.eff(id, maxed ? lvl - 1 : lvl),
    tip: BELLOWS.tip,
    cost: maxed ? null : costOf(id, BELLOWS, lvl),
    buy: () => { pay(costOf(id, BELLOWS, lvl)); o.lvl.bellows++; commit(); },
  };
}

function renderStrip(id) {
  const d = BY_ID[id], o = S.ores[id], b = bars[id];
  if (d.hosted) return;                       // its host lays it out
  b.strip.innerHTML = '';
  b.strip.style.display = 'none';            // the bottom strip is free for later
  Object.values(b.slots).forEach(s => s.innerHTML = '');
  Object.values(b.gslots || {}).forEach(s => s.innerHTML = '');
  b.ups = [];
  renderAstraActions(id);
  b.root.querySelectorAll('.process-label').forEach(label => label.style.display = o.unlocked ? '' : 'none');

  /* The mould row changes the card's height, and the supply lines are cut to
     the measured card — so it has to be in place before buildLinks runs, not
     on the first paint after it. */
  const hosting = hostedBy(id).filter(x => S.ores[x.id].unlocked);
  b.mrow.style.display = ((isBench(d.id) || d.bucketing) && o.unlocked) || hosting.length ? '' : 'none';
  b.seedsel.style.display = (d.farming && o.unlocked) ? '' : 'none';
  b.amt2.style.display = hosting.length ? '' : 'none';
  b.mouldsEl.className = 'moulds' + (d.farming ? ' grid3' : '');
  if (isBench(d.id) && o.unlocked) buildMoulds(id, plotCount(id));
  hosting.forEach(x => buildMoulds(x.id, plotCount(x.id)));
  b.grows.style.display = (d.gearing && o.unlocked) ? '' : 'none';
  b.gsum.style.display = (d.gearing && o.unlocked) ? '' : 'none';
  b.brow.style.display = (d.battling && o.unlocked) ? '' : 'none';
  b.benchbox.style.display = (d.enhancing && o.unlocked) ? '' : 'none';
  b.rbox.style.display = (d.recycling && o.unlocked) ? '' : 'none';
  if (d.bucketing && o.unlocked) buildBuckets(id, o.buckets.length);
  b.wrow.style.display = (d.water && o.unlocked) ? '' : 'none';
  b.ocean.style.display = (d.water && o.unlocked) ? '' : 'none';

  // a locked card has no bars or figures to hang buttons off, so its one
  // action gets the bottom strip
  if (!o.unlocked) {
    b.strip.style.display = '';
    b.strip.appendChild(uTile({
      tint: id,
      sym: d.unlockLabel || ((d.facility ? 'BUILD ' : 'OPEN ') + d.name.toUpperCase()),
      title: (d.facility ? 'Build the ' : 'Open ') + d.name,
      eff: unlockBlurb(d),
      tip: 'Each ingredient runs in along its own supply line.',
      cost: d.unlock, sound: 'unlock',
      buy: () => {
        pay(d.unlock);
        o.unlocked = true;
        // whatever this tile grants comes online in the same commit, free
        ORES.forEach(x => { if (x.opensWith === id) S.ores[x.id].unlocked = true; });
        commitUnlock();
      },
    }));
    return;
  }

  const add = (node, spec) => { node._spec = spec; b.ups.push(node); return node; };

  // the rack: one forge button per slot per material you can work
  if (d.gearing) {
    GEAR_SLOTS.forEach(k => {
      const spec = () => forgeSpec(k, 'iron');
      b.gslots[k].appendChild(add(uBtn(spec()), spec));
      if (S.ores.steel.unlocked) {
        const spec2 = () => forgeSpec(k, 'steel');
        b.gslots['steel_' + k].appendChild(add(uBtn(spec2()), spec2));
      }
    });
    return;
  }
  // the battle, the bench and the scrap pile have nothing to buy once built
  if (d.battling || d.enhancing || d.recycling) return;
  /* Every purchase a card offers is a text row in the strip under it, the
     cheap kinds first: Storage, Bigger Haul, More Plots, then Automation. */
  const row = spec => { b.strip.style.display = ''; b.strip.appendChild(add(uText(spec()), spec)); };
  if (d.bucketing) { row(() => bucketSpec(id)); return; }
  if (d.water) { row(() => riverSpec(id)); return; }
  if (d.facility) {
    row(() => upgradeSpec(id, STOKER));
    row(() => bellowsSpec(id));
    row(() => upgradeSpec(id, LINING));
    return;
  }
  upgradesFor(d).forEach(u => row(() => upgradeSpec(id, u)));
  hosting.forEach(x => upgradesFor(x).forEach(u => row(() => upgradeSpec(x.id, u))));
}

/* hover card, parked in the viewport so nothing clips it and zoom never
   stretches it. Tile rects are screen-space, and so is the card. */
function showPop(tile) {
  const p = tile._pop;
  if (!p) return;
  let html = `<div class="pt">${p.title}</div><div class="pe">${p.eff}</div>`;
  if (p.tip) html += `<div class="pd">${p.tip}</div>`;
  if (p.cost) {
    html += '<div class="pc">' + Object.keys(p.cost).map(k =>
      `<span data-ore="${k}" style="--c:${BY_ID[k].color}">${fmt(p.cost[k])} ${resWord(k)}</span>`
    ).join('') +
    (p.gate ? `<span data-gate="1" style="--c:${BY_ID.water.color}">${p.gateText}</span>` : '') +
    '</div>';
  }
  el.upop.innerHTML = html;
  el.upop.classList.add('show');

  const f = el.forge.getBoundingClientRect();
  const t = tile.getBoundingClientRect();
  const u = el.upop.getBoundingClientRect();
  const gap = 14;
  const tx = t.left - f.left, ty = t.top - f.top, tw = t.width, th = t.height;
  const cands = [
    { x: tx + tw + gap,             y: ty + th / 2 - u.height / 2 },
    { x: tx - gap - u.width,        y: ty + th / 2 - u.height / 2 },
    { x: tx + tw / 2 - u.width / 2, y: ty + th + gap },
    { x: tx + tw / 2 - u.width / 2, y: ty - gap - u.height },
  ];
  const best = cands.find(c => c.x >= 6 && c.x + u.width <= f.width - 6 &&
                               c.y >= 6 && c.y + u.height <= f.height - 6) || cands[0];
  el.upop.style.left = Math.max(6, Math.min(best.x, f.width  - u.width  - 6)) + 'px';
  el.upop.style.top  = Math.max(6, Math.min(best.y, f.height - u.height - 6)) + 'px';
  paintTiles();
}
function hidePop() { el.upop.classList.remove('show'); }

/* per-frame: run each tile's edge rails toward its price, light it when payable */
function paintTiles() {
  upTiles.forEach(t => {
    const cost = t.node._cur && t.node._cur.cost;
    const p = cost ? costProgress(cost) : 0;
    const pct = (p * 100).toFixed(1) + '%';
    if (t.prog && t.prog.style.getPropertyValue('--p') !== pct) t.prog.style.setProperty('--p', pct);
    if (t.ring) {
      const dash = (p * 100).toFixed(1) + ' 100';
      if (t.ring.style.strokeDasharray !== dash) t.ring.style.strokeDasharray = dash;
    }
    let cls = t.base;
    const s = t.node._cur;
    if (!cost) cls += ' max';
    else {
      if (p >= 1 && (!s.gate || s.gate())) cls += ' can';
      if (Object.keys(cost).some(k => !stockOpen(k))) cls += ' gated';
    }
    if (t.node.className !== cls) t.node.className = cls;
  });
  if (hovered && hovered._pop && hovered._pop.cost) {
    const cost = hovered._pop.cost;
    Object.keys(cost).forEach(k => {
      const s = el.upop.querySelector(`.pc span[data-ore="${k}"]`);
      if (!s) return;
      const have = stockOpen(k) && heldOf(k) >= cost[k];
      const c = have ? 'ok' : 'short';
      if (s.className !== c) s.className = c;
    });
    const g = el.upop.querySelector('.pc span[data-gate]');
    if (g && hovered._pop.gate) {
      const c = hovered._pop.gate() ? 'ok' : 'short';
      if (g.className !== c) g.className = c;
    }
  }
}

/* =========================================================================
   ACTIONS
   ========================================================================= */

/* A purchase only moves numbers: restate the existing buttons and leave every
   other cost ring exactly where it was. Rebuilding them all is what made one
   click look like it had wiped everybody's progress. */
function commit() { refreshUps(); save(); }

/* An unlock puts a whole new tile on the board and resizes the one you bought,
   so the strips, reveal, lines and labels all have to be redone. */
function commitUnlock() { awardMilestones(); rebuildBoard(true); save(); }

/* Lighting a burn only starts it — the heat arrives over the next few seconds,
   and the cooldown begins when the burn finishes. Called from the loop now,
   by whoever is feeding the fire: the worker, or a Stoker. */
function stokeFurnace(byHand) {
  const furnace = S.ores[FURNACE_ID], wood = S.ores.wood;
  if (!furnaceReady() || furnace.heat >= heatMax()) { if (byHand) sfx('no'); return false; }
  if (wood.amount < FURNACE_STOKE_COST) { if (byHand) sfx('no'); return false; }
  wood.amount -= FURNACE_STOKE_COST;
  furnace.burnLeft = FURNACE_BURN_TIME;
  floatText(FURNACE_ID, '+' + FURNACE_HEAT_GAIN + '°', BY_ID[FURNACE_ID].color);
  replay(bars[FURNACE_ID].root, 'hit');
  if (byHand) sfx('stoke');
  return true;
}

/* Move the worker. Whatever cycle was in progress where they were standing is
   abandoned — you do not get to bank half a swing by walking away. */
function work(id) {
  if (!isWorkable(id)) return false;
  const o = S.ores[id];
  // a click on the tile you are already at buys the next cycle
  if (isWorked(id)) {
    if (o.running || isFull(id)) return false;
    o.running = true; o.progress = 0;
    replay(bars[id].root, 'hit');
    sfx('tick');
    return true;
  }
  const prev = S.ores[S.worked];
  if (prev) { prev.running = false; prev.progress = 0; }
  S.worked = id;
  if (!isFull(id)) { o.running = true; o.progress = 0; }
  replay(bars[id].root, 'hit');
  sfx('tick');
  save();
  return true;
}

/* the next workable tile up the ladder, wrapping back to wood off the top */
function nextWork() {
  const list = workableIds();
  if (!list.length) return false;
  return work(list[(list.indexOf(S.worked) + 1) % list.length]);
}

/* ---- the bench ----
   Neither of these moves the worker: a mould is a direct action, so the bench
   runs in parallel with whatever tile is being worked. */

function fillMould(id, i, auto) {
  const d = BY_ID[id];
  if (!isBench(id)) return false;
  const o = S.ores[id];
  if (!o.unlocked) return false;
  const m = syncMoulds(id)[i];
  if (!m || m.s !== 'empty') return false;
  // the moulds want iron poured in, the clamp wood, steel both; a furrow only wants working
  const cost = plotCost(id);
  if (isFull(id)) return false;
  if (cost) {
    if (!canPay(cost)) return false;
    pay(cost);
  }
  m.s = 'cool'; m.t = plotTime(id);
  if (!auto) { replay(bars[id].root, 'hit'); sfx(d.farming || d.charring ? 'sow' : 'pour'); save(); }
  return true;
}

function harvestMould(id, i, auto) {
  if (!isBench(id)) return false;
  const o = S.ores[id];
  if (!o.unlocked) return false;
  const m = syncMoulds(id)[i];
  if (!m || m.s !== 'ready') return false;
  const gain = yieldOf(id);
  if (BY_ID[id].farming) {
    // the field's larder holds each crop up to the field's storage
    const kind = m.kind || 'grain', cap = capOf(id);
    if (o.crops[kind] >= cap) return false;
    o.crops[kind] = Math.min(cap, o.crops[kind] + gain);
    o.amount = o.crops.grain;
    o.lifetime += gain;
    m.s = 'empty'; m.t = 0; m.kind = undefined;
    floatText(id, '+' + fmt(gain) + ' ' + CROPS[kind].name.toUpperCase(), CROPS[kind].color);
    punch(id);
    if (!auto) { sfx('reap'); save(); }
    return true;
  }
  // a full store leaves the bar sat in its mould rather than losing it
  if (isFull(id)) return false;
  addOre(id, gain);
  m.s = 'empty'; m.t = 0;
  floatText(id, '+' + fmt(gain), BY_ID[id].color);
  punch(id);
  if (!auto) { sfx(BY_ID[id].farming ? 'reap' : 'clink'); save(); }
  return true;
}

/* One automated press: clear a set mould first, since that is what frees the
   mould to be filled again. Returns false when there is nothing worth doing. */
function autoPressMould(id) {
  const list = syncMoulds(id);
  for (let i = 0; i < list.length; i++)
    if (list[i].s === 'ready' && harvestMould(id, i, true)) return true;
  if (BY_ID[id].farming) {
    // the hand at the field takes any plot one step further along
    for (const st of ['planted', 'plowed', 'empty'])
      for (let i = 0; i < list.length; i++)
        if (list[i].s === st && pressPlot(id, i, true)) return true;
    return false;
  }
  for (let i = 0; i < list.length; i++)
    if (list[i].s === 'empty' && fillMould(id, i, true)) return true;
  return false;
}

/* ---- the rack ----
   A spare chip clicked is worn, swapping with whatever was on; the × on any
   chip melts it for a little iron back. Both are direct actions. */
function findGear(uid) {
  for (const k of GEAR_SLOTS) {
    const g = S.gear[k];
    if (g.eq && g.eq.uid === uid) return { slot: k, where: 'eq', i: -1, item: g.eq };
    for (let i = 0; i < 2; i++) if (g.bak[i] && g.bak[i].uid === uid) return { slot: k, where: 'bak', i, item: g.bak[i] };
  }
  return null;
}
function wearGear(uid) {
  const f = findGear(uid);
  if (!f || f.where !== 'bak') return false;
  const g = S.gear[f.slot];
  const was = g.eq;
  g.eq = f.item; g.bak[f.i] = was;
  // a run in progress keeps its hero at the same share of a new maximum
  replay(bars.gear.root, 'hit');
  sfx('equip');
  save();
  return true;
}
/* drop a piece on a place in its row: the worn slot wears it (whatever was
   there steps down), a spare slot shelves it (whatever was there comes up or
   moves over). A piece never leaves its own row. */
function moveGear(uid, slot, pos) {
  const f = findGear(uid);
  if (!f || f.slot !== slot) return false;
  if (pos !== 'eq' && isReserved(slot, Number(pos))) return false;
  const g = S.gear[slot];
  const take = () => { if (f.where === 'eq') g.eq = null; else g.bak[f.i] = null; };
  if (pos === 'eq') {
    if (f.where === 'eq') return false;
    const was = g.eq;
    take(); g.eq = f.item;
    if (was) g.bak[f.i] = was;
    sfx('equip');
  } else {
    const i = Number(pos);
    if (f.where === 'bak' && f.i === i) return false;
    const was = g.bak[i];
    take(); g.bak[i] = f.item;
    if (was) { if (f.where === 'eq') g.eq = was; else g.bak[f.i] = was; }
    sfx('tick');
  }
  replay(bars.gear.root, 'hit');
  save();
  return true;
}

function meltGear(uid) {
  const f = findGear(uid);
  if (!f) return false;
  const g = S.gear[f.slot], M = GEAR_MATS[f.item.mat || 'iron'];
  if (f.where === 'eq') g.eq = null; else g.bak[f.i] = null;
  addOre(M.pay, M.back);
  const r = S.ores.recycle;
  if (r) { r.lifetime += 1; punch('recycle'); }
  floatText('recycle', '+' + M.back + ' ' + resWord(M.pay), BY_ID[M.pay].color);
  sfx('melt');
  save();
  return true;
}
document.addEventListener('click', ev => {
  const x = ev.target.closest && ev.target.closest('.gx');
  if (x) { ev.stopPropagation(); meltGear(+x.dataset.melt); return; }
  // a chip that was just dragged is not being clicked
  if (gdragged) { gdragged = false; ev.stopPropagation(); ev.preventDefault(); return; }
  const c = ev.target.closest && ev.target.closest('.gchip.bak[data-uid]');
  if (c) { ev.stopPropagation(); wearGear(+c.dataset.uid); }
}, true);

/* ---- dragging gear ----
   Any chip on the rack, worn or spare, can be picked up and carried to the
   bench. A press that does not move stays a click. The ghost lives in the
   viewport, so zoom never stretches it. */
let gdrag = null, gdragged = false;
const gghost = document.getElementById('gghost');
document.addEventListener('pointerdown', ev => {
  const c = ev.target.closest && ev.target.closest('.gchip');
  if (!c) return;
  ev.stopPropagation();                        // never a pan
  if (ev.button !== 0 || !c.dataset.uid || ev.target.closest('.gx')) return;
  gdrag = { uid: +c.dataset.uid, sx: ev.clientX, sy: ev.clientY, id: ev.pointerId, moved: false, over: false, html: c.outerHTML };
}, true);
window.addEventListener('pointermove', ev => {
  if (!gdrag || ev.pointerId !== gdrag.id) return;
  if (!gdrag.moved) {
    if (Math.hypot(ev.clientX - gdrag.sx, ev.clientY - gdrag.sy) < 5) return;
    gdrag.moved = true;
    gghost.innerHTML = gdrag.html;
    gghost.classList.add('show');
    hovered = null; hidePop();
  }
  gghost.style.left = ev.clientX + 'px';
  gghost.style.top = ev.clientY + 'px';
  const n = document.elementFromPoint(ev.clientX, ev.clientY);
  gdrag.over = !!(n && n.closest && n.closest('.bslot'));
  gdrag.overPile = !!(n && n.closest && n.closest('.rslot'));
  // a chip in the rack lights up when the carried piece could land there
  const chip = n && n.closest && n.closest('.gchip[data-pos]');
  const f = findGear(gdrag.uid);
  const rowSlot = chip && chip.closest('.gchips') && chip.closest('.gchips').dataset.slot;
  const ok = chip && f && rowSlot === f.slot && !(chip.dataset.uid && +chip.dataset.uid === gdrag.uid) && !chip.classList.contains('forging');
  if (gdrag.chip && gdrag.chip !== chip) { gdrag.chip.classList.remove('over', 'bad'); gdrag.chip = null; }
  if (chip && chip !== gdrag.chip) { gdrag.chip = chip; chip.classList.add(ok ? 'over' : 'bad'); }
});
function endGearDrag(ev) {
  if (!gdrag || ev.pointerId !== gdrag.id) return;
  const D = gdrag;
  gdrag = null;
  gghost.classList.remove('show');
  if (D.chip) D.chip.classList.remove('over', 'bad');
  if (!D.moved || ev.type === 'pointercancel') return;
  gdragged = true;                              // swallow the click that follows
  setTimeout(() => { gdragged = false; }, 0);
  const n = document.elementFromPoint(ev.clientX, ev.clientY);
  if (!n || !n.closest) return;
  if (n.closest('.bslot')) { benchTake(D.uid); return; }
  if (n.closest('.rslot')) { if (!S.ores.recycle.unlocked || !meltGear(D.uid)) sfx('no'); return; }
  const chip = n.closest('.gchip[data-pos]');
  if (chip) {
    const rowSlot = chip.closest('.gchips') && chip.closest('.gchips').dataset.slot;
    if (!moveGear(D.uid, rowSlot, chip.dataset.pos)) sfx('no');
  }
}
window.addEventListener('pointerup', endGearDrag);
window.addEventListener('pointercancel', endGearDrag);

/* ---- the field ----
   One press moves a plot one step along: bare -> plowed -> planted (a seed
   from the battle) -> watered (a full bucket) -> growing -> ripe -> reaped. */
function pressPlot(id, i, auto) {
  const d = BY_ID[id];
  if (!d || !d.farming) return false;
  const o = S.ores[id];
  if (!o.unlocked) return false;
  const m = syncMoulds(id)[i];
  if (!m) return false;
  if (m.s === 'ready') return harvestMould(id, i, auto);
  const cropKind = m.s === 'planted' ? (m.kind || 'grain') : o.seedKind;
  if (cropsHeld(cropKind) >= capOf(id)) return false;
  if (m.s === 'empty') { m.s = 'plowing'; m.t = PLOW_TIME; if (!auto) sfx('plow'); }
  else if (m.s === 'plowed') {
    const kind = o.seedKind;
    if (seedsHeld(kind) < 1) return false;
    S.ores.battle.seedsOf[kind] -= 1; m.s = 'planted'; m.kind = kind; if (!auto) sfx('sow');
  }
  else if (m.s === 'planted') {
    if (!takeBucket()) return false;
    m.s = 'cool'; m.t = CROPS[m.kind || 'grain'].grow; if (!auto) sfx('water');
  }
  else return false;
  if (!auto) { replay(bars[id].root, 'hit'); save(); }
  return true;
}

/* ---- the sky ----
   A hold, not a click: the cycle moves for exactly as long as the button is
   down. Releasing anywhere lets go, and so does the pointer being cancelled. */
function holdWater(kind) {
  const o = S.ores.water;
  if (!o.unlocked) return false;
  o.holding = kind === 'sun' || kind === 'cloud' ? kind : null;
  hovered = null; hidePop();
  return !!o.holding;
}
function releaseWater() {
  const o = S.ores.water;
  if (!o.holding) return;
  o.holding = null;
  save();
}
window.addEventListener('pointerup', releaseWater);
window.addEventListener('pointercancel', releaseWater);
window.addEventListener('blur', releaseWater);

/* Clicking a resource tile is how you go and stand at it. Clicking the furnace
   just lights it — the worker never leaves the tile they were on. The bench's
   card does nothing at all: its moulds are the only controls on it. */
function tileClick(id) {
  if (BY_ID[id].facility) { stokeFurnace(true); return; }
  if (isBench(id) || BY_ID[id].bucketing || BY_ID[id].water || BY_ID[id].gearing || BY_ID[id].recycling) return;
  if (BY_ID[id].enhancing) { const j = S.ores.bench.job; if (j && j.phase === 'done' && !benchReturn()) sfx('no'); return; }
  if (BY_ID[id].battling) { toggleBattle(); return; }
  work(id);
}

/* one click switches the battle on, the next switches it off; a run in
   progress is kept where it stands either way */
/* one click starts a run; a click mid-run is the hero running away. Neither
   works while it is fallen, and a run needs the hero at full health. */
function toggleBattle() {
  const o = S.ores.battle;
  if (!o.unlocked) return false;
  if (o.cooldown > 0) { sfx('no'); replay(bars.battle.root, 'hit'); return false; }
  if (o.active) return false;                    // a run, once started, runs
  if (o.heroHp < heroMaxRest() - 1e-6) { sfx('no'); replay(bars.battle.root, 'hit'); return false; }
  o.auto = true;
  replay(bars.battle.root, 'hit');
  sfx('tick');
  save();
  return true;
}

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Wipe all progress and start over?')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage unavailable */ }
  S = freshState();
  rebuildBoard(false);
  openingCam();
});
document.getElementById('cam-in').addEventListener('click', () => zoomCenter(1.25));
document.getElementById('cam-out').addEventListener('click', () => zoomCenter(1 / 1.25));
document.getElementById('cam-fit').addEventListener('click', () => { fitCam(); save(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); nextWork(); return; }
  if (e.key === '0')            { fitCam(); save(); return; }
  if (e.key === '+' || e.key === '=') { zoomCenter(1.25); return; }
  if (e.key === '-' || e.key === '_') { zoomCenter(1 / 1.25); return; }
});

let relayout;
window.addEventListener('resize', () => {
  clearTimeout(relayout);
  relayout = setTimeout(() => { applyCam(); hidePop(); }, 120);
});

/* =========================================================================
   BOOT
   ========================================================================= */

S = load();
const astraSavedAt = S.astra.lastSeen;
buildEmbers();
buildBars();
awardMilestones();
catchUpAstra((Date.now() - astraSavedAt) / 1000);
rebuildBoard(false);
pendingUnlock = false;
save();
if (S.cam) { cam = S.cam; applyCam(); } else openingCam();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); astraHiddenAt = Date.now(); }
  else if (astraHiddenAt !== null) {
    const elapsed = (Date.now() - astraHiddenAt) / 1000;
    astraHiddenAt = null; catchUpAstra(elapsed);
    if (pendingUnlock) { pendingUnlock = false; rebuildBoard(true); }
    lastT = performance.now(); save(); paint();
  }
});
// Reflow after the first paint and whenever card content changes height.
if (typeof ResizeObserver !== 'undefined') {
  let layoutQueued = false;
  const observer = new ResizeObserver(() => {
    if (layoutQueued) return;
    layoutQueued = true;
    requestAnimationFrame(() => {
      layoutQueued = false;
      layoutAstraCards(); buildLinks(); syncLinks(); placeLabels();
    });
  });
  ORES.filter(d => !d.hosted).forEach(d => observer.observe(bars[d.id].root));
}
window.addEventListener('pagehide', save);
setInterval(save, 10000);
requestAnimationFrame(t => { lastT = t; tick(t); });

// debug handle — lets the sim be driven without a compositing frame loop
window.__sw = {
  get state() { return S; },
  get cam() { return cam; },
  get worked() { return S.worked; },
  step, paint, tileClick, work, nextWork, workableIds, isWorkable, isWorked, canAuto,
  renderStrips, buildLinks, rebuildBoard, save, stokeFurnace,
  fillBar: (i) => fillMould('bars', i),
  harvestBar: (i) => harvestMould('bars', i),
  moulds: () => S.ores.bars.moulds.map(m => ({ s: m.s, t: m.t })),
  mouldCount, mouldCountAt, mouldAutoEvery, autoPressMould, syncMoulds, MOULDS,
  MOULD_FILL_COST, MOULD_COOL_TIME, MOULD_AUTO_INTERVAL, MOULD_BASE,
  isBench, plotCount, plotTime, plotCost, plotWords,
  rawFlow, flowNow, riverFloor, riverGate, riverSpend, riverStone, spendFlow, bucketCost, bucketFillRate,
  holdWater, releaseWater, bucketSpec, riverSpec, SFX, sfx,
  get gear() { return S.gear; },
  rollGear, gearStats, gearName, heroStats, wearGear, meltGear, findGear, forgeSpec, freeBackup,
  enemyFor, goldFor, startRun, toggleBattle, pressPlot, fullBuckets, takeBucket, seedsHeld, cropsHeld, AUTO_BASE, GOLD,
  CROPS, CROP_KINDS, seedKindFor, tryPoultice, MEAL_HP, TONIC_ATK, POULTICE_AT, POULTICE_HEAL, POULTICE_CD,
  heroSvg, enemySvg, ENEMY_SVG, GEAR_MATS, DROPS, steelHot, costWords, costSyms, extraLine,
  benchTake, benchConfirm, benchReturn, moveGear, enhCost, enhChance, enhEmbers, ENH_TIME, ENH_CHANCE, ENH_STEP,
  rollDrops, collectDrop, floorOf, floorCount, embersHeld, EMBER, LOOT_ROWS, emberChance, emberKindFor,
  START_WAVES, startCost, startOpenAt, startChoices, buyStart, setStart,
  forgeJob, isReserved, TIER_COLOR,
  CLAMP_WOOD, CLAMP_TIME, STEEL_IRON, STEEL_CHAR, STEEL_TIME, STEEL_HEAT,
  GEAR_SLOTS, FORGE_COST, MELT_BACK, BATTLE_COOLDOWN, FIELD_SIZE, PLOW_TIME, DMG_MULT, heroDamage, enemyDamage, flee, heroMaxRest, FLEE_REGEN_TIME,
  autoGathers, resWord, heatMax, heatMaxAt, heatCeilingRaw, LINING,
  WATER_TOTAL, CYCLE_RATE, FLOW_WINDOW, FLOW_MAX, BUCKET_SIZE, BUCKET_FILL_K, BUCKET_MAX, RIVER_MAX,
  get pendingUnlock() { return pendingUnlock; },
  flushUnlock() { if (pendingUnlock) { pendingUnlock = false; commitUnlock(); } },
  FURROW_GROW_TIME, FURROW_BASE, fillMould, harvestMould,
  unlockProgress, costProgress, costOf, aboveOf, payOre, autoFeeds, liveSet,
  autoRate, autoRateAt, heatRate, heatRateAt, totalRate, showPop, hidePop, hasHeat, heatBlocked,
  stokeCooldown, heatCeiling, heatLoss, furnaceReady, isFull, BELLOWS, STOKER, stokerRate, stokerWood, STOKER_EVERY,
  isRevealed, syncReveal, syncTiles, syncLinks, rebuildBoard, refreshUps,
  revealed, revealedBounds, tileBox, commitUnlock, save, load,
  fitCam, openingCam, zoomAt, applyCam, placeLabels,
  LINKS, UPGRADES, TILE_UPGRADES, AUTO, ORES, WORLD,
  // muted while fast-forwarding: a thousand cycles is a thousand float labels
  advance(seconds, slice = 1/60) {
    fxOff = true;
    try { for (let t = 0; t < seconds; t += slice) step(slice); }
    finally { fxOff = false; }
    if (pendingUnlock) { pendingUnlock = false; commitUnlock(); }
    paint();
  },
  stats: (id) => ({ cap: capOf(id), yield: yieldOf(id), time: timeOf(id),
                    auto: autoRate(id), heat: heatRate(id), total: totalRate(id) }),
};
</script>
