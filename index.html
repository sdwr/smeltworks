<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smeltworks</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">Smeltworks</div>
    <button id="btn-travel" class="where" title="Choose where to fight">
      <span id="where-act"></span><b id="where-area"></b><span id="where-lvl"></span>
    </button>
    <div class="ctl">
      <button id="btn-sound" class="icon" title="Sound">♪</button>
      <button id="btn-menu" class="icon" title="Settings">⚙</button>
    </div>
  </header>

  <main id="main">
    <aside id="craft">
      <nav id="tabs">
        <button data-tab="skills">Skills<i id="pts-badge"></i></button>
        <button data-tab="craft" class="on">Crafting</button>
        <button data-tab="commission">Commission</button>
      </nav>
      <div id="panel">
        <div id="tab-skills" class="tab hidden"></div>
        <div id="tab-craft" class="tab"></div>
        <div id="tab-commission" class="tab hidden"></div>
      </div>
    </aside>

    <section id="char">
      <div class="purse" id="purse">
        <div id="purse-pops"></div>
        <div id="xprow">
          <div id="xpbar" data-tip="Kills fill this bar. When it is full, one piece you are wearing that has no offer waiting gets a free transmute: it sparkles, and its three offers are on the bench when you click it. Monsters well below your gear level fill it more slowly, and those 13 levels below not at all."><i></i><span></span></div>
          <button id="xpfree" class="hidden" data-tip="Free transmutes waiting on your gear. Click to put the next sparkling piece on the bench and see its three offers."></button>
        </div>
        <span class="cur gold" data-tip="Gold. Dropped by everything. Pays for commissions, rerolling an affix and transfiguring."><i></i><b id="cur-gold">0</b></span>
        <span class="cur dust" data-tip="Ember dust, the one crafting material. From salvaging any gear (more from better pieces), from elites and bosses, and now and then from ordinary monsters. Masterworking and transmutes are paid in it; rerolling an affix and transfiguring take some too."><i></i><b id="cur-dust">0</b></span>
      </div>
      <div id="tab-gear"></div>
      <div id="bagwrap">
        <div id="baghead"></div>
        <div id="bag"></div>
      </div>
      <div id="stashwrap">
        <div id="stashhead"></div>
        <div id="stash"></div>
      </div>
      <div id="gear-stats"></div>
    </section>

    <section id="combat">
      <div id="cooldown"></div>
      <div id="arena">
        <canvas id="cv"></canvas>
        <div id="banner"></div>
        <div id="feed"></div>
        <div id="bossbar" class="hidden"><div class="bb-name"></div><div class="bb-bar"><i></i><em></em></div><div class="bb-tags"></div></div>
        <div id="hud">
          <div class="orb hp" id="orb-hp" data-tip="Life. It does not refill after a battle: you start the next fight with what you have left. Walking brings a little back, a shrine restores it all, and so does a fall or a new map."><i></i><u></u><span></span></div>
          <div id="bar"></div>
          <div class="orb heat" id="orb-heat" data-tip="Heat. Basic skills build it, Core skills spend it."><i></i><span></span></div>
        </div>
        <div id="buffs"></div>
        <div id="depth" data-tip="How far you get on this level, counted in rooms cleared: fights, chests and shrines alike. Shown for the run you are on, the last run you finished, and the most you have cleared in one run here."></div>
        <div id="meter" data-tip="Measured damage per second while enemies are alive, and where it came from over your last ten fights. Overkill is not counted."></div>
      </div>
      <div id="mapwrap">
        <div id="mapbar">
          <div class="map-title"><b id="map-name"></b><span id="map-sub"></span></div>
          <div class="map-ctl">
            <div class="seg" id="speed">
              <button data-speed="0" title="Pause (Space)">❚❚</button>
              <button data-speed="1">1×</button>
              <button data-speed="2">2×</button>
              <button data-speed="4">4×</button>
            </div>
            <button id="btn-auto" class="toggle" title="Explore and fight without waiting for you (A)">Auto</button>
          </div>
          <div class="map-opts">
            <label class="chk" data-tip="Clear every room before the boss. More loot and dust; turn it off to head straight for the boss."><input type="checkbox" id="opt-full"><span>Clear everything</span></label>
            <label class="chk" data-tip="When Auto beats a level's boss: push on to the furthest level you have unlocked, or run this one again."><input type="checkbox" id="opt-advance"><span>Push forward</span></label>
            <button id="btn-route" class="small hidden" data-tip="Forget the route you have clicked. A room the smith is already heading for stays.">Clear route</button>
            <button id="btn-restart" class="small" data-tip="Abandon this map and start the area again with a new layout.">New map</button>
          </div>
        </div>
        <div id="map"></div>
        <div id="hint"></div>
      </div>
    </section>
  </main>
</div>

<div id="tooltip" class="hidden"></div>
<div id="tooltip2" class="hidden"></div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/items.js"></script>
<script src="js/hero.js"></script>
<script src="js/combat.js"></script>
<script src="js/game.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
